        - 'heading "📕 Разбор: почему так правильно" [level=4] [ref=e197]'
        - generic [ref=e198]:
          - generic [ref=e199]: My — ты сказала «am»
          - generic [ref=e200]: "👉 My — «мой, моё». My name — «моё имя». Для «меня зовут» по-английски говорят не «я зовусь», а «моё имя есть». Запомни: I — «я», my — «мой»."
        - generic [ref=e201]:
          - generic [ref=e202]: name — пропущено
          - generic [ref=e203]: "👉 name — «имя». Стоит сразу после my. Запомни: My name is... — «меня зовут...»."
        - generic [ref=e204]:
          - generic [ref=e205]: is — пропущено
          - generic [ref=e206]: "👉 is — «есть». Буквально: «моё имя ЕСТЬ Вита». По-русски «есть» не говорим, по-английски глагол нужен всегда. Про name говорим is, не am. Запомни: name → is."
          - generic [ref=e207]: "Правило (is — «есть» (он, она, оно)): В английском глагол-связка нужен всегда: the price is low. Русские его пропускают («цена низкая»). Для he/she/it и одного предмета — is.The price is very good. — Цена очень хорошая.Запомни: без is/are в английском фразы не бывает."
        - generic [ref=e208]:
          - generic [ref=e209]: Vita — пропущено
          - generic [ref=e210]: 👉 Vita — твоё имя. Имена пишем с большой буквы. После is идёт само имя.
        - generic [ref=e211]:
          - generic [ref=e212]: and — пропущено
          - generic [ref=e213]: "👉 and — «и». Соединяет две части: имя и занятие. Запомни: and — «и», две мысли в одной фразе."
          - generic [ref=e214]: "Правило (and — «и»): Соединяет слова и части: price and quality. В перечислении из трёх запятые, and перед последним: price, quality, and delivery.We sell clothes and shoes. — Мы продаём одежду и обувь.Запомни: and — перед последним в списке."
        - generic [ref=e215]:
          - generic [ref=e216]: I — пропущено
          - generic [ref=e217]: "👉 I — «я». Начинается новая часть: «я продаю». Подлежащее нужно снова, нельзя пропустить, как по-русски. Запомни: I — всегда с большой буквы."
        - generic [ref=e218]:
          - generic [ref=e219]: sell — пропущено
          - generic [ref=e220]: "👉 sell — «продаю». После I — без -s: I sell. Sells — только he/she/it. Запомни: sell — продавать; sell clothes — продавать одежду."
        - generic [ref=e221]:
          - generic [ref=e222]: clothes — пропущено
          - generic [ref=e223]: "👉 clothes — «одежда». Слово только во множественном числе: clothes, без a. Одна вещь — a piece of clothing. Запомни: clothes — как «брюки», всегда мн. число."
        - generic [ref=e224]:
          - generic [ref=e225]: on — пропущено
          - generic [ref=e226]: "👉 on — «на». Продаём на площадке: on Wildberries. In — «внутри чего-то», здесь не подходит. Запомни: на сайте и маркетплейсе → on."
          - generic [ref=e227]: "Правило (on — «на поверхности, в день»): Для дней и дат (on Monday, on May 5) и «на чём-то»: on the website, on Ozon. Платформы и сайты — тоже on.We sell our products on Wildberries. — Мы продаём наши товары на Wildberries.Запомни: on — день и «на» сайте: on Monday, on Ozon."
        - generic [ref=e228]:
          - generic [ref=e229]: Wildberries — пропущено
          - generic [ref=e230]: "👉 Wildberries — название маркетплейса. Названия пишем с большой буквы и без the. Запомни: on Wildberries — без the."
        - generic [ref=e231]:
          - generic [ref=e232]: and — пропущено
          - generic [ref=e233]: "👉 and — «и». Перечисляем вторую площадку. Запомни: A and B — две площадки."
          - generic [ref=e234]: "Правило (and — «и»): Соединяет слова и части: price and quality. В перечислении из трёх запятые, and перед последним: price, quality, and delivery.We sell clothes and shoes. — Мы продаём одежду и обувь.Запомни: and — перед последним в списке."
        - generic [ref=e235]:
          - generic [ref=e236]: Ozon — пропущено
          - generic [ref=e237]: "👉 Ozon — название маркетплейса. Без the. Запомни: on Ozon."
