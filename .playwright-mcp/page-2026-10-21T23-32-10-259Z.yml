              - generic [ref=e85]: "👉 for — «за». По-русски «отвечать ЗА что-то», и по-английски тоже for: responsible for sales. Правило: после responsible всегда for, а дальше то, за что отвечаешь (слово или глагол с -ing). Запомни: responsible for, не of и не on."
              - generic [ref=e86]: "Правило (for — «для, на срок»): Говорит «для кого/чего» или «на какой срок»: for clients, for two weeks. Не путай с since: for — сколько длится, since — с какого момента.We sell this dress for women. — Мы продаём это платье для женщин.Запомни: for = для; for + срок (for 3 days)."
