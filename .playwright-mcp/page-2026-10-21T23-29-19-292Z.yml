            - generic [ref=e80]: "👉 the — перед названием должности или отдела: речь об одной конкретной, понятной обоим (the Sales department, the manager). Правило: единственный и понятный собеседнику → the. По-русски артикля нет, поэтому его легко забыть. Запомни: должность или отдел → the."
            - generic [ref=e81]: "Правило (the — «тот самый»): Ставим, когда собеседнику понятно, о каком предмете речь: он уже был упомянут или он один такой. Русские часто его пропускают.Please check the invoice. — Пожалуйста, проверьте инвойс (тот, что мы обсуждали).Запомни: «тот самый, понятно какой» — the."
