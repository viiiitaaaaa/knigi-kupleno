        - generic [ref=e91]:
          - generic [ref=e92]: Is — ты сказала «can»
          - generic [ref=e93]: "👉 Is — «есть». Вопрос про skirt (одна юбка) → Is. Запомни: одна → is."
          - generic [ref=e94]: "Правило (is — «есть» (он, она, оно)): В английском глагол-связка нужен всегда: the price is low. Русские его пропускают («цена низкая»). Для he/she/it и одного предмета — is.The price is very good. — Цена очень хорошая.Запомни: без is/are в английском фразы не бывает."
        - generic [ref=e95]:
          - generic [ref=e96]: smaller — ты сказала «be»
          - generic [ref=e97]: "👉 smaller — «меньше». small + er → smaller. Сравнительная степень. Запомни: короткое слово + -er = «более»."
        - generic [ref=e98]:
          - generic [ref=e99]: than — ты сказала «used»
          - generic [ref=e100]: "👉 than — «чем». Сравниваем: меньше, ЧЕМ обычный. Запомни: than — после сравнения."
          - generic [ref=e101]: "Правило (than — «чем» (в сравнении)): Только после сравнения: cheaper than, more than. Русские путают then и than. Than — для сравнения, then — «потом».This price is lower than last month. — Эта цена ниже, чем в прошлом месяце.Запомни: сравнение — than; потом — then."
        - generic [ref=e102]:
          - generic [ref=e103]: the — ты сказала «for»
          - generic [ref=e104]: "👉 the — «обычного». Размер известен всем — стандартный. Запомни: the usual size."
          - generic [ref=e105]: "Правило (the — «тот самый»): Ставим, когда собеседнику понятно, о каком предмете речь: он уже был упомянут или он один такой. Русские часто его пропускают.Please check the invoice. — Пожалуйста, проверьте инвойс (тот, что мы обсуждали).Запомни: «тот самый, понятно какой» — the."
        - generic [ref=e106]:
