<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр переговоров</title>
<style>
:root{--bg:#faf7f2;--fg:#2b2b2b;--mut:#6b6b6b;--card:#fff;--line:#e4ddd0;--pri:#c0392b;--priT:#fff;--ok:#1e8449;--okbg:#e6f4ea;--ob:#fff6dc;--xb:#ffeadb;--zb:#fde3e3;--zc:#b00020}
@media (prefers-color-scheme:dark){:root{--bg:#1c1b1a;--fg:#ece8e1;--mut:#a8a29a;--card:#262422;--line:#3a3733;--pri:#e0654f;--priT:#1c1b1a;--ok:#6fcf97;--okbg:#1f3328;--ob:#3a3320;--xb:#3d2c20;--zb:#41231f;--zc:#ff8a80}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:17px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{max-width:680px;margin:0 auto;padding:0 16px 48px}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.45;cursor:default}
.topbar{display:flex;align-items:center;gap:8px;padding:12px 0;position:sticky;top:0;background:var(--bg);z-index:5}
.tb-mid{flex:1;text-align:center;font-weight:600;font-size:15px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pts{font-weight:700;white-space:nowrap}
.hero{padding:18px 0 6px}.hero-t{font-size:26px;font-weight:800;line-height:1.2}.hero-s{color:var(--mut);margin-top:6px}
.warn,.note{background:var(--ob);border-radius:12px;padding:10px 14px;margin:10px 0;font-size:15px}
.stats{display:flex;gap:10px;margin:14px 0}.stat{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 6px;text-align:center}
.stat b{display:block;font-size:22px}.stat span{color:var(--mut);font-size:13px}
.lvl{text-align:center;color:var(--mut);font-size:15px;margin-bottom:6px}
.menu{display:flex;flex-direction:column;gap:10px;margin:14px 0}
button.big{min-height:54px;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px 16px;font-size:18px;text-align:left}
button.primary{background:var(--pri);color:var(--priT);border:0;border-radius:14px;font-weight:700;padding:12px 18px;min-height:48px}
button.big.primary{font-size:19px}
button.ghost,label.ghost{background:transparent;border:1px solid var(--line);border-radius:12px;padding:8px 14px;min-height:42px;display:inline-flex;align-items:center}
button.danger{color:var(--zc);border-color:var(--zc)}
.file input{display:none}
.sec-t{font-weight:700;margin:20px 0 8px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.book{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bc);border-radius:12px;padding:10px 12px;text-align:left;display:flex;flex-direction:column;min-height:62px}
.book small{color:var(--mut)}
.menu2{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}
.badges{display:flex;flex-wrap:wrap;gap:8px}.badge{background:var(--okbg);border-radius:20px;padding:4px 12px;font-size:14px}
.prog{height:6px;background:var(--line);border-radius:3px;margin-bottom:12px}.prog i{display:block;height:100%;background:var(--pri);border-radius:3px;transition:width .3s}
.scene{margin-bottom:12px}.chips{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.chip{color:#fff;border-radius:20px;padding:2px 12px;font-size:13px}.chip.ch{background:var(--mut)}
.ctx{color:var(--mut);margin-bottom:8px}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:4px 18px 18px 18px;padding:12px 16px;font-size:19px;margin:8px 0;max-width:92%}
.bubble.you{margin-left:auto;background:var(--okbg);border-radius:18px 4px 18px 18px;font-size:17px}
.who{display:block;font-size:13px;color:var(--mut);margin-bottom:2px}
.box{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.lab{font-weight:700;margin-bottom:6px}.lab small{font-weight:400;color:var(--mut)}
.hint{color:var(--mut);font-size:15px;margin-bottom:8px}.pad{padding:6px 0}
textarea{width:100%;font:inherit;border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg);color:var(--fg);resize:vertical}
.row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px;margin:8px 0;min-height:52px}
.opt b{background:var(--pri);color:var(--priT);width:26px;height:26px;border-radius:50%;text-align:center;line-height:26px;flex:none;font-size:14px}
.verdict{border-radius:12px;padding:10px 14px;margin:12px 0}
.v-b{background:var(--okbg)}.v-o{background:var(--ob)}.v-x{background:var(--xb)}.v-z{background:var(--zb)}
.rv{border-radius:12px;padding:10px 12px;margin:8px 0;border:2px solid transparent}.rv.picked{border-color:var(--fg)}
.rv-h{font-weight:700;font-size:15px}.rv-t{margin:4px 0;font-size:17px}.rv-r{font-style:italic;color:var(--mut);font-size:15px;margin-bottom:4px}.rv-w{font-size:15px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.tag{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:3px 12px;font-size:14px}.tag.on{background:var(--fg);color:var(--bg)}
.better{border-color:var(--ok)}.bt{font-size:18px}
.mine,.jr-p{background:var(--bg);border-radius:10px;padding:8px 10px;margin:6px 0;white-space:pre-wrap;font-size:15px}
.hl{margin:4px 0 0;padding-left:20px;font-size:15px}
.line{padding:6px 10px;border-radius:8px;margin:4px 0;font-size:15px}
.cards{display:flex;flex-direction:column;gap:10px}.card{background:var(--card);border:1px solid var(--line);border-left:6px solid var(--bc);border-radius:12px;padding:12px 14px}
.card-h{font-weight:700;font-size:18px}.card-h small{display:block;color:var(--mut);font-weight:400;font-size:13px}.card p{margin:6px 0}.card .no{color:var(--zc);font-size:15px}
#modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;overflow:auto}
.mwrap{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}.mcard{background:var(--bg);border-radius:16px;padding:14px;max-width:560px;width:100%}
.jr{border-radius:10px;padding:8px 12px;margin:8px 0}.jr-h{font-size:14px;color:var(--mut)}
.about p{margin:8px 0}

</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script>
// Книги и карточки приёмов. Источник: sistema\*\02_priyomy.md и правила скиллов dogovorennosti / love-scripts (19.10.2026).
// Пометка «не из книги» — общее правило без источника в книге (так решила Вита, правило 10).
var BOOKS = {
  voss:  { n: "Восс «Никогда не соглашайся наполовину»", s: "Восс", c: "#c0392b", e: "🎯" },
  weiss: { n: "Вайс — деньги и договорённости", s: "Вайс", c: "#8e44ad", e: "💼" },
  klaff: { n: "Клафф «Питч»", s: "Клафф", c: "#d35400", e: "🎤" },
  mom:   { n: "Тест мамы (Mom Test)", s: "Тест мамы", c: "#27ae60", e: "👂" },
  hall:  { n: "Холл — НЛП и переписка", s: "Холл (НЛП)", c: "#2980b9", e: "💬" },
  gen:   { n: "Общие правила (не из книги)", s: "Общее", c: "#7f8c8d", e: "🧭" }
};

var CARDS = {
  ASKFIRST: { b: "gen", n: "Сначала один вопрос",
    s: "Если ответ зависит от того, чего ты не знаешь (сколько часов, что было до этого, есть ли письменные условия) — сначала ОДИН вопрос по сути, и только потом ответ.",
    e: "Не «а как, а что, а почему» пачкой, а один: «Что в этой работе ты считаешь простым?»",
    no: "Когда у тебя уже есть все данные — вопрос лишний, отвечай сразу." },
  PLACE: { b: "gen", n: "Пропуск «__» вместо выдуманных цифр",
    s: "Свои цифры, ставки и кейсы я за тебя не придумываю. В шаблонах стоит «__» — там твоя настоящая цифра.",
    e: "«Цена — __ за этап» — а число ты берёшь из своих часов и рынка.",
    no: "" },
  NOBLUFF: { b: "gen", n: "Без блефа: «правда + реальный выбор»",
    s: "Не выдумывай «другого поставщика», «других заказчиков», срок «до пятницы», скидку «только сегодня». Если твой ход вызвал у человека защиту или отдаление — ты перегнула: сбавь и вернись к вопросу.",
    e: "Вместо «у меня есть другой клиент» — «что входит в их предложение?».",
    no: "" },
  SAFE: { b: "gen", n: "Граница и безопасность",
    s: "Угроза, крик, давление «приезжай сегодня» — это не повод для приёмов-вежливости. Первое — граница и безопасность; право сказать «нет» без объяснений. Юридическую оценку даёт юрист, медицинскую — врач. Номера служб здесь не пишу — ищи для своего региона.",
    e: "«Так со мной разговаривать нельзя, я заканчиваю разговор.» Скриншоты сохранить, близкому рассказать.",
    no: "" },
  DEF: { b: "gen", n: "Защита: узнать давление",
    s: "Приёмы давления (срочность, «другие покупатели», «последний шанс») — признак → как работает → что ответить. Не решай в день предложения, проверь факты, попроси письменно.",
    e: "«Спасибо. Проверю остаток и условия и отвечу к __.»",
    no: "" },
  NOTALK: { b: "voss", n: "Ошибка или возврат — это не торг",
    s: "Двойное списание, брак, возврат по правилам — проверь факт и исправь. Приёмы цены (диапазон, «нет», зеркало) здесь не нужны. (Из правил скилла по Воссу, п. 5.)",
    e: "«Проверила: списано дважды. Возвращаю __, напишу, когда отправлю.»",
    no: "" },

  MIR: { b: "voss", n: "Зеркало",
    s: "Повторить 1–3 последних слова вопросительно и помолчать (минимум 4 секунды). Человек сам объясняет подробнее.",
    e: "«Как будет возможность?» — и пауза.",
    no: "Это приём для ГОЛОСА. В чате пауза не работает — там лучше ярлык или вопрос «Что/Как». При угрозе и крике не зеркалить." },
  LAB: { b: "voss", n: "Ярлык (назвать чувство)",
    s: "Назвать чувство человека словами «Похоже, что…», «Кажется, тебе…» — и замолчать. Ты показываешь, что понимаешь, но не соглашаешься.",
    e: "«Похоже, что цена кажется высокой.»",
    no: "При остром состоянии (паника, кризис) нужна безопасность, а не ярлык. Это гипотеза, не диагноз." },
  AUD: { b: "voss", n: "Аудит обвинений",
    s: "Сказать первой самое худшее, что человек может о тебе подумать. Так он не защищается и слышит тебя.",
    e: "«Наверное, ты думаешь, что я усложняю.»",
    no: "Не вставлять в юридические документы — любые слова могут стать признанием." },
  CQ: { b: "voss", n: "Калиброванный вопрос («Как / Что»)",
    s: "Вопрос, на который нельзя ответить «да/нет». «Как» и «Что» заставляют человека думать за тебя и решать твою задачу. Калиброванный — значит «подобранный так, чтобы вести разговор».",
    e: "«Как мне вести работу, если не записано, сколько и когда мне платят?»",
    no: "«Почему» звучит как обвинение — его лучше избегать." },
  NO: { b: "voss", n: "«Нет» как старт",
    s: "Дай человеку право сказать «нет» — ему спокойнее, чем отвечать «да» под давлением.",
    e: "«Тебе будет неудобно, если мы запишем условия на одной странице?»",
    no: "Не используй как ловушку — вопрос задаётся честно." },
  SUM: { b: "voss", n: "Резюме до «Да, именно так»",
    s: "Пересказать своими словами, что он сказал и что чувствует, пока не услышишь «Да, именно так» (That's right). Это не то же самое, что «ты права».",
    e: "«Правильно ли я понимаю: ты боишься заплатить, а результата не получить?»",
    no: "" },
  ANC: { b: "voss", n: "Цена: основание и диапазон",
    s: "Называй цифру только с основанием: часы × ставка + расходы + рынок. Нижняя граница диапазона = твоя цель. Если данных нет — не называй первой, спроси бюджет. Блеф про другие предложения — нет.",
    e: "«Чтобы назвать честную цифру, посчитаю часы и пришлю письменно к __.»",
    no: "Лесенка Акермана (65→85→95→100%) — для ПОКУПКИ; для продажи своей работы это наша адаптация, решение за тобой." },
  TO: { b: "voss", n: "Тайм-аут и письменно",
    s: "Нельзя договариваться «в перестрелку». Когда шумно, срочно или кричат — вернись с письменным ответом позже. Это не слабость, это защита.",
    e: "«Я слышу, что ты недоволен. Вернусь с письменным ответом к __.»",
    no: "Срок называй только такой, который выполнишь." },

  CA: { b: "weiss", n: "Концептуальное соглашение",
    s: "До цены запиши вместе: чего хотим (результат), как поймём, что получилось (метрика), и чем это ценно. Простыми словами: «чего мы хотим от проекта и как поймём, что получилось».",
    e: "«Чтобы назвать честную цену, давай сначала запишем цели и как мы поймём, что получилось.»",
    no: "Не придумывай клиенту «его» цифры — спроси." },
  EB: { b: "weiss", n: "Кто решает о деньгах",
    s: "Выясни, говоришь ли ты с тем, кто может сам подписать оплату. «Согласую с руководителем» — знак, что решает кто-то ещё.",
    e: "«Кто ещё участвует в решении? Подключим его к следующему разговору?»",
    no: "Не пиши руководителю за спиной у собеседника." },
  PRICE: { b: "weiss", n: "Цена после ценности",
    s: "Не называй сумму, пока не договорились о целях. Скажи, что вернёшься письменным предложением — и верни в срок, который выполнишь.",
    e: "«Можно пару вопросов о целях? Потом пришлю предложение с вариантами.»",
    no: "Не выдумывай «срок 24 часа», если не успеешь." },
  PRO: { b: "weiss", n: "Предложение с тремя вариантами",
    s: "Дай 2–3 варианта (например: фикс за этап / фикс + меньший процент / только процент, но выше и с записью, как он считается). Цену ставь в условия, а не в начало.",
    e: "Три варианта на одной странице; цифры вставим после расчёта часов.",
    no: "Не предлагай уступок, которых не просили." },
  NEXT: { b: "weiss", n: "Следующий шаг",
    s: "Заканчивай разговор датой следующего шага. После отправленного предложения — вопрос и предложение времени (в книге — звонок через сутки; в чате иначе: короткий вопрос).",
    e: "«Есть вопросы по предложению? Созвонимся __?»",
    no: "Без выдуманных «срок действия до пятницы» и без давления виной." },
  REF: { b: "weiss", n: "Просить рекомендацию по имени",
    s: "Когда результат есть и клиент доволен, спроси: «Кому ещё может пригодиться то, что я сделала? Познакомишь?». Напомню одной строкой после сданной работы.",
    e: "«Кому ещё может пригодиться то, что я сделала? Познакомишь?»",
    no: "Не пиши отзыв за клиента и не называй его без согласия." },

  TIME: { b: "klaff", n: "Сначала время",
    s: "Скажи, сколько времени тебе нужно, и уложись. Короткое время — не повод бежать: говори по делу, не быстрее.",
    e: "«10 минут хватит. Покажу главное, а дальше — по твоему интересу.»",
    no: "Не говори быстрее и не выпрашивай «ещё немного»." },
  FRAME: { b: "klaff", n: "Чья рамка",
    s: "Рамка — это правила встречи: кто ведёт, о чём говорим. Если собеседник забирает рамку (перебивает, давит статусом), вернись спокойно, без шуток-подколок и унижения.",
    e: "«Сначала закончу мысль — она про оплату и влияет на твой вопрос.»",
    no: "Если твой ход вызвал защиту — сбавь и вернись к вопросу." },
  END: { b: "klaff", n: "Конец без нужды",
    s: "Закончи утверждением и следующим шагом, не выпрашивая одобрения («Ну как? Понравилось?»). Нужда видна и снижает твой вес.",
    e: "«Следующий шаг: пришлю __ к __, ты посмотришь и ответишь до __.»",
    no: "Без блеф-финалов («сделка закроется за 14 дней»)." },
  PUSH: { b: "klaff", n: "Взаимный отбор",
    s: "Ты тоже выбираешь, с кем работать. Задавай проверочные вопросы, называй реальные сроки, имей ответы про свои цифры заранее.",
    e: "«Мои реальные цифры: __ (подставь свои). Могу показать, откуда они.»",
    no: "Не уклоняйся от прямого вопроса и не выдумывай цифры." },

  DEFLECT: { b: "mom", n: "Отвести комплимент",
    s: "«Классная идея!» — не данные. Поблагодари и верни к тому, как человек живёт сейчас.",
    e: "«Спасибо! А когда ты в последний раз покупала такое — как это было?»",
    no: "Не выманивай похвалу и не считай лайки спросом." },
  ANCHOR: { b: "mom", n: "Заякорить: «когда в последний раз»",
    s: "На «обычно», «в будущем», «может быть» спроси про конкретный прошлый случай: когда, где, что делал. Прошлое — факт, будущее — обещание.",
    e: "«Когда ты в последний раз покупала такое платье? Где и что выбирала?»",
    no: "Не спрашивай «купила бы?» и «сколько заплатила бы?» — это обещания, а не факты." },
  DIG: { b: "mom", n: "Копать: «зачем» и «что это даст»",
    s: "За просьбой или сильной эмоцией спрашивай, что человек хочет этим решить. Просьба — не всегда настоящая задача.",
    e: "«Зачем нужна эта кнопка? Что она поможет сделать твоим клиентам?»",
    no: "Не отказывай «сразу, потому что так сказала книга» и не обещай из страха обидеть." },
  COMMIT: { b: "mom", n: "Обязательство и продвижение",
    s: "Конец разговора — не «потом позвоню», а шаг, где человек вкладывает валюту: время, репутацию или деньги. Либо честное «нет».",

// Движок тренажёра. Всё хранится в браузере (localStorage) + выгрузка в файл.
var LS_KEY = "trenazher_peregovory_v1";
var DAY = 86400000;
var INTERVALS = [0, 1, 3, 7, 14, 30];          // дни до повторения для коробок 0..5
var VERD = {
  b: { l: "✅ Лучший ход", c: "v-b", p: 10 },
  o: { l: "🟡 Неплохо, но можно лучше", c: "v-o", p: 5 },

  z: { l: "⛔ Запрещено: блеф, давление, ложь", c: "v-z", p: 0 }
};
var LEVELS = [[0, "Новичок 🌱"], [80, "Слушательница 👂"], [200, "Спокойная в разговоре 🧘"], [400, "Мастер вопроса ❓"], [700, "Цена слова 🏆"]];
var BADGES = {
  first: "🎬 Первый раунд",
  ask5: "❓ Сначала спросила ×5",
  clean: "🕊 Раунд без запрещённых ходов",
  days3: "🔥 3 дня подряд",
  dlg: "💬 Живой разговор пройден",
  own10: "✍️ 10 своих ответов",
  allbooks: "📚 Знаю приёмы всех пяти книг"
};

var memOnly = false;
function blank() { return { pts: 0, cards: {}, answers: [], days: [], badges: [], dialogs: {}, asked: 0, bans: 0, rounds: 0, cleanRound: false }; }
function load() {
  try { var j = localStorage.getItem(LS_KEY); if (j) { var o = JSON.parse(j); return Object.assign(blank(), o); } } catch (e) { memOnly = true; }
  return blank();
}
function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { memOnly = true; } }
var S = load();

function esc(s) { return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function today() { var d = new Date(); return d.getFullYear() + "-" + ("0" + (d.getMonth() + 1)).slice(-2) + "-" + ("0" + d.getDate()).slice(-2); }
function level() { var l = LEVELS[0][1], nxt = null; for (var i = 0; i < LEVELS.length; i++) { if (S.pts >= LEVELS[i][0]) { l = LEVELS[i][1]; nxt = LEVELS[i + 1] || null; } } return { name: l, next: nxt }; }
function streak() {
  var set = {}; S.days.forEach(function (d) { set[d] = 1; });
  var n = 0, dt = new Date();
  if (!set[today()]) dt = new Date(Date.now() - DAY);
  while (true) {
    var k = dt.getFullYear() + "-" + ("0" + (dt.getMonth() + 1)).slice(-2) + "-" + ("0" + dt.getDate()).slice(-2);
    if (set[k]) { n++; dt = new Date(dt.getTime() - DAY); } else break;
  }
  return n;
}
function byId(id) { for (var i = 0; i < SCEN.length; i++) if (SCEN[i].id === id) return SCEN[i]; return null; }

// ---------- повторения по коробкам (Лейтнер) ----------
function cardState(id) { return S.cards[id] || null; }
function updateBox(id, verdict) {
  var c = S.cards[id] || { box: 0, due: 0, seen: 0 };
  c.seen++;
  if (verdict === "b") c.box = Math.min(5, c.box + 1);
  else if (verdict === "o") c.box = Math.max(c.box, 0);
  else c.box = 0;
  c.due = Date.now() + INTERVALS[c.box] * DAY;
  c.last = verdict;
  S.cards[id] = c;
}
function dueList() { var now = Date.now(); return SCEN.filter(function (s) { var c = S.cards[s.id]; return c && c.due <= now && c.box < 5; }); }

// ---------- выбор раунда: повторения, новое, перемешивание книг ----------
function interleave(list) {
  var out = [], rest = list.slice();
  while (rest.length) {
    var last = out.length ? out[out.length - 1].bk : null, idx = -1;
    for (var i = 0; i < rest.length; i++) { if (rest[i].bk !== last) { idx = i; break; } }
    if (idx < 0) idx = 0;
    out.push(rest.splice(idx, 1)[0]);
  }
  return out;
}
function pickRound(pool, n) {
  var now = Date.now();
  var due = pool.filter(function (s) { var c = S.cards[s.id]; return c && c.due <= now; }).sort(function (a, b) { return S.cards[a.id].box - S.cards[b.id].box; });
  var fresh = shuffle(pool.filter(function (s) { return !S.cards[s.id]; }));
  var rest = shuffle(pool.filter(function (s) { var c = S.cards[s.id]; return c && c.due > now; })).sort(function (a, b) { return S.cards[a.id].box - S.cards[b.id].box; });
  var chosen = due.slice(0, Math.ceil(n / 2)).concat(fresh).concat(due.slice(Math.ceil(n / 2))).concat(rest);
  return interleave(shuffle(chosen.slice(0, n)));
}

// ---------- подсказки по тексту Виты (простая проверка слов, не оценка смысла) ----------
function hints(text, sc) {
  var t = text.toLowerCase(), h = [];
  if (/хотя бы|как получится|чтобы мне приятно|много времени не займ|я только учусь|если можно|извини,? что|просто если/.test(t)) h.push("Есть смягчитель («хотя бы», «как получится», «я только учусь»…) — он снижает твою позицию. Попробуй убрать.");
  if (/иначе|последний шанс|остановлю|или ты|до пятницы|только сегодня/.test(t)) h.push("Похоже на ультиматум или срок. Он допустим, только если ты правда это сделаешь и срок настоящий.");
  if (/другой (поставщик|клиент|завод|студи|заказчик)|у меня много (заказ|клиент)|есть оффер/.test(t)) h.push("Похоже на блеф про «других». Если этого нет — не говори.");
  if (/\d/.test(t) && !/__/.test(text)) h.push("Есть цифра. Откуда она — из часов, расчёта, реальных данных? Если не можешь объяснить, поставь «__».");
  if (sc.q && text.indexOf("?") < 0) h.push("В этой ситуации сначала нужен один уточняющий вопрос. В твоём ответе вопроса нет.");
  if ((text.match(/\?/g) || []).length > 2) h.push("Вопросов много. Лучше один главный, остальные потом.");
  if (text.length > 450) h.push("Длинно. Одна мысль — одно предложение, лучше короче.");
  if (!h.length) h.push("Явных слов-ловушек не нашла. Сравни свой ответ со «лучшим ходом» ниже: совпала ли идея?");
  return h;
}

// ---------- награды ----------
function checkBadges() {
  var newb = [];
  function give(k) { if (S.badges.indexOf(k) < 0) { S.badges.push(k); newb.push(BADGES[k]); } }
  if (S.rounds >= 1) give("first");
  if (S.asked >= 5) give("ask5");
  if (S.cleanRound) give("clean");
  if (streak() >= 3) give("days3");
  if (Object.keys(S.dialogs).length) give("dlg");
  if (S.answers.filter(function (a) { return a.own && a.own.length >= 15; }).length >= 10) give("own10");
  var ok = true;
  ["voss", "weiss", "klaff", "mom", "hall"].forEach(function (b) {
    var any = SCEN.some(function (s) { return s.bk === b && S.cards[s.id] && S.cards[s.id].box >= 2; });
    if (!any) ok = false;
  });
  if (ok) give("allbooks");
  return newb;
}

  h += '<div class="prog"><i style="width:' + (D.i / D.d.turns.length * 100) + '%"></i></div>';
  if (D.i === 0) h += '<div class="note">' + esc(D.d.intro) + '</div>';
  D.hist.forEach(function (x) { h += '<div class="bubble you">' + esc(x.t) + '</div><div class="bubble"><span class="who">' + D.d.em + '</span>' + esc(x.r) + '</div>'; });
  if (D.hist.length === 0) h += '<div class="bubble"><span class="who">' + D.d.em + '</span>' + esc(D.partner) + '</div>';
  h += '<div class="box"><div class="lab">Что ответишь?</div>';
  D.order = D.order && D.orderI === D.i ? D.order : shuffle(t.o.map(function (o, i) { return i; }));
  D.orderI = D.i;
  D.order.forEach(function (i, k) { h += '<button class="opt" data-act="dpick" data-i="' + i + '"><b>' + "ABCD".charAt(k) + '</b><span>' + esc(t.o[i].t) + '</span></button>'; });
  h += '</div>';
  setView(h);
}
function dialogPick(i) {
  var t = D.d.turns[D.i], o = t.o[i], vd = VERD[o.v];
  D.pts += vd.p; S.pts += vd.p; if (o.v === "z") S.bans++;
  D.hist.push({ t: o.t, r: o.r, v: o.v, w: o.w, g: o.g });
  view = "dlgfb";
  var h = topbar(true, D.d.t + " · " + (D.i + 1) + " из " + D.d.turns.length);
  D.hist.slice(0, -1).forEach(function (x) { h += '<div class="bubble you">' + esc(x.t) + '</div><div class="bubble"><span class="who">' + D.d.em + '</span>' + esc(x.r) + '</div>'; });
  h += '<div class="bubble you">' + esc(o.t) + '</div><div class="bubble"><span class="who">' + D.d.em + '</span>' + esc(o.r) + '</div>';
  h += '<div class="verdict ' + vd.c + '"><b>' + vd.l + '</b> · +' + vd.p + '</div><div class="box"><div class="rv-w">' + esc(o.w) + '</div><div class="tags">' + tagChips(o.g) + '</div></div>';
  var last = D.i + 1 >= D.d.turns.length;
  h += '<div class="row"><button class="primary" data-act="dnext">' + (last ? 'Итог разговора' : 'Дальше →') + '</button></div>';
  setView(h);
}
function dialogEnd() {
  var id = D.d.id;
  if (S.dialogs[id] == null || D.pts > S.dialogs[id]) S.dialogs[id] = D.pts;
  if (S.days.indexOf(today()) < 0) S.days.push(today());
  var nb = checkBadges(); save();
  var msg = D.pts >= 25 ? "Условия на одной странице, собеседник услышан. Отличный разговор." : D.pts >= 15 ? "Разговор идёт, но часть приёмов упущена. Сыграй ещё раз." : "Разговор завис или испортился. Посмотри карточки приёмов и сыграй ещё.";
  var h = topbar(true, "Итог разговора") + '<header class="hero"><div class="hero-t">' + D.pts + ' из 30</div><div class="hero-s">' + msg + '</div></header>';
  if (nb.length) h += '<div class="note">🎉 Новая награда: ' + nb.map(esc).join(", ") + '</div>';
  var keys = {}; D.hist.forEach(function (x) { if (x.v !== "b") x.g.forEach(function (k) { keys[k] = 1; }); });
  if (Object.keys(keys).length) h += '<div class="box"><div class="lab">Повтори приёмы</div><div class="tags">' + tagChips(Object.keys(keys)) + '</div></div>';
  h += '<div class="menu"><button class="big primary" data-act="dlg" data-id="' + id + '">Сыграть ещё</button><button class="big" data-act="dialogs">Другие разговоры</button></div>';
  setView(h);
}

// ---------- приёмы, журнал, о тренажёре ----------
function cardHTML(k) {
  var c = CARDS[k], b = BOOKS[c.b];
  return '<div class="card" style="--bc:' + b.c + '"><div class="card-h">' + b.e + ' ' + esc(c.n) + '<small>' + esc(b.n) + '</small></div>' +
    '<p>' + esc(c.s) + '</p><p class="ex"><b>Пример:</b> ' + esc(c.e) + '</p>' + (c.no ? '<p class="no"><b>Не применять / осторожно:</b> ' + esc(c.no) + '</p>' : '') + '</div>';
}
function renderCards(filter) {
  view = "cards";
  var h = topbar(true, "Приёмы") + '<div class="hint pad">Нажми книгу, чтобы отфильтровать. Всё из твоих книг; «Общее» — наши правила, не из книг.</div><div class="tags pad">';
  ["all", "voss", "weiss", "klaff", "mom", "hall", "gen"].forEach(function (b) { h += '<button class="tag' + (filter === b || (!filter && b === "all") ? ' on' : '') + '" data-act="cardf" data-b="' + b + '">' + (b === "all" ? "Все" : esc(BOOKS[b].s)) + '</button>'; });
  h += '</div><div class="cards">';
  Object.keys(CARDS).forEach(function (k) { if (!filter || filter === "all" || CARDS[k].b === filter) h += cardHTML(k); });
  h += '</div>';
  setView(h);
}
function showCardModal(k) {
  var m = document.getElementById("modal");
  m.innerHTML = '<div class="mwrap"><div class="mcard">' + cardHTML(k) + '<button class="primary" data-act="mclose">Закрыть</button></div></div>';
  m.style.display = "block";
}
function renderJournal() {
  view = "journal";
  var n = S.answers.length;
  var h = topbar(true, "Журнал");
  h += '<div class="stats"><div class="stat"><b>' + n + '</b><span>ответов</span></div><div class="stat"><b>' + S.rounds + '</b><span>раундов</span></div><div class="stat"><b>' + S.bans + '</b><span>запрещённых ходов</span></div></div>';
  h += '<div class="box"><div class="lab">Сохранение</div><div class="hint">Очки и ответы лежат в этом браузере. Если сменишь телефон или очистишь историю — потеряются. Скачай файл и держи копию.</div>' +
    '<div class="row"><button class="primary" data-act="exp-json">⬇ Скачать сохранение</button><button class="ghost" data-act="exp-txt">⬇ Мои ответы (текст)</button></div>' +
    '<div class="row"><label class="ghost file">⬆ Загрузить сохранение<input type="file" id="imp" accept=".json,application/json"></label>' +
    '<button class="ghost danger" data-act="reset">Сбросить всё</button></div><div id="msg" class="hint"></div></div>';
  h += '<div class="sec-t">Последние ответы</div>';
  var rec = S.answers.slice(-30).reverse();
  if (!rec.length) h += '<div class="hint pad">Пока пусто — сыграй раунд.</div>';
  rec.forEach(function (a) {
    var sc = byId(a.id), d = new Date(a.ts);
    h += '<div class="jr ' + VERD[a.v].c + '"><div class="jr-h">' + d.toLocaleDateString("ru-RU") + ' · ' + esc(sc ? sc.who : a.id) + ': «' + esc(sc ? sc.line.slice(0, 50) : '') + '»</div>' +
      (a.own ? '<div class="mine">Моя запись: ' + esc(a.own) + '</div>' : '') + '<div class="jr-p">' + VERD[a.v].l + ' — ' + esc(a.pick) + '</div></div>';
  });
  setView(h);
}
function download(name, text, mime) {
  var blob = new Blob([text], { type: mime }), url = URL.createObjectURL(blob);
  var a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(function () { document.body.removeChild(a); URL.revokeObjectURL(url); }, 500);
}
function exportTxt() {
  var lines = ["Тренажёр переговоров — мои ответы", "Очки: " + S.pts, ""];
  S.answers.forEach(function (a) { var sc = byId(a.id); lines.push(new Date(a.ts).toLocaleString("ru-RU") + " · " + (sc ? sc.who + ": " + sc.line : a.id)); if (a.own) lines.push("  Моя запись: " + a.own); lines.push("  Выбор (" + VERD[a.v].l + "): " + a.pick); lines.push(""); });
  download("moi_otvety_trenazher.txt", lines.join("\n"), "text/plain");
}
function renderAbout() {
  view = "about";
  var h = topbar(true, "Как это работает");
  h += '<div class="box about"><p><b>Идея.</b> Ты не читаешь про приёмы — ты их применяешь. Так запоминается лучше (скилл kak-uchitsya: сначала вспоминай сама, потом сверяйся).</p>' +
    '<p><b>Шаг 1.</b> Пишешь свой ответ до подсказок. <b>Шаг 2.</b> Выбираешь ход. <b>Шаг 3.</b> Видишь, какой это приём из какой книги, что хорошо, что запрещено и пример лучше.</p>' +
    '<p><b>Повторения.</b> Правильно — карточка уходит в следующую коробку и вернётся позже (через 1, 3, 7, 14, 30 дней). Неправильно — вернётся сразу. Это «интервальные повторения».</p>' +
    '<p><b>Перемешивание.</b> Книги в раунде идут вперемешку: так учишься выбирать приём, а не просто повторять один.</p>' +
    '<p><b>Три правила.</b> 1) Если не хватает данных — сначала один вопрос. 2) Без блефа, давления и лжи — они дают ⛔. 3) Цифры за тебя не придумываю: «__» — твоя настоящая.</p>' +
    '<p><b>Голос и чат.</b> Зеркало, пауза, звонок через сутки — приёмы для голоса. В чате они работают иначе: смотри пометку 🎙.</p>' +
    '<p><b>Книги.</b> Восс, Вайс, Клафф, «Тест мамы», Холл (НЛП). Холл — слабая научная база: это инструмент самонаблюдения. Ситуации придуманы для тренировки, это не твои настоящие переписки.</p>' +
    '<p><b>Защита.</b> Ты узнаёшь и манипулятивные приёмы, чтобы не попасть в них, а не чтобы применять.</p></div>';
  setView(h);
}

// ---------- события ----------
document.addEventListener("click", function (ev) {
  var t = ev.target.closest("[data-act]"); if (!t) return;
  var a = t.getAttribute("data-act");
  if (a === "home") { document.getElementById("modal").style.display = "none"; renderHome(); }
  else if (a === "round") startRound(t.getAttribute("data-mode"), t.getAttribute("data-book"));
  else if (a === "toopts") { var ta = document.getElementById("own"); R.own = ta ? ta.value.trim() : ""; renderPlay("opts"); }
  else if (a === "skipown") { R.own = ""; renderPlay("opts"); }
  else if (a === "pick") renderReveal(parseInt(t.getAttribute("data-i"), 10));
  else if (a === "next") { R.i++; R.own = ""; R.order = null; if (R.i >= R.list.length) renderEnd(); else renderPlay("own"); }
  else if (a === "dialogs") renderDialogs();
  else if (a === "dlg") startDialog(t.getAttribute("data-id"));
  else if (a === "dpick") dialogPick(parseInt(t.getAttribute("data-i"), 10));
  else if (a === "dnext") { D.i++; D.order = null; if (D.i >= D.d.turns.length) dialogEnd(); else renderDialogTurn(); }
  else if (a === "cards") renderCards("all");
  else if (a === "cardf") renderCards(t.getAttribute("data-b"));
  else if (a === "card") showCardModal(t.getAttribute("data-k"));
  else if (a === "mclose") document.getElementById("modal").style.display = "none";
  else if (a === "journal") renderJournal();
  else if (a === "about") renderAbout();
  else if (a === "exp-json") download("trenazher_sohranenie.json", JSON.stringify(S, null, 1), "application/json");
  else if (a === "exp-txt") exportTxt();
  else if (a === "reset") {
    if (t.getAttribute("data-sure")) { S = blank(); save(); renderJournal(); }
    else { t.setAttribute("data-sure", "1"); t.textContent = "Точно сбросить? Нажми ещё раз"; }
  }
});
document.addEventListener("change", function (ev) {
  if (ev.target && ev.target.id === "imp") {
    var f = ev.target.files[0]; if (!f) return;
    var fr = new FileReader();
    fr.onload = function () {
      var m = document.getElementById("msg");
      try { var o = JSON.parse(fr.result); if (!o || typeof o.pts !== "number" || !o.cards) throw 0; S = Object.assign(blank(), o); save(); renderJournal(); document.getElementById("msg").textContent = "Сохранение загружено."; }
      catch (e) { if (m) m.textContent = "Это не файл сохранения тренажёра."; }
    };
    fr.readAsText(f);
  }
});
renderHome();

</script>
</body>
</html>
