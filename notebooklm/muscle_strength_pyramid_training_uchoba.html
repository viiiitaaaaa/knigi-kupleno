# Конспект: «The Muscle and Strength Pyramid: Training» (Пирамида мышц и силы: тренировка), 2-е издание

Это пересказ книги для личной учёбы, а не медицинский или тренерский совет. Все цифры — «по книге». Сокращения: 1RM — максимум на один повтор; RPE — шкала «насколько тяжело был подход» от 1 до 10 (10 = до отказа); RIR — «сколько повторов оставалось в запасе»; подход (set) — серия повторов подряд; гипертрофия — рост размера мышц; «базовое» (compound) упражнение — задействует несколько суставов (присед, жим), «изолирующее» — один сустав (сгибание руки). Скан книги с шумом: оглавление и таблицы шести примерных программ почти нечитаемы (отмечено ниже).

## 0. Полный список глав и разделов (по тексту книги)

Вводные части: отзывы на обложке; Foreword (предисловие М. Зурдоса); Preface (предисловие Эрика Хелмса); What&#x27;s New in the Second Edition; Introduction (в том числе «Введение в пирамиду»).

Основные главы (шесть уровней пирамиды, от самого важного к наименее важному):
1. Level 1. Adherence (Приверженность): три условия Realistic / Enjoyable / Flexible; гибкость при стрессе; что делать при пропуске тренировки; спорт и активность вне зала (эффект интерференции); травмы.
2. Level 2. Volume, Intensity, Frequency (Объём, интенсивность, частота): как считать объём; доза-эффект; модель «Фитнес–Усталость»; перегруз и перетренированность; рекомендации по объёму; измерение интенсивности (% от 1RM, RM, RPE, отказ); интенсивность для силы и для гипертрофии; частота; сводные рекомендации; пересечение упражнений; блок-схема «если застой»; две примерные рутины.
3. Level 3. Progression (Прогрессия): стаж и прогрессия; прогресс против прогрессивной перегрузки; разгрузки и вводные циклы; прогрессия новичка, промежуточного, продвинутого; отслеживание прогресса; реализация разгрузок; модели периодизации (линейная, блочная, волнообразная) и их интеграция; подводка к соревнованию.
4. Level 4. Exercise Selection (Выбор упражнений): специфичность; степень вариативности; авторегулируемый выбор; базовые и изолирующие; слабые места и «зоны застревания»; заметка о технике (связь ум–мышца); порядок упражнений; амплитуда движения.
5. Level 5. Rest Periods (Отдых между подходами): гормональная гипотеза; метаболическая усталость; мышечное повреждение; доказательства против короткого отдыха; парные подходы на антагонистов (APS); дроп-сеты и рест-пауз; рекомендации.
6. Level 6. Lifting Tempo (Темп подъёма): эксцентрика; «время под нагрузкой»; импульс; медленный темп; запредельная эксцентрика; практические правила.
7. Quick Start Guide to Program Building (Быстрое руководство): шаги 1–6, авторегуляция, поправки на сушке.
8. Sample Programs (Примерные программы): разминка; шесть программ (новичок/промежуточный/продвинутый × пауэрлифтинг/бодибилдинг); прогрессия для каждого уровня; вспомогательные упражнения; «двойные атлеты».

Заключительные части: Resources (ссылки); Final Words (слова трёх авторов); About the Authors.

## 1. О чём книга в 3 предложениях

Книга показывает, что в тренировке на силу и рост мышц важно сначала расставить приоритеты («большие камни», потом «песок») по шести уровням пирамиды: сначала приверженность, потом объём–интенсивность–частота, потом прогрессия, и только в конце — упражнения, отдых и темп. Авторы (научный сотрудник и тренеры) дают стартовые ориентиры, например 10–20 подходов на мышечную группу в неделю и тренировку каждой группы минимум дважды в неделю, и учат подстраивать их под себя, избегая «чёрно-белого» мышления. Сверх того в книге есть быстрое руководство по сборке программы и шесть примерных программ, но их таблицы в этом скане почти не читаются.

## 2. Главные идеи по главам

**Вводные части**
- Беда индустрии — информация без приоритетов («телега впереди лошади»).
- Программа — это изменение объёма, интенсивности и частоты во времени, а не набор «лучших упражнений».
- Примерно 80% прогресса дают нижние три–четыре уровня пирамиды.
- Периодизация (план изменений во времени) охватывает все уровни.

**Уровень 1. Приверженность**
- «Неважно, насколько хороша программа, если не выполняешь» — план должен быть Realistic, Enjoyable, Flexible (REF).
- Подстраивай нагрузку под самочувствие и стресс (исследования: гибкий выбор сложности дня дал больше силы).
- Пропустила тренировку — просто продолжай с того места; несколько тяжёлых дней подряд не катастрофа.
- Травмы случаются реже, чем в большинстве командных видов, но при серьёзной травме — к специалисту; «если больно, не делай».
- Кардио после подъёма или в другой день снижает эффект интерференции.

**Уровень 2. Объём, интенсивность, частота**
- Объём считай подходами в нужной зоне; «больше» не всегда лучше (U-образная связь; модель «фитнес минус усталость»).
- Стартовая точка: 10–20 подходов на группу/движение в неделю (новичку 10–13, опытному 14–20), повторы 1–15 при RPE 5–10, частота минимум дважды в неделю.
- Для силы — большая часть объёма в 1–6 повторах; для роста — в 6–12; отказ — осознанно и в основном на изоляции.
- Интенсивность измеряй RPE/RIR вместе с весом; процент от 1RM сильно зависит от человека.
- Частота «организует» объём: слишком много в одной сессии — плохо.

**Уровень 3. Прогрессия**
- Прогресс и прогрессивная перегрузка — не одно и то же; растущая сила — признак адекватной перегрузки.
- Новичок: добавляй вес каждую тренировку (после двух неудач подряд минус 10%). Промежуточный: волновая нагрузка и двойная прогрессия. Продвинутый: блоки накопления и интенсификации, тест раз в 6–12 недель.
- Разгрузка — часть плана; чек-лист из 5 вопросов решает, нужна ли она (2 «да» и больше — разгрузка).
- Периодизация: линейная, блочная, волнообразная не взаимоисключают друг друга — лучше интегрировать.
- Подводка (taper) к соревнованию: снизить объём, интенсивность сохранить.

**Уровень 4. Выбор упражнений**
- Для силы: 50–75% объёма — соревновательные подъёмы; для роста: 1–2 базовых и 1–3 изолирующих на группу.
- «Мышечная путаница» — миф: незнакомые движения растят хуже; базовые держи постоянно, изоляцию меняй.
- Слабые места: структура тела, техника, звено цепи; паузы, изометрия, резины/цепи — по обстоятельствам, осознанно.
- Порядок: сначала базовые штанговые; полная амплитуда, какая у тебя есть.

**Уровень 5. Отдых**
- Гормональная гипотеза («короткий отдых = всплеск гормонов = рост») не подтвердилась.
- Короткий отдых не даёт больше роста; отдыхай, пока не будешь готова выполнить следующий подход хорошо.
- Парные подходы на антагонистов (жим + тяга) экономят время без потери результата; рест-пауз и дроп-сеты — для вспомогательных упражнений.

**Уровень 6. Темп**
- Замедлять опускание ради «времени под нагрузкой» не нужно: важна и величина напряжения (импульс = сила × время).
- Контролируй опускание, ускоряй подъём: «просто поднимай веса».
- Запредельная эксцентрика пока не доказана.

**Быстрое руководство и примеры**
- Шаги: дни и сплит → объём/интенсивность/частота → тип прогрессии → упражнения → отдых и темп → авторегуляция.
- На сушке: на ступень ниже объём, разгрузки после каждого мезоцикла.
- Примерные программы — учебные образцы, не готовые рецепты.

## 4. Пошаговый чек-лист практических действий (по книге)

1. Реши, сколько дней в неделю реально тренироваться (от 2 до 6; для большинства 3–5), и учти срок до цели или соревнования.
2. Проверь себя по REF: реалистично ли расписание, приятна ли программа, есть ли запас на срыв.
3. Выбери сплит под число дней (по таблицам из книги), чтобы каждая группа мышц или движение тренировались минимум дважды в неделю.
4. Определи объём по стажу: новичок 10–12, промежуточный 13–15, продвинутый 16–20 подходов на группу/движение в неделю (по быстрому руководству).
5. Назначь интенсивность: большая часть работы в 1–15 повторах при RPE 5–10; для силы — две трети–три четверти в 1–6 повторах, для роста — две трети–три четверти в 6–12 (дроби восстановлены по смыслу, в скане повреждены).
6. Разложи объём по дням так, чтобы ни одна сессия не была перегружена.
7. Выбери тип прогрессии: новичку — добавлять вес каждую тренировку; промежуточному — волновая нагрузка для базовых и двойная прогрессия для изоляции; продвинутому — блоки накопления и интенсификации.
8. Выбери упражнения: для силы 50–75% объёма — соревновательные подъёмы; для роста 1–2 базовых и 1–3 изолирующих на группу; базовые держи постоянными.
9. Ставь базовые штанговые упражнения первыми; делай полную амплитуду, которая безопасна именно для тебя.
10. Отдыхай, пока не будешь готова к следующему подходу; не меньше 1,5 мин между малыми группами и 2,5 мин между базовыми, если привычно недоотдыхаешь.
11. Не замедляй темп искусственно: контролируй опускание, ускоряй подъём.
12. Оценивай RPE (снимай видео, спрашивай опытного партнёра) и записывай результаты.
13. После каждого мезоцикла отвечай на 5 вопросов чек-листа (боишься зала? хуже спишь? падают веса/повторы? больше стресса? сильнее боли?); 2 «да» и больше — неделя разгрузки; раз в три мезоцикла разгрузка в любом случае.
14. При застое сначала проверь сон 8+ часов, энергетический профицит, белок 0,7 г на фунт (1,6 г на кг) и больше, оценку RPE, частоту и технику; только потом думай о добавлении объёма (на 10% или 1–2 подхода).
15. Если приходится худеть, понизь категорию объёма на ступень и делай разгрузки автоматически.

## 5. Типичные ошибки и мифы (по книге)

- «Нужна идеальная программа» — на деле лучше слегка неоптимальная, но выполняемая («оптимальное ≠ устойчивое»).
- «Чем больше объём, тем лучше» — слишком много ведёт к плато и откату; повышай объём только когда нужно.
- Копировать расписание любимого бодибилдера, игнорируя свою жизнь.
- Всегда тренироваться до отказа — снижает объём и удлиняет восстановление; на базовых многосуставных — риск.
- «Мышечная путаница»: частая смена упражнений мешает освоению и росту.
- «Короткий отдых вызывает гормональный всплеск и рост» — не подтверждено; исследования не показывают пользы короткого отдыха.
- «Время под нагрузкой — главное» — важнее величина напряжения; слишком медленный темп снижает вес и объём.
- Суперсеты на одну мышцу вместо парных подходов на антагонистов: теряются повторы.
- Менять программу при первом же срыве вместо того, чтобы просто продолжить.
- Пытаться «поймать» точку застревания паузой там, где гриф застрял (довод автора против).
- Считать, что прогресс виден в зеркале у продвинутых: ошибка измерений больше реального прироста, смотри на производительность.
- Брать примерные программы «как есть», не учитывая, к чему ты адаптирован.

## 6. 20 карточек «вопрос — ответ»

1. Что такое Level 1 пирамиды? — Приверженность: неважно, насколько хороша программа, если ты её не выполняешь.
2. Что значит REF? — Realistic (реалистично), Enjoyable (приятно), Flexible (гибко).
3. Что делать, если пропустила тренировку? — Обычно просто выполнить её в следующий раз, когда придёшь; план закончится чуть позже.
4. Какой стартовый объём рекомендует книга? — 10–20 подходов на мышечную группу или движение в неделю.
5. С какой части диапазона начинать новичку? — С нижней: около 10–13 подходов в неделю.
6. Что такое RPE и RIR? — Субъективная оценка тяжести подхода (10 — отказ) и число повторов, оставшихся «в запасе».
7. Что такое модель «Фитнес–Усталость»? — Результат равен фитнесу минус усталость; обе растут от тренировки, усталость спадает быстрее.
8. Чем overreaching отличается от overtraining? — Первое лечится запланированной разгрузкой и может дать рост; второе — тяжёлое состояние, нужны недели восстановления, и бывает редко.
9. Как часто тренировать каждую мышцу? — Минимум дважды в неделю.
10. Как новичок добавляет вес? — Линейно, каждую тренировку или через раз; после двух неудач подряд снижает вес на 10%.
11. Что такое волновая нагрузка? — Вес растёт, а повторы падают от недели к неделе (например 8, 7, 6), потом цикл повторяется с большим весом.
12. Что такое двойная прогрессия? — Сначала добавляешь повторы до верха диапазона при том же весе, потом повышаешь вес.
13. Как решить, нужна ли разгрузка? — Пять вопросов (боишься зала, хуже сон, падают веса, больше стресса, сильнее боли): 2 «да» и больше — разгрузка.
14. Какая доля объёма у пауэрлифтера на соревновательные подъёмы? — 50–75%.
15. Есть ли польза от «мышечной путаницы»? — Нет: незнакомые движения растят мышцы хуже, пока не освоены.
16. Какой отдых между подходами рекомендует книга? — Столько, сколько нужно для хорошего следующего подхода (минимум 1,5 мин для малых групп, 2,5 мин для базовых, если привычно недоотдыхаешь).
17. Что такое парные подходы на антагонистов? — Подход на одну мышцу, затем на противоположную (жим → тяга) вместо простого отдыха.
18. Что такое импульс в контексте темпа? — Сила, умноженная на время; важна и величина напряжения, а не только время.
19. Какая рекомендация по темпу? — «Просто поднимай веса»: контролируй опускание, ускоряй подъём.
20. Что делать продвинутому без роста 8–12 недель? — Проверить сон, калории, белок, RPE, частоту, технику; потом, возможно, добавить объём (на 10% или 1–2 подхода).

## 7. Пять практических заданий для неё (жизнь, здоровье, учёба)

Это не тренерские назначения: книга о тренировках с отягощениями, но принципы можно применить шире.

1. **Проверка «REF» на любой привычке** (учёба, спорт, питание). Выбери одну привычку и ответь письменно: реалистична ли она по времени, приятна ли, что делать при срыве. Исправь, если на один из вопросов «нет». Результат: короткая записка на страницу.
2. **Правило «пропустила — продолжаю с того места»**. Составь для учёбы или тренировок правило на случай пропуска (по книге: продолжить с места остановки, а не «наверстывать всё сразу»). Запиши и попробуй неделю.
3. **Журнал RPE-оценок**. Две недели после любой тренировки или учебной сессии записывай оценку «насколько тяжело» по шкале 1–10 и сколько сил оставалось. Цель — научиться замечать свою усталость (для здоровья не вместо врача; при болях или тревожных симптомах — к специалисту).
4. **Чек-лист разгрузки для учёбы**. Раз в 3–4 недели отвечай на пять вопросов из книги, переделанных под учёбу (не хочется идти заниматься? хуже сплю? результаты падают? больше стресса? ноет тело?). При двух «да» и более — запланируй лёгкую неделю.
5. **Конспект «большие камни — песок»**. Возьми любую текущую учебную тему и выпиши 3 «больших камня» и 3 «камешка»; сверь с книгой: что делаешь первым. Результат — один лист для самопроверки по карточкам (вопрос — ответ).

## 8. Что в книге спорно или устарело

- Книга 2019 года; сами авторы пишут, что рекомендации «эволюционируют» с новыми исследованиями, а порядок уровней, скорее всего, не изменится.
- Метаанализы объёма и частоты в основном на новичках; для тренированных данных мало (по тексту), поэтому диапазоны «10–20» — ориентир, а не закон.
- Ссылки в книге доходят примерно до 2018 года; что нового с тех пор — в этой книге не сказано.
- Запредельная эксцентрика и некоторые подходы (аккомодирующее сопротивление, взрывная работа) описаны как недоказанные или индивидуальные; автор сам оговаривается.
- Главный фокус — натуральные (без допинга) спортсмены и пауэрлифтеры/бодибилдеры; для других целей (например, общее здоровье) книга специально не рассчитана.
- В разделе Resources есть коммерческие рекомендации (курсы, приложения, добавки) компаний, связанных с авторами; автор открыто пишет о связях, но это реклама, а не доказательства.
- Таблицы шести примерных программ и ряда схем в этом скане не читаются — по ним нельзя восстановить точные схемы; для практики нужно смотреть бумажную книгу или оригинал.
- Дроби долей объёма (например, «две трети–три четверти») и некоторые числа в скане повреждены; в конспекте они восстановлены по смыслу и по соседним местам книги.
- Это не медицинская книга: авторы подчёркивают, что не врачи; рекомендации по травмам — только общие.
