<script type="text/plain" id="src">Подробный учебный конспект книги **«Pirámide de Nutrición»** (*The Muscle and Strength Pyramid: Nutrition*, Eric Helms, Andrea Valdez, Andy Morgan; 2-е испанское издание).

#### Раздел 0. Полный список разделов книги

Структура 2-го издания книги включает вступительные главы, 5 фундаментальных уровней Пирамиды (от самого важного к менее важному), специализированные главы по коррекции и подготовке, а также заключительные разделы:
1. **Prólogo por el Dr. Joe Klemczewski** — *Предисловие доктора Джо Клемчевски*
2. **Prefacio** — *Предисловие авторов*
3. **¿Qué novedades hay en esta segunda edición?** — *Что нового во втором издании?*
4. **Introducción a la Pirámide** — *Введение в Пирамиду*
5. **Mentalidad y Materiales** — *Мышление и инструменты*
6. **NIVEL 1 - Balance energético** — *Уровень 1: Энергетический баланс*
7. **NIVEL 2 - Macronutrientes y fibra** — *Уровень 2: Макронутриенты и клетчатка*
8. **NIVEL 3 - Micronutrientes y agua** — *Уровень 3: Микронутриенты и вода*
9. **NIVEL 4 - Timing de los nutrientes y frecuencia** — *Уровень 4: Тайминг нутриентов и частота приёмов пищи*
10. **NIVEL 5 - Suplementos** — *Уровень 5: Пищевые добавки*
11. **Haciendo ajustes y midiendo el progreso** — *Внесение корректив и измерение прогресса*
12. **Peaking para una competición** — *Выход на пик формы перед соревнованиями*
13. **La dieta de recuperación** — *Восстановительная диета*
14. **Comportamiento y estilo de vida** — *Поведение и образ жизни*
15. **Recursos** — *Ресурсы*
16. **Palabras finales** — *Заключительное слово*

#### Раздел 1. О чём книга в 3 предложениях

1. Книга Эрика Хелмса, Андреа Вальдес и Энди Моргана **«Pirámide de Nutrición»** представляет собой научно обоснованную иерархическую систему построения рациона для спортсменов, стремящихся к максимальному росту мышечной массы, силы и эффективному снижению жировой массы.
2. Авторы распределяют все факторы питания по пяти уровням значимости — от базисного энергетического баланса (**«Balance energético»**) и макронутриентов до второстепенных деталей, таких как тайминг нутриентов и спортивные добавки (**«Suplementos»**).
3. Руководство предлагает системные протоколы контроля прогресса, пика формы и выхода из сушки, делая ключевой акцент на долгосрочной гибкости (**«Flexibilidad»**), психологическом здоровье и избавлении от крайнего диетического перфекционизма.

#### Раздел 2. Главные идеи по разделам и уровням

##### 1. Вступительные главы (Prólogo, Prefacio, Novedades, Introducción)

* **Главная проблема индустрии** — отсутствие контекста и засилье бинарного мышления (**«Pensamiento blanco/negro»**).
* **Иллюзия мелочей** — метафора *«Poner el carro delante del caballo»* («ставить телегу впереди лошади») описывает частую ошибку, когда атлеты фокусируются на суперфудах или добавках, игнорируя общую калорийность.
* **Принцип Пирамиды** — фундамент (Уровень 1) даёт наибольший вклад в результат; по мере подъёма к вершине (Уровень 5) важность факторов снижается.
* **Обновления 2-го издания** — введение понятия доступности энергии (**«Disponibilidad energética»**), восстановительной диеты (**«Dieta de recuperación»**) и классификации добавок по спискам A, B и C.

##### 2. Mentalidad y Materiales (Мышление и инструменты)

* **Триада успеха** — необходимость баланса между точностью (**«Precisión»**), гибкостью (**«Flexibilidad»**) и постоянством (**«Constancia»**).
* **Ловушка строгости** — жесткие диет-планы и отслеживание граммов до единицы часто провоцируют срывы и компульсивные переедания.
* **Мышление включения** — фокус на добавлении плотных микронутриентами продуктов вместо абсолютного исключения «плохой еды» (**«Comida buena vs comida mala»**).
* **Техника взвешивания веса** — ежедневные взвешивания натощак с расчётом средненедельного значения для устранения водного «шума».

##### 3. NIVEL 1 - Balance energético (Энергетический баланс)

* **Расчёт поддержки** — лучший способ найти калории поддержки (**«Calorías de mantenimiento»**) — отслеживать потребление и вес в течение 2 недель без изменения привычек.
* **Темп сгонки жира** — оптимальное снижение массы тела составляет **0,7–1% в неделю**, что минимизирует потерю мышечной ткани.
* **Темп набора массы** — целевой прирост веса в месяц зависит от опыта: новички — **1–1,5%**, средний уровень — **0,5–1%**, продвинутые — **до 0,5%**.
* **Доступность энергии** — снижение доступной энергии ниже **30 ккал/кг тощей массы** у женщин (и ~20–25 у мужчин) ведет к синдрому RED-S, падению метаболизма и аменорее.
* **Контроль кардио** — чрезмерное кардио создаёт интерференционный эффект (**«Efecto de interferencia»**), ухудшая адаптацию к силовым тренировкам.

##### 4. NIVEL 2 - Macronutrientes y fibra (Макронутриенты и клетчатка)

* **Норма белка на сушке** — **2,2–2,6 г/кг массы тела** для эффективной защиты мышц в условиях дефицита.
* **Норма белка на наборе** — **1,6–2,2 г/кг массы тела**, так как при профиците потребностей в белке для энергии нет.
* **Жиры и углеводы** — жиры обычно составляют **15–25%** калорий на сушке и **20–30%** на наборе; минимальный порог жиров — **0,5 г/кг**, углеводов — **1 г/кг**.
* **Норма клетчатки** — ориентир **14 г на 1000 ккал** (или ~25 г для женщин, ~38 г для мужчин).
* **Оценка низкоуглеводных диет** — кетогенные диеты не имеют метаболического преимущества для сжигания жира при равных калориях и могут снижать анаболический потенциал.

##### 5. NIVEL 3 - Micronutrientes y agua (Микронутриенты и вода)

* **Критичность микронутриентов** — дефициты цинка, железа, кальция, магния и витамина D снижают скорость обмена веществ, силу и здоровье костей.
* **Норма фруктов и овощей** — при профиците: **1 порция фруктов и 1 порция овощей на 1000 ккал**; при дефиците: **1 порция на 500 ккал**.
* **Норма жидкости** — базовый ориентир составляет **1 литр воды на каждые 23 кг массы тела** или удержание цвета мочи на уровнях 1–3 по визуальной шкале.

##### 6. NIVEL 4 - Timing de los nutrientes y frecuencia (Тайминг и частота)

* **Перерывы в диете («Diet breaks»)** — запланированные 1–2 недели на уровне поддержки каждые 4–8 недель дефицита снижают адаптивный термогенез и психологическую усталость.
* **Рефиды («Refeeds»)** — кратковременное (24–48 часов) повышение углеводов до уровня поддержки для восполнения гликогена и поддержки Leptin.
* **Частота питаний** — оптимальный диапазон составляет **3–6 приёмов пищи в день**.
* **Пери-тренировочное питание** — приём **0,4–0,5 г/кг белка** за 1–2 часа до и через 1–2 часа после тренировки.

##### 7. NIVEL 5 - Suplementos (Пищевые добавки)

* **Реальный вклад** — добавки находятся на верхушке пирамиды и дают не более 5% итогового прогресса.
* **Список A (высокая доказательность)** — креатин моногидрат, кофеин, сывороточный белок, Омега-3 (EPA/DHA), витамин D3, мультивитамины.
* **Список B (смешанная доказательность)** — бета-аланин, цитруллин малат.
* **Список C (отсутствие доказанной пользы)** — BCAA, глютамин, HMB (для тренированных).
* **Фабрикация белка («Protein spiking»)** — обманная практика добавления дешевых аминокислот (таурин, глицин) для завышения показателя азота.

##### 8. Haciendo ajustes y midiendo el progreso (Измерение прогресса)

* **Ненадежность DXA и биоимпеданса** — погрешность индивидуальных сканирований (±3–5%) приводит к ошибочным диетическим решениям.
* **Оценка по весам** — принятие решений об изменении калорийности на 100–200 ккал производится только при отсутствии динамики средненедельного веса за 2–3 недели.
* **Антропометрия** — регулярные замеры окружностей талии (в 3 точках), груди, бедер и рук авто-натяжной лентой.
* **Силовые показатели** — сохранение рабочих весов на сушке является главным подтверждением сохранения мышечной ткани.

##### 9. Peaking para una competición (Выход на пик формы)

* **Базовое правило** — 95–99% успеха на сцене зависят от долгой диеты и глубины обезжиренности, а не от манипуляций последней недели.
* **Загрузка углеводами** — использование протоколов **«Front loading»** (загрузка в начале недели) или **«Back loading»** (загрузка накануне) без заливания подкожной клетчатки (**«Spilling over»**).
* **Вода и натрий** — отказ от опасного урезания воды и соли; резкие манипуляции ухудшают наполненность мышц и вызывают судороги.
* **Сгонка в силовых видах** — безопасная краткосрочная сгонка веса до 5% массы за счёт низковолокнистой диеты (&lt;10 г клетчатки) и водяного протокола.

##### 10. La dieta de recuperación (Восстановительная диета)

* **Отказ от «Dieta inversa»** — классическая реверсивная диета затягивает дефицит калорий и продлевает метаболические адаптации.
* **Протокол восстановления** — быстрое возвращение веса на **5–10% выше соревновательного** за 4–8 недель для мгновенного восстановления гормонов, либидо и психоэмоционального состояния.
* **Переход к межсезонью** — плавный отход от жесткого контроля к ориентиру на внутренние сигналы голода и сытости.

##### 11. Comportamiento y estilo de vida (Поведение и образ жизни)

* **Система трёх уровней точности** — **«Óptimo»** (учёт макросов ±5–10 г), **«Mejor»** (учёт белка ±10 г и калорий ±100 ккал), **«Bueno»** (учёт только калорий ±100 ккал).
* **Правило заимствования («El préstamo»)** — перенос до 20% калорий или макросов между днями недели для сохранения социальной жизни.
* **Учёт алкоголя** — алкоголь (7 ккал/г) учитывается за счёт урезания углеводов или жиров в пределах 15% суточной калорийности.
* **Считывание внутренних сигналов («Señales internas»)** — развитие навыков интуитивного контроля сытости в межсезонье для снижения рисков расстройств пищевого поведения.

#### Раздел 4. Пошаговый чек-лист действий по книге

1. **Определить текущую цель и точку отсчёта**: оценить процент жира в организме и выбрать между фазой набора массы, снижения жира или удержания веса.
2. **Рассчитать калории поддержки («Calorías de mantenimiento»)**: проводить 2-недельный отслеживаемый тест веса и рациона без изменения привычек.
3. **Установить целевой темп изменения веса**:
  * Для сгонки жира: 0,7–1% массы тела в неделю.
  * Для набора массы: 0,5–1,5% массы тела в месяц в зависимости от стажа.
4. **Зафиксировать нормы макронутриентов**:
  * Белок: 2,2–2,6 г/кг на сушке; 1,6–2,2 г/кг на наборе.
  * Жиры: 15–25% (сушка) или 20–30% (набор), не опускаться ниже 0,5 г/кг.
  * Углеводы: остаток калорийности, не менее 1,0 г/кг.
  * Клетчатка: 14 г на 1000 ккал.
5. **Обеспечить норму микронутриентов и жидкости**:
  * Употреблять 1 порцию фруктов и 1 порцию овощей на 1000 ккал (профицит) или 500 ккал (дефицит).
  * Пить 1 литр воды на 23 кг массы тела.
6. **Организовать тайминг и частоту питаний**:
  * Распределить рацион на 3–6 приёмов пищи в день.
  * Употреблять 0,4–0,5 г/кг белка за 1–2 часа до и после тренировки.
7. **Внедрить плановые разгрузки при длительном дефиците**:
  * Планировать 1–2 недели перерыва в диете (**«Diet breaks»**) каждые 4–8 недель дефицита.
  * Назначать 24–48 часовые углеводные рефиды (**«Refeeds»**).
8. **Подключить проверенные добавки (Список A)**: принимать креатин моногидрат (3–5 г/день), Омега-3 (1–2 г EPA+DHA), кофеин перед тренировкой (по потребности).
9. **Настроить систему мониторинга прогресса**:
  * Взвешиваться ежедневно натощак и считать среднее за неделю.
  * Делать заметки окружностей (талия в 3 точках, бедра, грудь, конечности) раз в неделю.
  * Отслеживать сохранение рабочих весов в зале.
10. **Проводить коррекцию рациона**: менять калорийность на 100–200 ккал только при отсутствии изменений средненедельного веса за 2–3 недели подряд.
11. **Применить восстановительную диету («Dieta de recuperación»)** по окончании соревнований: быстро повысить калории и набрать 5–10% массы за 4–8 недель для восстановления нормальной физиологии.
12. **Перейти на управление по внутренним сигналам**: ослаблять точный отслеживающий контроль в межсезонье, ориентируясь на чувство сытости и голода (**«Señales internas»**).

#### Раздел 5. Типичные ошибки по книге и способы их избежать

* **Ошибка 1: Нарушение иерархии приоритетов (****«Poner el carro delante del caballo»****)**.
  * *Как избежать:* Сфокусироваться сначала на Уровне 1 (калории) и Уровне 2 (макросы). Не искать спасения в добавках или смене тайминга, пока не выстроен фундаментальный баланс.
* **Ошибка 2: Чёрно-белое диетическое мышление (****«Pensamiento blanco/negro»****)**.
  * *Как избежать:* Переходить на систему гибкого контроля макросов (допустимые диапазоны ±100 ккал / ±10 г белка) и использовать правило заимствования калорий между днями [2, 33, 52-61; 6, 268-273].
* **Ошибка 3: Жесткое деление продуктов на «хорошие» и «плохие» (****«Comida buena vs comida mala»****)**.
  * *Как избежать:* Использовать мышление включения (**«Mentalidad de inclusión»**) — сначала набрать норму микронутриентов и клетчатки цельными продуктами, после чего допускать любые продукты в умеренных количествах.
* **Ошибка 4: Использование реверсивной диеты (****«Dieta inversa»****) после соревнований**.
  * *Как избежать:* Применять восстановительную диету (**«Dieta de recuperación»**), быстро поднимая калории до уровня поддержки и набирая 5–10% жировой массы для нормализации метаболизма и гормонов.
* **Ошибка 5: Чрезмерное использование кардио на сушке**.
  * *Как избежать:* Ограничить объём кардиотренировок (не более половины от времени силовых) и отдавать предпочтение низкоинтенсивным видам без эксцентрической нагрузки (велотренажер, эллипс).
* **Ошибка 6: Решение о смене диеты на основе разовых взвешиваний или результатов сканирования DXA**.
  * *Как избежать:* Игнорировать погрешностные сканы составных тканей (DXA ±3–5%), принимать решения только по тренду средненедельного веса за 2–3 недели и замерам лентой.
* **Ошибка 7: Резкое урезание воды и натрия перед соревнованиями на пиковой неделе**.
  * *Как избежать:* Сохранять потребление воды и соли привычно стабильным; плотность и объем мышц зависят от грамотной углеводной загрузки, а обезвоживание делает мышцы плоскими.

#### Раздел 6. 20 карточек «вопрос — ответ» для повторения

1. **Вопрос:** Назовите 5 уровней Пирамиды питания Эрика Хелмса в порядке убывания важности.
  * **Ответ:** 1. Balance energético, 2. Macronutrientes y fibra, 3. Micronutrientes y agua, 4. Timing y frecuencia, 5. Suplementos.
2. **Вопрос:** Каков рекомендуемый недельный темп сброса веса для защиты мышечной массы?
  * **Ответ:** 0,7–1% от общей массы тела в неделю.
3. **Вопрос:** Каковы месячные нормы набора веса для новичков, средних и продвинутых атлетов?
  * **Ответ:** Новички: 1–1,5% в месяц; средний уровень: 0,5–1% в месяц; продвинутые: до 0,5% в месяц.
4. **Вопрос:** Что такое доступность энергии (*«Disponibilidad energética»*) и каков её критический порог?
  * **Ответ:** Энергия, остающаяся на базовую физиологию после вычитания затрат на тренировки. Опасный порог — ниже 30 ккал/кг тощей массы у женщин и ~20–25 ккал/кг у мужчин.
5. **Вопрос:** Какова норма белка при дефиците калорий (на сушке)?
  * **Ответ:** 2,2–2,6 г на кг массы тела в день.
6. **Вопрос:** Какова норма белка при профиците калорий (на наборе)?
  * **Ответ:** 1,6–2,2 г на кг массы тела в день.
7. **Вопрос:** Каковы минимальные суточные нормы жиров и углеводов?
  * **Ответ:** Не менее 0,5 г/кг для жиров и не менее 1,0 г/кг для углеводов.
8. **Вопрос:** Какова целевая норма потребления клетчатки (*«Fibra»*)?
  * **Ответ:** 14 г на каждые 1000 ккал рациона (или ориентировочно 25 г для женщин, 38 г для мужчин).
9. **Вопрос:** В чём суть принципа «Mentalidad de inclusión vs exclusión»?
  * **Ответ:** Фокусироваться на включении в рацион питательных продуктов, а не на жестком запрете и исключении «нечистой» еды.
10. **Вопрос:** Сколько порций фруктов и овощей нужно съедать ежедневно?
  * **Ответ:** При профиците: 1 порция фруктов и 1 порция овощей на 1000 ккал; при дефиците: 1 порция на 500 ккал.
11. **Вопрос:** Каков базовый ориентал суточной нормы воды?
  * **Ответ:** 1 литр жидкости на каждые 23 кг массы тела или контроль прозрачности мочи (уровни 1–3 шкалы).
12. **Вопрос:** Что такое «Diet break» и как часто его применять?
  * **Ответ:** Перерыв в дефиците на 1–2 недели на уровне поддержки калорий; применяется каждые 4–8 недель сушки.
13. **Вопрос:** Что такое углеводный рефид (*«Refeed»*)?
  * **Ответ:** Кратковременное (24–48 часов) повышение калорийности до уровня поддержки преобладающе за счет углеводов.
14. **Вопрос:** Какова оптимальная частота питаний в день?
  * **Ответ:** От 3 до 6 приёмов пищи в день.
15. **Вопрос:** Какие добавки входят в Список A (высочайшая доказательность)?
  * **Ответ:** Креатин моногидрат, кофеин, сывороточный белок, Омега-3 (EPA/DHA), витамин D3, мультивитамины.
16. **Вопрос:** Почему BCAA находятся в Списке C (неэффективные добавки)?
  * **Ответ:** При достаточной суточной норме цельного белка дополнительные BCAA не дают никаких преимуществ.
17. **Вопрос:** Что такое «Protein spiking»?
  * **Ответ:** Обманная практика добавления дешевых аминокислот (таурин, глицин) для имитации высокого содержания белка в лабораторных тестах на азот.
18. **Вопрос:** Как правильно отслеживать динамику массы тела?
  * **Ответ:** Взвешиваться ежедневно натощак после туалета, вычислять среднее за неделю и сравнивать тренды за 2–3 недели.
19. **Вопрос:** В чём главное отличие «Dieta de recuperación» от «Dieta inversa»?
  * **Ответ:** Восстановительная диета быстро возвращает калории и наберает +5–10% массы для нормализации физиологии, а реверсивная затягивает дефицит.
20. **Вопрос:** Что включает система 3 уровней точности (*«Sistema de tres niveles»*)?
  * **Ответ:** «Óptimo» (учёт макросов ±5–10 г), «Mejor» (белок ±10 г и калории ±100 ккал) и «Bueno» (только калории ±100 ккал).

##### Задание 1 (для интернет-магазина одежды)

**Разработка «Пирамиды приоритетов E-commerce» для клиентского сервиса.**
* **Контекст книги:** Избавление от ошибки *«Poner el carro delante del caballo»* (Уровень 1 — база/калории, Уровень 5 — добавки).
* **Задание:** Спроектируйте 5-уровневую систему приоритетов магазина:
  1. *Уровень 1 (Базовый баланс):* Скорость загрузки сайта, наличие размеров и корректность остатков.
  2. *Уровень 2 (Макро-параметры):* Точность размерной сетки, прозрачные условия доставки и возврата.
  3. *Уровень 3 (Микро-детали):* Качественные фото и видео одежды под разными углами.
  4. *Уровень 4 (Тайминг):* Скорость обработки заказа и уведомления в мессенджерах.
  5. *Уровень 5 (Добавки/«Вишенки»):* Красивая упаковка и подарочные бонусы.
* **Цель:** Запретить команде тратить бюджет на Уровень 5, пока не отлажены Уровни 1 и 2.

##### Задание 2 (для B2B-лидогенерации)

**Внедрение «Системы трёх уровней точности» (Sistema de tres niveles) в KPI лидогенерации.**
* **Контекст книги:** Отказ от бинарного мышления *«Pensamiento blanco/negro»* (уровни «Óptimo», «Mejor», «Bueno») [2, 33, 53; 6, 268-272].
* **Задание:** Сформулируйте трёхуровневую систему оценки результатов маркетинговой кампании:
  1. *Уровень «Óptimo» (Точный целевой результат):* Выполнение плана по целевым квалифицированным лидам (SQL) с точностью ±5%.
  2. *Уровень «Mejor» (Хороший диапазон):* Попадание в рамки бюджета по стоимости лида (CPL) и выполнение плана по ключевому контакту.
  3. *Уровень «Bueno» (Базовый объем):* Соблюдение общего суточного бюджета и общего объема входящего трафика (MQL).
* **Цель:** Исключить срывы команды и остановку кампаний из-за некритичных отклонений в узких показателях.

##### Задание 3 (для разработчиков сборщиков данных на Claude/Python)

**Разработка алгоритма фильтрации шума на основе 2-недельного сглаживания (метод средней массы тела).**
* **Контекст книги:** Игнорирование ежедневных колебаний веса и вычисление средней величины за 2–3 недели.

  1. Скрипт принимает ежедневные флуктуирующие цены/данные.
  2. Алгоритм рассчитывает скользящее среднее за 7–14 дней для удаления случайных выбросов (водного шума).
  3. Скрипт принимают решение о корректировке нормальной цены/тренда только в том случае, если среднее значение 2-й недели отклоняется от 1-й недели более чем на заданный % (аналог изменения калорий на 100–200 ккал при застое веса).
* **Цель:** Защитить систему от ложных срабатываний на основе разовых аномальных всплесков.

##### Задание 4 (для B2B-лидогенерации и отделов продаж)

**Проектирование спринтов с аналогами «Diet Breaks» и «Refeeds» для предотвращения выгорания.**
* **Контекст книги:** Внедрение 1–2 недель планового отдыха (**«Diet breaks»**) каждые 4–8 недель дефицита и кратковременных рефидов.
