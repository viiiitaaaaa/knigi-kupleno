## Подробный учебный конспект книги «Руководство пользователя мозга по нейролингвистическому программированию» (Vol. 1)

### 1. О чём книга в 3 предложениях



1. Данное руководство представляет собой исчерпывающий учебный курс по нейролингвистическому программированию (Neuro-Linguistic Programming), раскрывающий механизмы того, как мозг и нервная система человека кодируют и структурируют субъективный опыт с помощью сенсорных репрезентативных систем и субмодальностей.

2. Авторы подробно объясняют практическое применение языковых инструментов — Мета-модели (Meta-Model) для деконструкции искажений речи и Модели Милтона (Milton Model) для направленной работы с бессознательным и трансовыми состояниями.

3. Книга обучает методологии управления внутренними состояниями, якорению (Anchoring), трансформации ментальных стратегий и работе с временными линиями (Time-Lines) для достижения личностной ресурсности и высокого мастерства в коммуникации.



### 2. Главные идеи по главам



#### Глава 1: Содержание модели: Репрезентативная система (The Content Of The Model: The Representational System)



* Человеческий мозг кодирует внешний опыт через сенсорные каналы восприятия — визуальный (Visual), аудиальный (Auditory), кинестетический (Kinesthetic), ольфакторный (Olfactory) и густаторный (Gustatory) (система VAKOG).

* Субмодальности (Submodalities) представляют собой качественные параметры элементов VAK (например, яркость, размытость, локация, громкость), которые задают биохимическую реакцию и параметры переживания.

* Глазодвигательные реакции (Eye Accessing Cues) и сенсорные предикаты (Predicates) в речи выдают текущую активную репрезентативную систему человека.

* Вторичная языковая система (Auditory Digital) работает на мета-уровне по отношению к первичным сенсорным модальностям и модулирует их.



#### Глава 2: Основы — Установление связи с людьми: Построение и поддержание раппорта (The Basics — Connecting With People: Building And Maintaining Rapport)



* Сенсорная чувствительность (Sensory Acuity) в состоянии внешней направленности внимания (Up-time) позволяет отслеживать минимальные невербальные изменения собеседника.

* Раппорт (Rapport) достигается посредством подстройки (Pacing / Matching &amp; Mirroring) к позе, ритму дыхания, тону голоса и предикатам речи.

* Калибровка (Calibration) заключается в связывании наблюдаемых физиологических проявлений человека с его внутренним состоянием.

* Устойчивое ведение (Leading) возможно только после установления прочного раппорта, когда собеседник бессознательно начинает следовать за изменениями вашей физиологии.



#### Глава 3: Перцептивные позиции (Perceptual Positions)



* 1-я позиция (First Position / Self) — восприятие ситуации из собственных глаз, полная ассоциация со своими чувствами и потребностями.

* 2-я позиция (Second Position / Other) — эмпатическое вхождение в позицию другого человека, восприятие мира его глазами.

* 3-я позиция (Third Position / Observer) — диссоциированный взгляд объективного стороннего наблюдателя.

* 4-я и 5-я позиции (4th &amp; 5th Positions) добавляют системную перспективу всего контекста и универсальный мета-взгляд.

* Паттерн выравнивания перцептивных позиций (Aligning Perceptual Positions Pattern) устраняет внутренний конфликт частей и гармонизирует восприятие.



#### Глава 4: Пресуппозиции НЛП для развития ресурсности (NLP Presuppositions For Building Resourcefulness)



* Фундаментальный принцип: «Карта — это не территория» (&quot;The map is not the territory&quot;), человек реагирует на свою субъектную модель мира, а не на сам внешний мир.

* Разум и тело образуют единую кибернетическую систему (Mind-and-body affect each other), где изменения в мыслях меняют физиологию и наоборот.

* В системе нет поражений, есть только обратная связь (&quot;There is no failure, only feedback&quot;), а смысл коммуникации заключается в полученном ответе.

* Каждый человек обладает всеми необходимыми ресурсами для изменений и всегда делает лучший выбор из доступных ему в данный момент.



#### Глава 5: НЛП как модель коммуникации: Совершенство в общении (NLP As A Communication Model: Excellence In Communicating)



* Модель хорошо сформулированного результата (Well-Formed Outcome Model) требует, чтобы цель была позитивной, подконтрольной человеку, описанной сенсорным языком и экологичной.

* Декартовы координаты (Cartesian Coordinates) служат инструментом проверки мотивации и последствия достижения цели через 4 вопроса логических квадратов.

* Сознание ограничено пропускной способностью 7±2 единиц (chunks) информации, что требует удержания четкого фокуса внимания.

* Восприятие коммуникации всегда осложняется внутренними фильтрами, ценностями и текущим нейролингвистическим состоянием.



#### Глава 6: Фрейминг для ресурсности (Framing For Resourcefulness)



* Значение любого события полностью определяется рамкой контекста или фреймом (Frame).

* Фрейм «Как если бы» (As If Frame) позволяет преодолеть ментальные ограничения, предлагая представить, что задача уже успешно решена.

* Рамка дублирования / подстройки (Backtrack Frame) использует точные слова и предикаты собеседника для верификации смыслов и укрепления доверия.

* Диссоциированный фрейм (Dissociated Frame) и техника Быстрого лечения фобий (Fast Phobia Cure) обесточивают травматические воспоминания и критику путем взгляда со стороны.



#### Глава 7: Искусство управления состояниями (The Art Of State Management)



* Состояние (State) складывается из сочетания внутренних репрезентаций (картинок/звуков) и текущей физиологии человека.

* Управление состояниями включает отслеживание, прерывание нересурсных состояний (Break State) и вызов (Elicitation) нужных ресурсов.

* Смена состояния достигается резким изменением положения тела, сдвигом фокуса внимания или отвлекающим действием.

* Шкалирование состояний от 1 до 10 помогает сознанию детализировать и восстановить контроль над эмоциями.



#### Глава 8: Мета-модель языка: Структура и значение (The Meta-Model Of Language: Structure And Meaning)



* При переходе от Глубинной структуры (Deep Structure) к Поверхностной структуре (Surface Structure) речи происходят опущение (Deletion), искажение (Distortion) и обобщение (Generalization).

* Мета-модель представляет собой систему уточняющих вопросов, возвращающих речь к непосредственному опыту и расширяющих обедненную карту.

* Ключевыми нарушениями являются номинализации (Nominalizations — застывшие процессы), чтение мыслей (Mind Reading), причинно-следственные связки (Cause-Effect) и комплексные эквиваленты (Complex Equivalence).

* Расширенная Мета-модель Майкла Холла добавила распознавание тождеств (Identification), статических слов и эгоцентрического персонализирования.



#### Глава 9: Гипноз, Часть I — Неправильно понятая природа так называемого «гипноза» (Hypnosis Part I — The Misunderstood Nature Of So-Called &quot;Hypnosis&quot;)



* Гипноз и транс — это естественные состояния фокуса внимания, направленного вовнутрь (Downtime), в которых происходит переработка нейросемантических смыслов.

* Бессознательное (Unconscious Mind) включает автоматические навыки (Unconscious Competence), автономическую нервную систему, подавленные воспоминания и мета-уровни убеждений.

* 6-шаговый рефрейминг (Six-Step Reframe) налаживает прямую коммуникацию с частью бессознательного, создающей нежелательное поведение, для выбора новых ресурсов.



#### Глава 10: Гипноз, Часть II — Модель Милтона (Hypnosis Part II — The Milton Model)



* Модель Милтона является обращением Мета-модели и использует искусно неопределенный язык (Artful Vagueness) для мягкого наведения транса.

* Ключевые паттерны включают разделительные вопросы (Tag Questions), двойные связки (Double Binds), внедренные команды (Embedded Commands) и аналоговое выделение (Analogue Marking).

* Утилизация (Utilization) позволяет превратить любое случайное внешнее событие или реакцию клиента в фактор углубления транса.



#### Глава 11: Гипноз, Часть III — Истории, метафоры, аналогии (Hypnosis Part III — Story, Metaphor, Analogy)



* Метафоры работают через трансдеривационный поиск (Trans-derivational Search — TDS), заставляя человека бессознательно искать ассоциации в собственной библиотеке опыта.

* Изоморфизм (Isomorphism) обеспечивает точное структурное соответствие между сюжетом метафоры и реальной проблемой человека.

* Смещение индекса референции (Displacing Referential Index) позволяет бессознательно принять решение в обход сопротивления сознания.



#### Глава 12: Категории Сатир (Satir Categories)



* Вирджиния Сатир выделила 5 стрессовых паттернов общения: Обвинитель (Blamer), Угодник (Placater), Компьютер (Computer), Отвлекающий (Distracter) и Уравниватель / Выравниватель (Leveler).

* Обвинитель смещает ответственность наружу; Угодник принимает вину на себя; Компьютер уходит в сухую отстраненную логику; Отвлекающий хаотично переключает темы.

* Раппорт безопаснее всего поддерживать из позиции Уравнивателя (Leveler), в то время как подстройка к Обвинителю ведет к неизбежной эскалации конфликта.



#### Глава 13: Якорение: Управление неврологией (Anchoring: Managing Neurology)



* Якорение опирается на принцип условных рефлексов: любой внешнее или внутренний стимул связывается с нейрологическим состоянием.

* 4 ключа успешного якорения: Уникальность стимула (Uniqueness), Интенсивность переживания (Intensity), Чистота состояния (Purity) и Точность по времени (Precision).

* Для трансформации применяются техники схлопывания якорей (Collapsing Anchors), цепочек якорей (Chaining Anchors) и Круга совершенства (Circle of Excellence).



#### Глава 14: Фокусировка на субмодальностях (Focusing On Submodalities)



* Изменение субмодальных параметров напрямую меняет нейрологический отклик нервной системы на воспоминание или мысль.

* Техника переноса субмодальностей (Mapping Across) накладывает параметры ресурсного состояния на проблемный образ.

* Паттерн «Взмах» (Swish Pattern) мгновенно заменяет визуальный триггер нежелательного поведения на образ желаемого «Я-в-будущем».

* Паттерн изменения убеждений (Belief Formation Change Pattern) переводит нежелательное убеждение через сомнение в музей старых убеждений, а затем интегрирует новое.



#### Глава 15: Стратегии (Strategies)



* Ментальная стратегия представляет собой последовательность сенсорных репрезентаций, приводящую к конкретному поведению или решению.

* Микропрограммы мозга описываются моделью TOTE (Test-Operate-Test-Exit — Проверка-Операция-Проверка-Выход).

* Выявление (Elicitation), прерывание и встраивание (Installation) стратегий позволяют перенимать навыки и устранять сбои в мышлении.



#### Глава 16: Введение в работу с временными линиями (An Introduction To Time-Lining)



* Человеческий мозг кодирует восприятие времени пространственно в виде Временной линии (Time-Line).

* Различают кодирование «Сквозь время» (Through Time — вся линия перед глазами) и «Во времени» (In Time — линия проходит через тело).

* Эмоциональные травмы объединяются в гештальты вокруг первой первопричины — SEEP (Significant Emotional Experience of Pain).

* Очистка временной линии заключается в диссоциированном подъеме над линией, выходе в точку «до первопричины» и извлечении обучающих уроков.

### 4. Пошаговый чек-лист практических действий



1. **Формулировка цели по модели Well-Formed Outcome**

  * [ ] Сформулируйте цель позитивно (что вы хотите получить, а не от чего уйти).

  * [ ] Опишите результат сенсорно: что вы конкретно увидите, услышите и почувствуете.

  * [ ] Проверьте цель на экологичность для вашей жизни и отношений.

  * [ ] Проверьте мотивацию через Декартовы координаты (4 вопроса квадрата).

2. **Калибровка и установление раппорта (Rapport)**

  * [ ] Перейдите в состояние «Up-time» (внешняя сенсорная чувствительность).

  * [ ] Определите ведущую репрезентативную систему собеседника по глазодвигательным реакциям и предикатам.

  * [ ] Осуществите незаметную подстройку (Pacing) к позе, ритму дыхания и темпу речи.

  * [ ] Проверьте наличие раппорта с помощью пробного ведения (Leading).

3. **Прояснение ситуации с помощью Мета-модели**

  * [ ] Растопите номинализации («коммуникация», «отношения») вопросом: *«Как именно вы хотите взаимодействовать?»*.

  * [ ] Оспорьте чтение мыслей и причинно-следственные связи: *«Как именно X вызывает Y?»*.

  * [ ] Восстановите опущенные детали и снимите операторы необходимости («должен» → *«что произойдет, если не...?»*).

4. **Вызов и якорение ресурсного состояния (Anchoring)**

  * [ ] Вспомните опыт максимальной уверенности или спокойствия (Elicitation).

  * [ ] Войдите в него ассоциированно (проживая его из своих глаз).

  * [ ] На пике переживания установите чистый кинестетический или аудиальный якорь.

  * [ ] Сделайте прерывание состояния (Break State) и проверьте работу якоря.

5. **Трансформация негативного образа с помощью субмодальностей или «Взмаха» (Swish)**

  * [ ] Определите критическую субмодальность проблемы (размер, яркость, дистанция).

  * [ ] Уменьшите и отдалите проблемный образ, сделав его черно-белым.

  * [ ] Примените Swish: разместите проблему на большом экране, а в угол поместите маленький темный образ желаемого «Я»; быстро схлопните их.

6. **Проверка на будущее (Future Pace)**

  * [ ] Мысленно перенеситесь в будущую ситуацию, где ранее возникали сложности.

  * [ ] Убедитесь, что автоматически реагируете из нового ресурсного состояния.



### 5. Типичные ошибки и как их избежать



1. **Спутывание карты с территорией (Confusing Map with Territory)**

  * *Ошибка:* Принятие собственных оценок, убеждений или интерпретаций за объективную реальность.

  * *Как избежать:* Помнить пресуппозицию «Карта — это не территория». Регулярно спрашивать себя: *«Это факты VAK или моя интерпретация?»*.

2. **Застревание в одной перцептивной позиции (Getting Stuck in One Perceptual Position)**

  * *Ошибка:* Застревание в 1-й позиции ведет к эгоцентризму; во 2-й — к роли спасателя/жертвы; в 3-й — к эмоциональной отстраненности и «роботоподобности».

  * *Как избежать:* Практиковать гибкий сознательный переход между тремя позициями восприятия.

3. **Работа с содержанием вместо структуры и процессов (Focusing on Content rather than Process)**

  * *Ошибка:* Долгое погружение в историю «почему это произошло», что увязает человека в проблеме.

  * *Как избежать:* Работать на уровне структуры: менять субмодальности, якоря, последовательности TOTE и фреймы.

4. **Грубое или прямое калькирование при подстройке (Direct Over-Mirroring)**

  * *Ошибка:* Буквальное копирование агрессивных жестов или мимики собеседника, что воспринимается как насмешка.

  * *Как избежать:* Использовать перекрестное отслеживание (Cross-Mirroring) — например, подстраивать ритм своего дыхания под темп речи собеседника.

5. **Использование Мета-модели как допроса (Using Meta-Model like an Inquisition)**

  * *Ошибка:* Атака вопросами Мета-модели без установления раппорта, что вызывает выстраивание защиты.

  * *Как избежать:* Сначала установить раппорт, использовать смягчающие фреймы и поддерживать уважительную интонацию.



### 6. 20 карточек «вопрос — ответ» для повторения



1. **В:** Что означает аббревиатура НЛП (NLP)?

**О:** Нейролингвистическое программирование — исследование структуры субъективного опыта и того, как язык и мышление структурируют неврологию.

2. **В:** Что такое репрезентативная система (Representational System)?

**О:** Сенсорные каналы (VAKOG), с помощью которых мозг воспринимает, кодирует и воспроизводит опыт.

3. **В:** Чем модальность отличается от субмодальности (Submodality)?

**О:** Модальность — это сам сенсорный канал (зрение, слух, кинестетика), а субмодальности — качественные параметры внутри него (яркость, размер, расстояние, громкость, локация).

4. **В:** Что такое предикаты (Predicates)?

**О:** Сенсорно-ориентированные слова в речи, отражающие текущую репрезентативную систему человека.

5. **В:** Как расшифровывается VAKOG?

**О:** Visual (визуальный), Auditory (аудиальный), Kinesthetic (кинестетический), Olfactory (обонятельный), Gustatory (вкусовой).

6. **В:** Что показывает 2-я перцептивная позиция (Second Position)?

**О:** Точку зрения другого человека; способность встать на его место и прочувствовать ситуацию его глазами.

7. **В:** Какова главная идея пресуппозиции «Карта — это не территория»?

**О:** Наши внутренние представления о мире — лишь символические модели, а не сам объективный мир.

8. **В:** Назовите 4 условия хорошо сформулированного результата (Well-Formed Outcome).

**О:** Позитивная формулировка, подконтрольность себе, сенсорное описание (VAK) и экологичность.

9. **В:** Что такое фрейм «Как если бы» (As If Frame)?

**О:** Техника мышления, предлагающая действовать или думать так, будто желаемое условие или решение уже существует.

10. **В:** Какова цель Мета-модели языка (Meta-Model)?

**О:** Восстановление информации, утерянной при опущении, искажении и обобщении, и переход от поверхностной структуры речи к глубинной.

11. **В:** Что такое номинализация (Nominalization)?

**О:** Искажение, при котором динамический процесс (глагол) превращается в статичное абстрактное существительное (например, «любовь», «страх»).

12. **В:** Чем Модель Милтона (Milton Model) отличается от Мета-модели?

**О:** Мета-модель деконструирует обобщения для вывода из транса, а Модель Милтона использует преднамеренную неопределенность для наведения транса.

13. **В:** Что такое трансдеривационный поиск (TDS)?

**О:** Бессознательный внутренний поиск в собственной библиотеке воспоминаний и смыслов для придания значения метафоре.

14. **В:** Перечислите 5 категорий Вирджинии Сатир (Satir Categories).

**О:** Обвинитель (Blamer), Угодник (Placater), Компьютер (Computer), Отвлекающий (Distracter), Уравниватель (Leveler).

15. **В:** Назовите 4 ключа успешного якорения (Anchoring).

**О:** Уникальность стимула, Интенсивность состояния, Чистота состояния и Точность момента установки.

16. **В:** Как работает техника «Схлопывание якорей» (Collapsing Anchors)?

**О:** Одновременный запуск негативного и более мощного позитивного якоря вынуждает мозг объединить нейроцепи и нейтрализовать негатив.

17. **В:** В чем суть паттерна «Взмах» (Swish Pattern)?

**О:** Быстрая замена визуального триггера нежелательного поведения на образ желаемой идентификации в будущем.

18. **В:** Как расшифровывается TOTE в исследовании стратегий?

**О:** Test (Проверка) — Operate (Операция) — Test (Проверка) — Exit (Выход).

19. **В:** В чём различие между типами времени «Through Time» и «In Time»?

**О:** При «Through Time» вся линия времени находится перед глазами со стороны; при «In Time» линия проходит сквозь тело.

20. **В:** Что такое SEEP в контексте временных линий?

**О:** Significant Emotional Experience of Pain — значимый эмоциональный опыт боли, являющийся первопричиной гештальта негативных эмоций.



### 7. 5 практических заданий на применение



#### Задание 1: В отношениях с мужчиной (Гашение конфликтов через категории Сатир и Перцептивные позиции)



* **Контекст:** При возникновении эмоциональных претензий или резких слов с его стороны.

* **Действие:** Сначала откалибруйте категорию Сатир (например, если он в позиции Обвинителя (Blamer) с жестким тоном). Не вступайте во встречное обвинение. Мысленно перейдите во 2-ю перцептивную позицию — сфокусируйтесь на его позитивном намерении (Positive Intention). Задействуйте позицию Уравнивателя (Leveler): сделайте глубокий вдох, снимите напряжение из голоса и озвучьте факты без оценок и обвинений.



#### Задание 2: В отношениях с заказчиками (Раскодирование требований и номинализаций с помощью Мета-модели)



* **Контекст:** Заказчик дает размытое ТЗ: *«Мне нужен качественный, стильный дизайн и профессиональное отношение»*.

* **Действие:** Выявите номинализации «качество», «стиль», «профессионализм». Примените вопросы Мета-модели: *«Как именно вы поймете, что дизайн качественный? Что конкретно вы увидите на макете? Что для вас означает &#x27;профессиональное отношение&#x27; в наших сроках и коммуникации?»*. Переведите разговор из абстрактных оценок в сенсорные стандарты VAK.



#### Задание 3: В отношениях с друзьями (Калибровка, подстройка и выравнивание раппорта)



* **Контекст:** Разговор с другом или подругой, находящимися в эмоциональном упадке или возбуждении.

* **Действие:** Откалибруйте предикаты и невербальные signals друга. Если друг использует визуальные предикаты (*«не вижу выхода», «все выглядит мрачно»*), подстройтесь своими предикатами (*«давай посмотрим на это внимательнее»*). Подстройтесь под темп речи и позу. Только после установления раппорта плавно снижайте темп голоса для ведения человека к спокойствию.



#### Задание 4: Для себя — Уверенность и Защита от манипуляций (Диссоциация, установка якоря и снятие причинно-следственных связей)



* **Контекст:** Попытка манипуляции или навязывания чувства вины (*«Ты меня подводишь», «Из-за тебя у нас проблемы»*).

* **Действие:** Включите Диссоциированный фрейм (Dissociated Frame) — мысленно поставьте перед собой прозрачное стекло и увидьте слова манипулятора в виде бегущей строки или текста на экране. Активируйте заранее созданный кинестетический якорь уверенности (например, сжатие пальцев). Задайте вопрос Мета-модели по поводу Cause-Effect: *«Каким именно образом мое действие автоматически приводит к этой проблеме?»*.



#### Задание 5: Для себя — Спокойствие и снятие тревоги (Субмодальное редактирование и диссоциация на временной линии)



* **Контекст:** Возникновение внутренней тревоги от мыслей о будущем или болезненных воспоминаний.

* **Действие:** Вызовите внутренний образ тревожной ситуации. Определите его субмодальности (как правило, это яркая, близкая, объемная картинка). Отодвиньте её далеко от себя, уменьшите до размера спичечной коробки, сделайте черно-белой и плоской. Если тревога застряла на Временной линии, мысленно поднимитесь «выше своей линии времени» (Go Meta) в позицию диссоциированного наблюдателя.
