## 1) О чём книга в 3 предложениях

**Книга «Lean Analytics» описывает методологию использования данных для быстрого и объективного развития стартапа без самообмана. Она объясняет, как сочетание типа бизнес-модели и стадии развития компании определяет выбор Единой Ключевой Метрики (OMTM), на которой необходимо сфокусироваться в конкретный момент. Авторы предлагают практические ориентиры («линии на песке») и циклы экспериментов, позволяющие вовремя находить продукт, нужный рынку, и масштабировать его.**

---

## 2) Главные идеи по частям: идея, правило, пример из книги

### **Часть 1: Перестаньте врать себе**
* **Идея:** Предприниматели склонны верить в собственный вымысел («поле искажения реальности»), поэтому им необходимы жесткие данные, чтобы объективно оценивать прогресс и не потратить жизни на продукт, который никому не нужен.
* **Правило:** **Хорошая метрика — это отношение или коэффициент, она сравнительна, понятна и меняет ваше поведение.** Избегайте «метрик тщеславия» (vanity metrics, например, общего количества просмотров или регистраций), которые лишь тешат эго, но не ведут к конкретным действиям.
* **Пример из книги:** Проект **HighScore House** установил целевую планку использования сервиса родителями и детьми 4 раза в неделю. Когда метрика не была достигнута, основатель обзвонил клиентов и выяснил, что семьи, использующие сервис 1–2 раза в неделю, всё равно получают огромную ценность; это позволило скорректировать определение «активного пользователя» на основе реального поведения.

### **Часть 2: Поиск правильной метрики на данный момент**
* **Идея:** Стартап проходит 5 последовательных стадий (**Эмпатия, Липкость, Виральность, Выручка, Масштабирование**). На каждой стадии существует только одна Единая Ключевая Метрика (**OMTM — One Metric That Matters**), требующая максимальной концентрации команды.
* **Правило:** **Не оптимизируйте виральность или масштабирование до того, как докажете «липкость» (продукт удерживает пользователей).**
* **Пример из книги:** Компания **Moz** отслеживала множество показателей, но по совету инвестора сократила их список до одного главного показателя — **Net Adds** (чистый прирост платных подписчиков за вычетом оттока), что дало всей команде чёткий ориентир для ежедневной работы.

### **Часть 3: Ориентиры в песке (Нормативы)**
* **Идея:** Данные бессмысленны без контекста; необходимо устанавливать четкие цифровые пороги («линии на песке») и знать отраслевые бенчмарки, чтобы понимать, достигли ли вы успеха или нужно менять подход.
* **Правило:** **Если метрика достигла отраслевого норматива, прекратите тратить ресурсы на её дальнейшую шлифовку и переходите к следующей проблеме.**
* **Пример из книги:** Хостинг **WP Engine** переживал из-за оттока клиентов в 2% в месяц, но, узнав, что 2% — это минимально возможный показатель (best case scenario) в сфере хостинга, основатель перестал безуспешно снижать отток и переключил ресурсы на привлечение новых клиентов.

### **Часть 4: Применение Lean Analytics на практике**
* **Идея:** Принципы Lean Analytics применимы не только в B2C-стартапах, но и в продажах крупным корпоративным клиентам (Enterprise), а также внутри зрелых компаний (интрапренерство).
* **Правило:** **Для создания инноваций внутри корпорации используйте автономную команду со сквозной ответственностью («Skunk Works») и заручитесь поддержкой топ-менеджера.**
* **Пример из книги:** Компания **Coradiant** начинала с IT-консалтинга, но заметила, что клиентам нужна не дорогостоящая инфраструктура целиком, а измерения качества работы сайта; в результате компания пересобрала продукт в виде специализированного оборудования и совершила успешный пивот.

## 4) Чек-лист: что делать на практике, по шагам

1. **Определите свою бизнес-модель** из 6 базовых типов (E-commerce, SaaS, Бесплатное мобильное приложение, Медиа-сайт, UGC, Двусторонний маркетплейс).
2. **Заполните Lean Canvas** (одностраничный бизнес-план из 9 блоков) для фиксации базовых гипотез риска.
3. **Пройдите стадию Эмпатии (Empathy):**
   * Проведите не менее 15 проблемных интервью с потенциальными клиентами.
   * Не предлагайте решение сразу; измеряйте глубину боли и то, как проблему решают сейчас.
   * Оцените интервью по бальной системе и подтвердите спрос количественным опросом или лендингом.
4. **Сформулируйте минимальный продукт (MVP):**
   * Оставьте только те функции, которые ведут пользователя к «aha!»-моменту.
5. **Найдите свою OMTM на стадии Липкости (Stickiness):**
   * Выберите метрику удержания (Retention, Daily Active Users, Churn).
   * Нарисуйте «линию на песке» (целевой показатель).
   * Задавайте 7 вопросов перед добавлением любой новой функции.
   * Проводите когортный анализ для проверки гипотез.
6. **Включите рычаги Виральности (Virality):**
   * Измеряйте виральный коэффициент (\\(K\\)) и сокращайте время вирального цикла.
   * Найдите опережающие индикаторы (leading indicators) вовлечения.
7. **Оптимизируйте Выручку (Revenue):**
   * Рассчитайте стоимость привлечения клиента (CAC) и пожизненную ценность (LTV).
   * Стремитесь к тому, чтобы LTV превосходила CAC минимум в 3 раза, а окупаемость CAC составляла менее 12 месяцев.
8. **Переходите к Масштабированию (Scale):**
   * Применяйте модель «Three-Threes» (3 предположения, 3 действия, 3 эксперимента) для синхронизации команды.

## 5) Типичные ошибки и как их избежать

1. **Ориентация на «метрики тщеславия» (Vanity Metrics)**
   * *Ошибка:* Отслеживание просмотров страниц, скачиваний или общего числа регистраций.
   * *Как избежать:* Измеряйте процент активных пользователей, конверсию и повторяющиеся действия.
2. **Преждевременное масштабирование или виральность (Premature Scaling/Virality)**
   * *Ошибка:* Запуск платной рекламы и виральных механик до того, как продукт стал «липким».
   * *Как избежать:* Сначала добейтесь низкого оттока (Churn) на небольшой когорте.
3. **Отсутствие «линии на песке» (Line in the Sand)**
   * *Ошибка:* Проведение экспериментов без предварительно зафиксированного критерия успеха.
   * *Как избежать:* До начала теста пропишите точную цифру (например, «конверсия в покупку должна превысить 3%»).
4. **Слепая вера в слова клиентов вместо действий**
   * *Ошибка:* Доверие вежливым ответам «Да, я бы купил».
   * *Как избежать:* Просите предзаказ, предоплату или совершение целевого действия.
5. **10 ошибок работы с данными от Моники Рогати:**
   * Использование неотфильтрованных/неочищенных данных.
   * Отсутствие нормализации данных.
   * Игнорирование или ошибочное включение выбросов (outliers).
   * Игнорирование фактора сезонности.
   * Отсутствие контекста при отчетах о росте (например, «рост на 100%» при переходе с 1 на 2 пользователей).
   * «Дашбордный перегруз» (data vomit) и слишком чувствительные алерты.

## 6) 20 карточек «вопрос — ответ» для повторения

1. **В:** Что такое Lean Analytics?  
   **О:** Это использование данных и метрик для непрерывной проверки гипотез, быстрого прохождения цикла «Build-Measure-Learn» и предотвращения самообмана.
2. **В:** Каковы 4 главных свойства хорошей метрики?  
   **О:** Она сравнительна, понятна, представляет собой отношение или коэффициент и меняет поведение.
3. **В:** В чём разница между Vanity и Actionable метриками?  
   **О:** Vanity metrics (метрики тщеславия) только тешат эго, а Actionable metrics (действенные) помогают принять конкретное бизнес-решение.
4. **В:** Чем отличаются опережающие (leading) метрики от запаздывающих (lagging)?  
   **О:** Опережающие прогнозируют будущее (например, число квалифицированных лидов), а запаздывающие объясняют прошлое (например, отток за квартал).
5. **В:** Что такое OMTM (One Metric That Matters)?  
   **О:** Единственная метрика, на которой полностью сфокусирована вся компания на текущей стадии развития.
6. **В:** Назовите 5 стадий Lean Analytics по порядку.  
   **О:** 1. Эмпатия (Empathy), 2. Липкость (Stickiness), 3. Виральность (Virality), 4. Выручка (Revenue), 5. Масштабирование (Scale).
7. **В:** Какова цель стадии Эмпатии?  
   **О:** Убедиться, что существует реальная, болезненная проблема у достаточно большого количества людей, и проверить готовность приняться за её решение.
8. **В:** Сколько проблемных интервью рекомендуют провести авторы на старте?  
   **О:** Не менее 15 качественных интервью.
9. **В:** Что такое когортный анализ?  
   **О:** Сравнение показателей групп пользователей, пришедших в бизнес в разные временные периоды, на протяжении их жизненного цикла.
10. **В:** Каковы 3 режима работы E-commerce по Кевину Хиллстрому?  
    **О:** Привлечение (Acquisition mode, 90-дневный повтор &lt;15%), Гибридный (15-30%) и Лояльность (Loyalty mode, &gt;30%).
11. **В:** Какое соотношение CLV к CAC считается хорошим для SaaS?  
    **О:** Пожизненная ценность клиента (CLV) должна превышать стоимость привлечения (CAC) минимум в 3–5 раз.
12. **В:** Какова формула расчета Churn Rate за период?  
    **О:** Количество ушедших клиентов за период, деленное на среднее количество клиентов в этом периоде.
13. **В:** Назовите 3 типа виральности.  
    **О:** Врожденная (Inherent), Искусственная (Artificial) и Сарафанное радио (Word-of-mouth).
14. **В:** Что такое виральный коэффициент (\\(K\\))?  
    **О:** Среднее количество новых приглашенных пользователей, которых приводит один существующий пользователь.
15. **В:** Что означает «линия на песке» (Line in the Sand)?  
    **О:** Заранее установленный целевой цифровой показатель метрики, определяющий успешность эксперимента.
16. **В:** Назовите 5 элементов «Flipbook» бизнес-модели.  
    **О:** Канал привлечения, Тактика продаж, Источник выручки, Тип продукта, Модель доставки.
17. **В:** Что такое «Magic Number» для SaaS-компании?  
    **О:** Прирост квартальной recurring выручки, деленный на расходы на продажи и маркетинг за предыдущий квартал (показатель &gt;0.75-1.0 означает устойчивость).
18. **В:** В чём суть правила «Zero Overhead Principle» в Enterprise-продуктах?  
    **О:** Ни одна функция не должна создавать дополнительной нагрузки или расходов на обучение пользователей.
19. **В:** Из чего состоит модель «Three-Threes» для стадии масштабирования?  
    **О:** 3 Стратегических предположения (board/monthly), 3 Тактических действия (exec/weekly), 3 Ежедневных эксперимента (team/daily).
20. **В:** Назовите 5 движков роста по Эрику Рису.  
    **О:** Движок удержания (Sticky engine), Виральный движок (Viral engine) и Платный движок (Paid engine).

## 7) 5 практических заданий на применение

### **Задание 1: Сформулировать OMTM и «линию на песке» для стадии Липкости**
* **Интернет-магазин одежды:**
  * *Задача:* Определить показатель удержания.
  * *Решение:* Выбрать OMTM — **«Процент покупателей, совершивших 2-ю покупку в течение 90 дней»**. Установить «линию на песке» на уровне **20%** (переход в гибридный режим).
* **B2B-продажи вентиляции:**
  * *Задача:* Определить показатель регулярного взаимодействия с инжиниринговыми бюро и застройщиками.
  * *Решение:* Выбрать OMTM — **«Процент проектировщиков, повторно закладывающих оборудование компании в проекты в течение 6 месяцев»**. Установить «линию на песке» на уровне **35%**.

---

### **Задание 2: Проведение проблемных интервью и выявление боли**
* **Интернет-магазин одежды:**
  * *Сценарий:* Провести 15 интервью с покупателями, часто возвращающими одежду из-за неподошедшего размера.
  * *Задание:* Составить скрипт без наводящих вопросов. Измерить уровень боли: пытаются ли они решить проблему сейчас (например, заказывают 3 смежных размера).
* **B2B-продажи вентиляции:**
  * *Сценарий:* Провести 15 интервью с главными инженерами проектов (ГИПами) и закупщиками.
