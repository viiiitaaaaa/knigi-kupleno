<script type="text/plain" id="src">## Подробный учебный конспект книги «Продажи напролом» (The Challenger Sale)

### 0. Полный список глав книги

* **Chapter 3: The Challenger (Part 2): Exporting the Model to the Core** — Глава 3: Чемпион (Часть 2): Масштабирование модели на основную группу сотрудников
* **Chapter 4: Teaching for Differentiation (Part 1): Why Insight Matters** — Глава 4: Обучение для дифференциации (Часть 1): Почему инсайт имеет определяющее значение

### 1. О чём книга в 3 предложениях

**На основе масштабного исследования Corporate Executive Board (CEB) среди тысяч B2B-продавцов книга доказывает, что в условиях сложных продаж решений наибольшего успеха добиваются не «Строители отношений» (Relationship Builders), а «Чемпионы» (Challengers), бросающие вызов привычному мышлению клиента. Успех Чемпионов базируется на сочетании трех ключевых навыков: обучении клиента новым коммерческим инсайтам (Teaching for Differentiation), адаптации коммуникации под ценности конкретных стейкхолдеров (Tailoring for Resonance) и уверенном принятии контроля над процессом и обсуждением цены (Taking Control of the Sale). Для системного масштабирования этой модели организация должна сформировать централизованную систему создания коммерческих инсайтов в маркетинге и перестроить роль линейных менеджеров продаж от администрирования к индивидуальному коучингу и инновациям на уровне сделок (Sales Innovation).**

### 2. Главные идеи по главам

#### Глава 1: Эволюция продаж решений (The Evolving Journey of Solution Selling)

* **Смена парадигмы:** Переход от транзакционных продаж отдельных продуктов к сложным бандлам и «продажам решений» (Solution Selling) был вызван стремлением избежать коммодитизации и сохранить маржинальность.
* **Усталость от решений (Solutions Fatigue):** Попытки продавцов подробно исследовать потребности («Что не дает вам спать по ночам?») перегружают клиента процедурами и рисками.
* **Четыре тренда покупательского поведения:** Рост коллегиальных закупок на основе консенсуса (Consensus-Based Sale), обострение боязни риска (Risk Aversion), требование кастомизации без увеличения цены и вмешательство сторонних консультантов.
* **Рост разрыва в продуктивности:** В транзакционных продажах звезда превосходит среднего продавца на 59%, а в сложных продажах решений — почти на 200% (по книге: разрыв в 4 раза), создавая опасную ключевую зависимость от звёзд.

#### Глава 2: Чемпион (Часть 1): Новая модель высокой эффективности (The Challenger [Part 1]: A New Model for High Performance)

* **Пять профилей продавцов:** Факторный анализ 44 поведенческих характеристик выявил 5 статистических типов: Работяга (Hard Worker), Чемпион (Challenger — 27% всех продавцов), Строитель отношений (Relationship Builder), Одинокий волк (Lone Wolf) и Решатель проблем (Reactive Problem Solver); доли остальных типов в тексте книги не найдены (NotebookLM указал 21/21/18/14 %, судя по рисунку).
* **Победитель и проигравший:** Чемпионы составляют почти 40% всех высокоэффективных продавцов (в сложных продажах — более 50%), тогда как Строители отношений составляют лишь 7% среди звёзд.
* **Провал «Строителей отношений»:** Стремление сгладить напряжение, быть удобным и приятным не помогает клиенту продвигаться к бизнес-целям в сложных условиях.
* **Три столпа Чемпиона:** Эффективность Чемпиона строится на трех навыках: Обучать (Teach for Differentiation), Адаптировать (Tailor for Resonance) и Брать контроль (Take Control of the Sale), использующих конструктивное напряжение (Constructive Tension).

#### Глава 3: Чемпион (Часть 2): Масштабирование модели на основную группу сотрудников (The Challenger [Part 2]: Exporting the Model to the Core)

* **Чемпионами становятся (Challengers Are Made):** У большинства продавцов есть задатки Чемпиона; при наличии системных инструментов и коучинга среднюю группу (Core Performers) можно научить поведению Чемпионов.
* **Синергия навыков:** Обучение без адаптации выглядит нерелевантным, адаптация без обучения — обыденным предложением, а контроль без ценности — назойливостью.
* **Организационная способность (Organizational Capability):** Создание коммерческих инсайтов — задача маркетинга и аналитики, а не личная обязанность отдельного торгового представителя.
* **Трансформация как операционная система:** Переход на модель Чемпионов — это смена операционной системы всей коммерческой организации, занимающая годы.

#### Глава 4: Обучение для дифференциации (Часть 1): Почему инсайт имеет определяющее значение (Teaching for Differentiation [Part 1]: Why Insight Matters)

* **Падение эффективности традиционной диагностики:** Предположение о том, что клиенты сами знают свои потребности и ждут лишь хороших вопросов, ошибочно — клиентам нужен тот, кто покажет им невидимые проблемы.
* **53% лояльности зависит от опыта продаж:** Более половины лояльности клиентов B2B формируется во время самого разговора с продавцом (Sales Experience), а не благодаря бренду, качеству продукта или соотношению цена/качество.
* **Ценность свежего взгляда:** Клиенты ищут поставщиков, которые дают уникальную перспективу на рынок, помогают избежать «подводных мин» и обучают новым путям оптимизации.
* **Правила коммерческого обучения (Commercial Teaching):** Инсайт должен: 1) вести к уникальным преимуществам компании (Lead to Unique Strengths), 2) ломать гипотезы клиента (Challenge Assumptions), 3) побуждать к действию (Catalyze Action) и 4) масштабироваться по сегментам.

#### Глава 5: Обучение для дифференциации (Часть 2): Как выстраивать диалог на основе инсайтов (Teaching for Differentiation [Part 2]: How to Build Insight-Led Conversations)

* **Шесть шагов хореографии презентации (Choreography):**
  1. Потепление (Warmer) — демонстрация понимания мира клиента;
  2. Рефрейминг (Reframe) — неожиданный взгляд на незамеченную проблему;
  3. Рациональное погружение (Rational Drowning) — расчет стоимости бездействия;
  4. Эмоциональный эффект (Emotional Impact) — персонализация боли через историю;
  5. Новый путь (A New Way) — согласование критериев решения;
  6. Ваше решение (Your Solution) — позиционирование своего продукта.
* **Правило «Lead To», а не «Lead With»:** Продукт и дифференциаторы компании презентуются только на заключительном 6-м этапе как естественное решение ранее доказанной проблемы.
* **Фреймворк SAFE-BOLD:** Оценка презентаций на масштаб (Big), результативность (Outperforming), передовой характер (Leading-Edge) и сложность (Difficult) защищает сообщения от размывания.
* **Практика кейсов (Grainger и ADP):** Перевод фокуса с продажи товара (например, $17 молотков) на устранение скрытых процессных издержек ($117 за незапланированную закупку) кардинально меняет восприятие поставщика.

#### Глава 6: Адаптация предложения для резонанса (Tailoring for Resonance)

* **Главный драйвер лояльности ЛПР:** Для лиц, принимающих решения (Decision Makers), ключевым фактором выбор поставщика является наличие широкой поддержки этого решения среди его команды (Widespread Support).
* **Новая физика продаж (New Physics of Sales):** Продавец должен действовать опосредованно через стейкхолдеров и рядовых сотрудников (End Users/Influencers), вооружая их инсайтами для внутренней адвокации.
* **Слои адаптации (Layers of Tailoring):** Настройка сообщения последовательно проходит через уровень Отрасли (Industry), Компании (Company), Роли (Role) и Личности (Individual).
* **Карточки функциональных склонностей (Functional Bias Cards):** Инструменты, документирующие личные водители ценности, метрики и опасения конкретных ролей (например, директора по производству или маркетингу).

#### Глава 7: Взятие контроля над продажей (Taking Control of the Sale)

* **Суть взятия контроля:** Уверенное отстаивание ценности, готовность обсуждать деньги и способность продвигать сделку вперед без агрессии.
* **Развенчание 3 мифов:** Контроль — это не только переговоры в конце (он начинается с первых минут); контроль касается не только денег, но и идей; контроль — это настойчивость (assertiveness), а не агрессия.
* **Ранняя квалификация и квалифицированный отказ:** Чемпионы отсекают ложные тендеры (RFP), запрашивая доступ к топ-менеджменту в обмен на продолжение диалога.
* **Четырехэтапная модель переговоров DuPont:**
  1. Подтвердить и отложить (Acknowledge and Defer);
  2. Углубить и расширить (Deepen and Broaden);
  3. Исследовать и сравнить (Explore and Compare);
  4. Уступать по плану (Concede According to Plan).

#### Глава 8: Менеджер и модель продаж Чемпионов (The Manager and the Challenger Selling Model)

* **Менеджер как ключевое звено:** Успех трансформации на более 45% (по книге; точные 73,4 % в тексте не найдены) зависит от сбытовых и управленческих компетенций линейного руководителя.
* **Структура сбытовой эффективности менеджера:** Продажи (Selling), Коучинг (Coaching — 28%), Владение бизнесом (Owning — более 45%); точные доли 26,6 / 28,0 / 45,4 в тексте книги не найдены (возможно, на рисунке).
* **Сила коучинга:** Переход от слабого коучинга к сильному дает прирост производительности средних продавцов (Core) до 19%.
* **Фреймворк PAUSE:** Подготовка (Preparation), Подтверждение отношений (Affirm), Понимание поведения (Understand), Спецификация изменений (Specify), Внедрение (Embed).
* **Инновации в продажах (Sales Innovation — 29%):** Способность менеджера совместно с продавцом исследовать препятствия (Investigate), создавать решения (Create) и распространять опыт (Share) для продвижения застрявших сделок.

#### Глава 9: Уроки внедрения от первых компаний-последователей (Implementation Lessons from the Early Adopters)

* **Правило 80% внедрения:** Не пытайтесь сломать успешных высокоэффективных продавцов других профилей; нацеливайтесь на 80% охвата.
* **Готовность к ротации:** При переходе на модель Чемпионов компания может потерять от 20% до 30% торгового персонала, не готового к новым стандартам.
* **Отказ от маркетологизмов (Buzzwords):** Исключите из коммуникаций заезженные слова («лидер», «инновационный», «уникальное решение»), которые обезличивают компанию.
* **Применимость за пределами продаж:** Принципы Чемпионов (отказ от роли «исполнителя заказов» в пользу передачи инсайтов) успешно работают во внутренних функциях: IT, HR, юриспруденции, закупках и R&amp;D.

### 4. Пошаговый чек-лист практических действий

1. **[ ] Формулирование «Вопроса Деб Олер» (Deb Oler Question):** Собрать коммерческое руководство и четко ответить на вопрос: *«Почему клиенты должны купить именно у нас, а не у любого из наших конкурентов?»*.
2. **[ ] Инвентаризация маркетинговых материалов:** Провести аудит всех презентаций и очистить их от заезженных слов-штампов (leading, innovative, solution) и слайдов «о себе/нашей истории» в начале.
3. **[ ] Создание Генератора коммерческих инсайтов в маркетинге:** Поручить отделу маркетинга разработку бандлов коммерческих инсайтов, сфокусированных на скрытых издержках или упущенной выгоде клиентов.
4. **[ ] Сборка 6-шаговых скриптов/презентаций (Commercial Teaching Choreography):** Упаковать инсайты строго по структуре: *Warmer *→* Reframe *→* Rational Drowning *→* Emotional Impact *→* A New Way *→* Your Solution* (соблюдая правило *Lead To*, а не *Lead With*).
5. **[ ] Оценка инсайтов по фреймворку SAFE-BOLD:** Проверить разработанные гипотезы на масштаб (Big), результативность (Outperforming), инновационность (Leading-Edge) и сложность (Difficult).
6. **[ ] Создание инструментов адаптации по ролям (Functional Bias Cards):** Разработать карты для ключевых ролей в закупках клиентов (CEO, CFO, директор по производству, IT-директор) с фиксацией их метрик, опасений и языковых формулировок.
7. **[ ] Обучение продавцов ранней квалификации и отсечению ложных RFP:** Внедрить обязательный стандарт требовать встречу с ключевыми стейкхолдерами и ЛПР в обмен на подготовку детальных КП и аудит.
8. **[ ] Внедрение 4-этапного регламента переговоров DuPont:** Обучить команду технике *Acknowledge &amp; Defer*, расширению предмета торга и уступкам строго по заранее ранжированному плану.
9. **[ ] Перестройка системы коучинга менеджеров по системе PAUSE:** Внедрить регулярный процесс коучинга (Preparation, Affirm, Understand, Specify, Embed), сфокусированный на конкретных наблюдениях за поведением, а не на проверке отчетов.
10. **[ ] Запуск сессий инноваций в продажах (Sales Innovation Sessions):** Проводить регулярные разборы «застрявших» сделок между менеджерами и продавцами с использованием фреймворка SCAMMPERR и преодолением ментальных ловушек.
11. **[ ] Обновление профиля найма (Challenger Hiring Guide):** Перестроить собеседования с использования стандартных вопросов на проверку способности аргументированно обучать, адаптировать и вести диалог в условиях напряжения.

### 5. Типичные ошибки и как их избежать

* **Ошибка 1: Ставка на «Строителей отношений» (Relationship Builders).**
  * *Почему возникает:* Желание нравиться клиенту и избегать конфликтов.
  * *Как избежать:* Переориентировать продавцов с оказания бесплатных услуг и компромиссов на создание бизнес-ценности и конструктивное оспаривание позиций клиента.
* **Ошибка 2: Начинать презентацию с рассказа о своей компании и продукте (Lead With).**
  * *Почему возникает:* Традиционная привычка хвастаться дипломами, логотипами клиентов и продуктовыми фичами.
  * *Как избежать:* Использовать подход *Lead To* — говорить первые две трети встречи исключительно о бизнесе, издержках и проблемах клиента.
* **Ошибка 3: Проведение «бесплатного консалтинга».**
  * *Почему возникает:* Продавец дает клиенту отличный инсайт, но не связывает его со своими уникальными возможностями, после чего клиент уходит к более дешевому конкуренту.
  * *Как избежать:* Строго следовать Правилу №1 Коммерческого обучения: любой инсайт обязан логически приводить к уникальному преимуществу вашей компании.
* **Ошибка 4: Перекладывание задачи поиска инсайтов на самого продавца.**
  * *Почему возникает:* Попытка заставить линейных сотрудников работать как независимые консультанты.
  * *Как избежать:* Сделать генерацию инсайтов централизованной функцией маркетинга и продуктовой аналитики.
* **Ошибка 5: Смешение настойчивости (Assertiveness) и агрессии (Aggressiveness).**
  * *Почему возникает:* Страх руководства, что продавцы начнут хамски вести себя с клиентами.
  * *Как избежать:* Обучать дипломатичной настойчивости: уважительному удержанию позиций, аргументации через факты и получению разрешения на откладывание спорных вопросов.
* **Ошибка 6: Проведение «Spreadsheet Coaching» вместо настоящего коучинга.**
  * *Почему возникает:* Менеджеры проверяют воронку и требуемые статусы вместо разбора поведения продавца на встречах.
  * *Как избежать:* Внедрить коучинговые гайды, привязанные к этапам продаж, и оценивать конкретные действия продавца во время контакта с клиентом.
* **Ошибка 7: Навязывание изменений 100% высокоэффективных сотрудников.**
  * *Почему возникает:* Желание унифицировать абсолютно всех продавцов.
  * *Как избежать:* Не трогать действующих «звезд» других профилей (например, Одиноких волков), выполняющих план; нацеливаться на 80% охвата и работу со средней группой.

### 6. 20 карточек «вопрос — ответ» для повторения

1. **Вопрос:** Каковы 5 профилей B2B-продавцов по исследованию CEB?

  * **Ответ:** Чемпион (Challenger) — составляет почти 40% всех высокоэффективных продавцов и более 50% звезд в сложных продажах.
3. **Вопрос:** Почему профиль «Строитель отношений» наименее эффективен среди высокоэффективных сотрудников (всего 7% звезд)?
  * **Ответ:** По причине стремления сглаживать напряжение и фокуса на удобстве клиента вместо создания конструктивного напряжения и предложения новых идей.
4. **Вопрос:** На сколько процентов звезда превосходит среднего продавца в сложных продажах решений?
  * **Ответ:** Почти на 200% (в сравнении с 59% в простых транзакционных продажах).
5. **Вопрос:** Какой фактор формирует 53% лояльности B2B-покупателей?
  * **Ответ:** Опыт взаимодействия в процессе продажи (Sales Experience) — то, *как* именно продавец ведет диалог и чему обучает клиента.
6. **Вопрос:** В чем фундаментальное различие между продажами «Lead With» и «Lead To»?
  * **Ответ:** При *Lead With* презентация начинается с преимуществ поставщика; при *Lead To* сначала доказывается наличие скрытой проблемы у клиента, которая затем логически решается уникальными возможностями поставщика.
7. **Вопрос:** Каковы 4 правила Коммерческого обучения (Commercial Teaching)?
  * **Ответ:** 1) Вести к уникальным преимуществам; 2) Ломать гипотезы клиента; 3) Побуждать к действию (ROI от бездействия); 4) Масштабироваться по сегментам.
8. **Вопрос:** Назовите 6 шагов хореографии коммерческой презентации.
  * **Ответ:** 1. Warmer (Потепление); 2. Reframe (Рефрейминг); 3. Rational Drowning (Рациональное погружение); 4. Emotional Impact (Эмоциональный эффект); 5. A New Way (Новый путь); 6. Your Solution (Ваше решение).
9. **Вопрос:** Что такое «Вопрос Деб Олер» (Deb Oler Question)?
  * **Ответ:** *«Почему наши клиенты должны купить именно у нас, а не у любого из наших конкурентов?»*.
10. **Вопрос:** Что является самым главным фактором лояльности для лиц, принимающих решения (Decision Makers)?
  * **Ответ:** Наличие широкой поддержки поставщика среди сотрудников внутри организации клиента (Widespread Support).
11. **Вопрос:** Каковы 4 слоя адаптации сообщения (Layers of Tailoring)?
  * **Ответ:** Отрасль (Industry) → Компания (Company) → Роль (Role) → Личность (Individual).
12. **Вопрос:** В чем разница между настойчивостью (Assertiveness) и агрессией (Aggressiveness)?
  * **Ответ:** Настойчивость — это конструктивное отстаивание целей и границ с уважением к клиенту; агрессия — навязывание целей через атаку и жесткую терминологию.
13. **Вопрос:** Как Чемпион поступает при получении запроса на RFP от низкоуровневого сотрудника?
  * **Ответ:** Требует предоставить прямой доступ к ключевым ЛПР в обмен на инвестиции времени в подготовку предложения.
14. **Вопрос:** Назовите 4 шага работы с возражениями по методике DuPont.
  * **Ответ:** 1. Acknowledge and Defer; 2. Deepen and Broaden; 3. Explore and Compare; 4. Concede According to Plan.
15. **Вопрос:** Каковы 3 основные составляющие сбытовой эффективности менеджера продаж?
  * **Ответ:** Продажи (Selling), Коучинг (Coaching — 28%) и Владение бизнесом (Owning — более 45%); точные доли в тексте не найдены.

  * **Ответ:** Preparation (Подготовка), Affirm (Подтверждение отношений), Understand (Понимание поведения), Specify (Спецификация изменений), Embed (Внедрение).

  * **Ответ:** Способность руководителя совместными усилиями с продавцом находить нестандартные пути продвижения «застрявших» сделок на уровне конкретного клиента.

### 7. 5 практических заданий на применение

#### Задание 1: Разработка Commercial Teaching Pitch (для B2B-лидогенерации)

* **Контекст:** Агентство занимается B2B-лидогенерацией через холодный Outbound (email/LinkedIn) для IT-компаний. Клиенты привыкли требовать «оплату только за встречу/CPL» и сравнивать агентства по стоимости лида.
* **Задача:** Спроектировать 6-шаговый Commercial Teaching Pitch строго по методике книги.
  1. *Warmer:* Показать знание текущих проблем IT-компаний в 2026 году — падение конверсии классического аутрича, выгорание баз, рост спам-фильтров.
  2. *Reframe:* Доказать, что покупка дешевых лидов (CPL) заставляет агентства спамить по нерелевантной базе, что портит доменную репутацию клиента и сжигает его LTV.
  3. *Rational Drowning:* Привести цифры: сжигание 1000 целевых аккаунтов из-за низкого качества контактов стоит компании $50,000 упущенной выгоды, что в 10 раз превышает экономию на дешевых лидах.
  4. *Emotional Impact:* Рассказать историю о том, как отдел продаж клиента сидит на бесполезных созвонах с несоответствующими лидами, пока конкуренты забирают ключевых клиентов.
  5. *A New Way:* Сформировать новые критерии: оценка лидогенерации должна строиться не по количеству созвонов, а по метрике *Account Engagement Rate* и качеству обогащения данных.
  6. *Your Solution:* Продемонстрировать, как собственная методика глубокого кастомного обогащения и валидации аккаунтов гарантирует сохранение репутации и высокое качество встреч.

#### Задание 2: Определение дифференциатора и «Вопроса Деб Олер» (для сервиса сборщиков данных на Claude/Python)

* **Контекст:** Команда разрабатывает Python-скрипты и LLM-агенты на базе Claude для автоматического сбора и обработки данных с сайтов конкурентов, маркетплейсов и реестров.
* **Задача:**
  1. Ответить на «Вопрос Деб Олер»: *«Почему клиент должен заказать разработку сборщиков данных у нас, а не у фрилансеров на Upwork или дешевых SaaS-парсеров?»*.
  2. Сформулировать уникальное преимущество: Простые парсеры ломаются при изменении верстки и верстки с зашифрованным JS, а дешевые фрилансеры не умеют обрабатывать неструктурированные тексты. Наше уникальное преимущество — использование Claude для динамической адаптации селекторов и семантической очистки данных в реальном времени.
  3. Сформулировать коммерческий инсайт для клиента: *«90% компаний, использующих стандартные парсеры, теряют до 30% скрытых изменений в ценах конкурентов из-за тихого сбоя верстки, о котором скрипт не сообщает»*.

#### Задание 3: Карта функциональных склонностей (для B2B-продаж опта в интернет-магазин одежды)

* **Контекст:** B2B-поставщик одежды продает крупные партии брендам и розничным интернет-магазинам.
* **Задача:** Составить карточку *Functional Bias Card* для должности **Директора по закупкам / Категорийного менеджера** интернет-магазина одежды:
  * *Главные бизнес-результаты (Desired Outcomes):* Снижение процента неликвидных остатков (Deadstock), увеличение оборачиваемости товарного запаса (Inventory Turnover), сохранение маржинальности (Gross Margin).
  * *Ежедневные опасения (Concerns):* Зависание коллекции на складе после окончания сезона, задержки поставок в пиковые даты, кассовые разрывы.
  * *Язык и рычаги ценности (Potential Values):* Переход на модель сплит-поставок (Quick Response Manufacturing), гарантированный выкуп 10% неликвида, авто-пополнение ходовых размеров на основе аналитики продаж.

#### Задание 4: Переговоры по модели DuPont и управление консенсусом (для B2B-лидогенерации)

* **Контекст:** Заказчик B2B-лидогенерации требует скидку 30% на ежемесячный ретейнер, угрожая уйти к конкуренту.
* **Задача:** Применить 4-этапный алгоритм DuPont:
  1. *Acknowledge and Defer:* «Я понимаю, что вопрос стоимости критически важен. Давайте сначала убедимся, что мы заложили все необходимые каналы обогащения данных для достижения вашей цели по выручке, а затем вернемся к бюджету. Хорошо?».
  2. *Deepen and Broaden:* Расспросить клиента о деталях: «Какую конверсию из встречи в сделку показывает ваш отдел продаж? Что произойдет, если мы снизим объем предварительной верификации контактов для уменьшения цены?».
  3. *Explore and Compare:* Показать альтернативы trade-off: «Мы можем снизить ретейнер на 20%, если сократим сегмент анализа с 5 отраслей до 2 и переложим первичный квалификационный звонок на вашу сторону».
  4. *Concede According to Plan:* Уступать строго по плану: дать небольшую уступку в условиях оплаты (например, разбивка платежа на 2 части) вместо прямого снижения стоимости услуг.

#### Задание 5: Применение SCAMMPERR для выхода из ценового тупика (для подписки на данные/парсеры на Claude/Python)

* **Контекст:** Клиент заявляет, что подписка на готовые датасеты и сборщики данных на Python/Claude слишком дорога для его бизнеса.
* **Задача:** Провести сессию инноваций с менеджером с помощью фреймворка SCAMMPERR для переупаковки сделки без снижения цены:
  * **S (Substitute):** Заменить передачу сырых данных через API на еженедельный аналитический дайджест, сгенерированный Claude, что снизит нагрузку на серверы.
  * **C (Combine):** Объединить подписку на парсинг цен с готовым модулем авто-уведомлений в Telegram для менеджеров по продажам.
  * **E (Eliminate):** Исключить из пакета регулярный парсинг тяжелогрузимых медиа-файлов/изображений, оставь только текстово-числовые атрибуты, снизив себестоимость.
