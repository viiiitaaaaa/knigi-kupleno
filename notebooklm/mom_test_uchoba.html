<script type="text/plain" id="src"># Учебный конспект по книге Роба Фитцпатрика «Спроси маму: Как общаться с клиентами и подтвердить правоту своей бизнес-идеи, если все кругом врут» (The Mom Test)

---

## 1. О чём книга в 3 предложениях

1. Книга описывает практическую методику проведения проблемных интервью с клиентами, которая позволяет проверять бизнес-идеи без получения ложных положительных сигналов и вежливой похвалы.
2. Главный принцип «Теста мамы» заключается в том, чтобы спрашивать людей исключительно об их реальной жизни, текущих привычках и прошлом опыте, а не о вашей идее или их гипотетических действиях в будущем.
3. Руководство учит сдвигать фокус с презентации продукта на сбор объективных фактов и получение конкретных обязательств (времени, репутации или денег), что помогает строить действительно востребованные бизнесы.

---

## 2. Главные идеи по главам

### Глава 1. Тест мамы (The Mom Test)
* **Идея:** Спрашивать кого-либо (даже собственную маму) напрямую, хороша ли ваша идея — бесполезно, так как люди склонны лгать из вежливости или стремления поддержать вас.
* **Правило:**
  1. Говорите об их жизни, а не о своей идее.
  2. Спрашивайте о конкретных ситуациях в прошлом, а не о взглядах на будущее.
  3. Меньше говорите, больше слушайте.
* **Пример из книги:** Вместо гипотетического вопроса «Купила бы ты приложение-кулинарную книгу для iPad за \$40?» сын спрашивает «Какую последнюю кулинарную книгу ты купила сама?». Выясняется, что мама купила веганскую книгу 3 месяца назад для мужа, а обычные сборники рецептов ей не нужны.

### Глава 2. Избегание плохих данных (Avoiding bad data)
* **Идея:** Плохие данные (комплименты, гипотетические обещания и списки фич от клиентов) создают ложную уверенность (false positives) и ведут к гибели стартапа.
* **Правило:** Отклоняйте комплименты, заземляйте гипотетическую болтовню («когда это происходило в последний раз?») и раскапывайте истинные мотивы, стоящие за идеями и запросами клиентов.
* **Пример из книги:** Клиенты из MTV просили добавить брендирование и аналитику в панель управления. Раскопав причину, автор выяснил, что им не нужна была сама аналитика — им нужен был простой еженедельный PDF-отчёт с логотипом, чтобы отправлять его своим заказчикам.

### Глава 3. Вопросы о важном (Asking important questions)
* **Идея:** Из-за страха услышать плохие новости основатели часто задают мелкие вопросы и избегают главных, от которых зависит выживание бизнеса.
* **Правило:** В каждом разговоре должен присутствовать хотя бы один пугающий вопрос, способный полностью опровергнуть вашу текущую бизнес-модель; не фокусируйтесь на деталях проблемы, пока не убедились, что она входит в топ приоритетов клиента.
* **Пример из книги:** Основатель спрашивает человека, почему тот не ходит в спортзал. Тот отвечает «нет времени», и основатель решает строить приложение для тренировок дома, не осознавая, что фитнес вообще не является приоритетом для собеседника.

### Глава 4. Сохранение неформальности (Keeping it casual)
* **Идея:** Формальные встречи («интервью») создают барьеры, отнимают время и заставляют клиентов оценивать вашу идею вместо рассказа о своей жизни.
* **Правило:** Снижайте уровень формальности: проводите быстрые 5–15 минутные разговоры на мероприятиях или в повседневных ситуациях, не упоминая о том, что вы создаёте стартап.
* **Пример из книги:** Автор на профильном мероприятии пообщался с управляющими офисами за бокалом пива и за 5 минут без всяких формальных встреч узнал, что их главная боль — не эффективный тайм-менеджмент, а сбор задолженностей.

### Глава 5. Обязательства и продвижение (Commitment and advancement)
* **Идея:** Единственная метрика успешности встречи, где демонстрируется продукт — продвижение клиента на следующий шаг воронки и получение от него ресурсов.
* **Правило:** Встреча прошла впустую, если она закончилась просто комплиментом без четких следующих шагов и передачи ценных ресурсов (времени, репутации, денег).
* **Пример из книги:** Разработчик штатива для смартфона напечатал 3D-прототип. Проверяя интерес, он продал сам 3D-прототип несколько раз прямо из рук в руки — это высшая форма валидации.

### Глава 6. Поиск собеседников (Finding conversations)
* **Идея:** Не нужно делать холодные звонки бесконечно — их цель найти первые 1–2 контакта и превратить их в поток тёплых представлений.
* **Правило:** Используйте 5-элементную формулу фрейминга встречи: Видение / Фрейминг / Слабость / Педестал / Просьба (VFWPA).
* **Пример из книги:** Письмо эксперту: «Мы пытаемся сделать рекламу эффективнее (Vision). Мы в самом начале и ничего не продаём (Framing). Нам сложно понять, как устроена индустрия изнутри (Weakness). Вы знаете её лучше всех (Pedestal). Выделите 15 минут на кофе? (Ask)».

### Глава 7. Выбор клиентов (Choosing your customers)
* **Идея:** Слишком широкая сегментация («наш клиент — все студенты») приводит к противоречивым сигналам и параличу продукта.
* **Правило:** Хороший сегмент — это пара «Кто + Где» (Who + Where); нарезайте аудиторию (Customer Slicing) до тех пор, пока не поймёте, где конкретно находятся эти люди.
* **Пример из книги:** Вместо сегмента «люди, боющиеся публичных выступлений», автор сузил группу до «людей, которые активно пытаются стать лучше», и пошёл на встречи клуба Toastmasters, где сразу нашел идеальную целевую аудиторию.

### Глава 8. Управление процессом (Running the process)
* **Идея:** Знания о клиентах не должны застревать в голове одного человека; ими нужно делиться со всей командой до и после встреч.
* **Правило:** Составляйте список из 3 главных вопросов перед встречами, фиксируйте дословные цитаты с символами эмоций и болей, разбирайте заметки всей командой.
* **Пример из книги:** Использование бумажных карточек (index cards) с пиктограммами (молния = боль, \$ = бюджет, цель = задача): после встреч карточки раскладываются на столе и сортируются вместе с сооснователями.

## 3. Схема связей (Mermaid graph TD)

```mermaid
graph TD
    A[Подготовка: 3 главных вопроса и сегмент &#x27;Кто+Где&#x27;] --&gt; B[Разговор с клиентом: &#x27;Тест Мамы&#x27;]
    B --&gt; C{Тип полученных данных}
    C --&gt;|Комплименты и похвала| D[Плохие данные: Отклонить и перевести на факты]
    C --&gt;|Гипотезы и обещания| E[Плохие данные: Заякорить на прошлый опыт]
    C --&gt;|Запросы фич и идеи| F[Плохие данные: Раскопать истинную мотивацию]
    C --&gt;|Факты о прошлых действиях и трат| G[Хорошие данные: Оценка проблемы и бюджета]
    D --&gt; B
    E --&gt; B
    F --&gt; B
    G --&gt; H[Презентация решения / Продукта]
    H --&gt; I{Результат встречи}
    I --&gt;|Вежливый отказ / Зомби-лид| J[Провал: Нет продвижения]
    I --&gt;|Получение обязательств: Время, Репутация, Деньги| K[Успех: Продвижение по воронке]
    K --&gt; L[Фиксация заметок цитатами и символами]
    J --&gt; B
    L --&gt; M[Разбор с командой и обновление 3 вопросов]
```

## 4. Пошаговый практический чек-лист

### Шаг 1. Подготовка (До встречи)
- [ ] Сформулируйте узкий сегмент клиентов в формате пары **«Кто + Где»**.
- [ ] Вместе с командой определите **список из 3 самых важных (и пугающих) вопросов**, ответив на которые можно проверить жизнеспособность идеи.
- [ ] Проведите кабинетное исследование (LinkedIn, сайт компании), чтобы не задавать очевидных вопросов.
- [ ] Заранее определите, за какими конкретно **обязательствами** (следующим шагом воронки) вы идете.

### Шаг 2. Проведение разговора (В процессе)
- [ ] Сформулируйте завязку разговора без упоминания своей идеи (используйте фрейминг VFWPA).
- [ ] Держите беседу неформальной и короткой (5–15 минут).
- [ ] Спрашивайте **только о конкретных случаях в прошлом** и о том, как проблема решается сейчас.
- [ ] Если слышите комплимент — отклоните его; если слышите обещание — спросите: «Когда в последний раз вы это делали?»; если просят фичу — спросите: «Зачем она вам?».
- [ ] Записывайте **дословные цитаты** и фиксируйте эмоции (раздражение, восторг).
- [ ] В конце встречи запросите конкретное обязательство (время на тест, ввод к ЛПР, предзаказ).

### Шаг 3. Обработка результатов (После встречи)
- [ ] Сразу после встречи перенесите заметки на карточки или в общую базу.
- [ ] Проведите разбор с сооснователями: обсудите ключевые цитаты и выводы.
- [ ] Обновите свои представления о рынке и сформулируйте 3 новых главных вопроса.
- [ ] Повторяйте встречи до тех пор, пока не перестанете получать новую информацию.

## 5. Типичные ошибки и как их избежать

1. **Задавать гипотетические вопросы («Купили бы вы... ?», «Сколько бы вы заплатили... ?»)**
   * *Почему ошибка:* Люди склонны переоценивать свои будущие действия и хотят показаться вежливыми.
   * *Как избежать:* Спрашивайте о прошлом: «Как вы решали это в последний раз?», «Сколько вы потратили на решение этой проблемы за прошлый год?».

2. **Принимать комплименты за доказательство успеха**
   * *Почему ошибка:* Комплименты ничего не стоят и дают ложные положительные сигналы.
   * *Как избежать:* Отклоняйте похвалу: «Спасибо! Но я увлёкся питчингом. Подскажите, как вы справляетесь с этим сейчас?».

3. **Слепо выполнять фича-запросы клиентов**
   * *Почему ошибка:* Клиенты знают свои проблемы, но не умеют проектировать правильные решения; это ведет к раздуванию продукта.
   * *Как избежать:* Раскапывайте мотив: «Зачем вам эта функция? Что она позволит вам сделать? Как вы обходитесь без нее сейчас?».

4. **Преждевременное зумирование (Premature zoom)**
   * *Почему ошибка:* Детальное обсуждение проблемы, которая на самом деле не входит в топ-приоритеты клиента.
   * *Как избежать:* Начинайте с широких вопросов о главных задачах и болях клиента: «Какие 3 главные вещи вы пытаетесь исправить прямо сейчас?».

5. **Создание «узкого места» обучения (Learning bottleneck)**
   * *Почему ошибка:* Все знания о клиентах остаются в голове у одного человека, а команда не понимает причин смены курса.
   * *Как избежать:* Готовьте вопросы всей командой, фиксируйте дословные цитаты и проводите совместные разборы заметок.

6. **Накопление «зомби-лидов»**
   * *Почему ошибка:* Клиенты вежливо соглашаются на повторные встречи, но никогда не доходят до покупки.
   * *Как избежать:* Требуйте от клиента «валюту» обязательств: время, репутационный риск или деньги.

## 6. 20 карточек «вопрос — ответ» для повторения

1. **В: Что такое «Тест мамы»?**
   * **О:** Набор правил формулирования вопросов, при которых даже ваша мама не сможет солгать вам из любви к вам.
2. **В: Назовите 3 главных правила «Теста мамы».**
   * **О:** 1. Говорите об их жизни, а не о своей идее. 2. Спрашивайте о конкретных вещах в прошлом. 3. Меньше говорите, больше слушайте.
3. **В: Почему вопрос «Считаете ли вы эту идею хорошей?» является плохим?**
   * **О:** Он запрашивает мнение, а не факты. Мнения бесполезны; только рынок может показать ценность идеи.
4. **В: Перечислите 3 вида плохих данных.**
   * **О:** Комплименты, гипотетическая болтовня (флафф) и идеи/фича-запросы.
5. **В: Что делать, если собеседник делает вам комплимент?**
   * **О:** Отклонить комплимент и перевести разговор на факты и прошлые действия клиента.
6. **В: Как заземлить гипотетический ответ («Я бы точно этим пользовался»)?**
   * **О:** Спросить о прошлом: «Когда в последний раз с вами это происходило?» или «Как вы пытались решить это ранее?».
7. **В: Почему нельзя строить продукт строго по запросам клиентов?**
   * **О:** Клиенты хорошо знают свои проблемы, но не знают, как их правильно решать; их идеи ведут к раздуванию фич.
8. **В: Что такое «преждевременное зумирование»?**
   * **О:** Фокусировка на деталях конкретной проблемы до того, как доказано, что эта проблема вообще важна для клиента.
9. **В: В чём разница между рыночным и продуктовым риском?**
   * **О:** Рыночный риск — хотят ли люди этот продукт и будут ли платить. Продуктовый риск — сможете ли вы его создать и масштабировать.
10. **В: Сколько ключевых вопросов нужно готовить перед встречей?**
    * **О:** Список из 3 самых важных и пугающих вопросов.
11. **В: Почему неформальные короткие разговоры лучше длинных интервью?**
    * **О:** Они экономят время, снимают барьеры и не провоцируют клиента оценивать вашу идею.
12. **В: Что такое «продвижение» (advancement) в разговоре с клиентом?**
    * **О:** Переход клиента на следующий шаг вашей реальной воронки продаж.
13. **В: Назовите 3 главных «валюты» обязательств клиента.**
    * **О:** Время, репутационный риск и деньги.
14. **В: Кто такие «ранние евангелисты» (earlyvangelists)?**
    * **О:** Клиенты, у которых проблема болит настолько сильно, что они уже собрали костыльное решение и готовы платить первыми.
15. **В: Раскройте аббревиатуру формулы фрейминга встречи VFWPA.**
    * **О:** Vision (Видение), Framing (Фрейминг), Weakness (Слабость), Pedestal (Педестал), Ask (Просьба).
16. **В: Что представляет собой пара «Кто + Где» в сегментации?**
    * **О:** Определение узкой группы людей и конкретного места (онлайн или оффлайн), где их можно найти.
17. **В: Что такое «Customer Slicing»?**
    * **О:** Процесс последовательного деления широкого сегмента на узкие подгруппы по мотивациям и поведению.
18. **В: Что такое «узкое место обучения» (learning bottleneck)?**
    * **О:** Ситуация, когда знания о клиентах застревают в голове одного человека и не передаются всей команде.
19. **В: Какую информацию нужно фиксировать в заметках?**
    * **О:** Дословные цитаты, сильные эмоции, боли, текущие расходы и бюджеты.
20. **В: До каких пор следует продолжать проведение проблемных интервью?**
    * **О:** Пока вы не перестанете слышать принципиально новую информацию.

## 7. 5 практических заданий на применение

### Задание 1. Формулирование вопросов без питчинга (для интернет-магазина)
* **Контекст:** Вы хотите запустить интернет-магазин экологичной бытовой химии и товаров для дома.
* **Задание:** Составьте 3 вопроса по «Тесту мамы», чтобы узнать, готов ли клиент покупать экотовары, НЕ упоминая свой интернет-магазин.
* **Эталон ответа:**
  1. *«Расскажите, как вы в последний раз выбирали и покупали бытовую химию для дома?»* (ищем факты поведению).
  2. *«Обращали ли вы внимание на экологичность средств при последней покупке? Если да, то как именно вы проверяли состав?»* (проверяем реальные действия, а не декларации).
  3. *«С какими неудобствами вы столкнулись при поиске или доставке этих товаров?»* (оцениваем наличие боли).

### Задание 2. Раскопки мотивации за фича-запросом (для B2B-вентиляции)
* **Контекст:** Главный инженер завода при обсуждении закупки промышленной вентиляции говорит: *«Нам обязательно нужен мобильный модуль с 3D-визуализацией состояния фильтров в реальном времени»*.
* **Задание:** Сформулируйте 3 уточняющих вопроса, чтобы найти истинную мотивацию за этим запросом и не раздувать продукт понапрасну.
* **Эталон ответа:**
  1. *«Что именно вам или вашей команде позволит сделать эта 3D-визуализация?»*.
  2. *«Как вы сейчас отслеживаете износ фильтров и сколько времени это занимает у сотрудников?»*.
  3. *«Бывали ли за последний год случаи, когда несвоевременная замена фильтра привела к остановке цеха или убыткам?»* (проверяем стоимость и последствия проблемы).

### Задание 3. Запрос обязательства и проверка на «зомби-лид» (для B2B-вентиляции)
* **Контекст:** Коммерческий директор застройщика говорит вам на встрече: *«Ваша энергоэффективная система вентиляции выглядит отлично, нам всё нравится! Направьте КП, мы изучим»*.
* **Задание:** Определите ошибку в завершении встречи и предложите 2 варианта запроса конкретных обязательств (валюта времени/репутации).
* **Эталон ответа:**

  * **Вариант 2 (Время):** *«Мы можем выехать на ваш строящийся объект в четверг и провести аудит текущего проекта вентиляции вместе с вашей технической командой. Готовы выделить час на этой неделе?»*.

### Задание 4. Нарезка сегмента и пара «Кто + Где» (для интернет-магазина)
* **Контекст:** Сегмент «покупатели одежды в интернет-магазине» слишком широк и дает противоречивые сигналы.
* **Задание:** Примените подход Customer Slicing и сформируйте 2 узких сегмента в формате пары «Кто + Где».
* **Эталон ответа:**
  * **Сегмент 1:** Высокие мужчины (рост &gt;195 см), испытывающие проблемы с длиной рукавов и брюк (**Кто**) + **Где:** Специализированные Telegram-чаты и сообщества для высоких людей, форумы баскетболистов.

### Задание 5. Составление письма по формуле VFWPA (для B2B-вентиляции)
