#### 1. О чём книга в 3 предложениях

Книга представляет собой практическое руководство по нейролингвистическому программированию (Neuro-Linguistic Programming, NLP), изучающему структуру субъективного человеческого опыта и паттерны мастерства (modeling) для повышения эффективности коммуникации, обучения и личностных изменений. Авторы описывают, как люди воспринимают мир через органы чувств и языковые фильтры, а также как использование репрезентативных систем (representational systems), субмодальностей (submodalities), якорей (anchors) и языковых моделей (Meta Model, Milton Model) позволяет управлять собственными состояниями и устанавливать раппорт (rapport) с другими. В издании раскрываются прикладные техники НЛП для постановки хорошо сформулированных целей (well-formed outcomes), разрешения внутренних и внешних конфликтов, проведения переговоров, психотерапевтической работы и моделирования мышления успешных людей.

#### 2. Главные идеи по главам

##### Глава 1. Что такое нейролингвистическое программирование? (What is Neuro-Linguistic Programming?)

* **Истоки и определение НЛП (Origins &amp; Definition)**: НЛП возникло в начале 1970-х годов в Санта-Круз благодаря сотрудничеству Ричарда Бэндлера (Richard Bandler) и Джона Гриндeра (John Grinder), смоделировавших паттерны выдающихся психотерапевтов — Фрица Перлза (Fritz Perls), Вирджинии Сатир (Virginia Satir) и Милтона Эриксона (Milton Erickson). Название объединяет неврологию (neuro), язык (linguistic) и выбор способов организации идей и действий (programming).
* **Карты и фильтры (Maps &amp; Filters)**: Карта — это не территория (The map is not the territory); мы воспринимаем мир через сенсорные и культурные фильтры, создавая уникальную модель реальности. Поведенческие рамки (behavioral frames) ориентируют на результат (outcome orientation), вопрос «как» вместо «почему» (how vs why), обратную связь вместо неудачи (feedback vs failure) и любопытство.
* **Стадии обучения и ограничения сознания (Learning Stages &amp; Conscious Limits)**: Обучение навыку проходит четыре стадии: бессознательная некомпетентность (unconscious incompetence), сознательная некомпетентность (conscious incompetence), сознательная компетентность (conscious competence) и бессознательная компетентность (unconscious competence). Объем сознательного внимания ограничен правилом Миллера «7 ± 2» единиц информации (Magic Number Seven, Plus or Minus Two).
* **Трехминутный семинар и раппорт (Three Minute Seminar &amp; Rapport)**: Успех в коммуникации требует знания цели (outcome), сенсорной чувствительности (sensory acuity) и гибкости поведения (flexibility). Раппорт (rapport) создается подстройкой и отзеркаливанием (matching and mirroring) позы, дыхания, тональности и словаря собеседника с последующим ведением (pacing and leading).
* **Критерии хорошо сформулированного результата (Well-Formed Outcome / POSERS)**: Цель должна быть сформулирована позитивно (Positive), быть под личным контролем (Own part), быть конкретной (Specific), подтверждаться сенсорными доказательствами (Evidence), обеспечена ресурсами (Resources), иметь подходящий размер (Size) и проходить проверку на экологичность (Ecology).

##### Глава 2. Двери восприятия (The Doors of Perception)

* **Репрезентативные системы (Representational Systems)**: Опыт кодируется во внутреннем мышлении через сенсорные модальности: визуальную (Visual, V), аудиальную (Auditory, A), кинестетическую (Kinesthetic, K), ольфакторную (Olfactory, O) и густаторную (Gustatory, G). У каждого человека формируется предпочитаемая система (preferred system) и ведущая система (lead system) для извлечения воспоминаний.
* **Предикаты (Predicates)**: Использование сенсорно-ориентированных слов (глаголов, прилагательных) отражает текущую репрезентативную систему человека. Подстройка под предикаты собеседника укрепляет раппорт, а речь перед аудиторией требует сбалансированного использования предикатов всех каналов.
* **Глазные сигналы доступа (Eye Accessing Cues)**: Движения глаз (LEM) показывают тип доступа к информации: вверх-влево — визуальное воспоминание (Vr), вверх-вправо — визуальное конструирование (Vc), по горизонтали влево — аудиальное воспоминание (Ar), по горизонтали вправо — аудиальное конструирование (Ac), вниз-вправо — кинестетика (K), вниз-влево — внутренний диалог (Aid).
* **Синестезии и перекрытие каналов (Synesthesias &amp; Overlap)**: Автоматическая связь между сенсорными каналами называется синестезией (synesthesia); методика перекрытия (overlapping) помогает переходить от доступного сенсорного канала к слаборазвитому.
* **Субмодальности (Submodalities)**: Качественные характеристики внутренних образов, звуков и ощущений (размер, яркость, цвет, громкость, расстояние, ассоциация/диссоциация) являются кодом работы мозга. Изменение субмодальностей меняет эмоциональное отношение к воспоминанию.

##### Глава 3. Физиологические состояния и эмоциональная свобода (Physiological States and Emotional Freedom)

* **Единство разума и тела (Mind-Body Unity)**: Эмоциональное состояние (state of mind) определяется совокупностью мыслей, эмоционального тона и физиологии (поза, дыхание, мышцы). Изменение физических движений и дыхания позволяет разорвать нересурсное состояние (break state).
* **Калибровка и вызов состояний (Calibration &amp; Elicitation)**: Калибровка (calibration) — умение замечать микроскопические физиологические изменения собеседника (цвет кожи, тонус губ, дыхание). Вызов состояния (elicitation) происходит через полное погружение человека в прошлый ресурсный опыт.
* **Якорение (Anchoring)**: Якорь (anchor) — стимул, связываемый с эмоциональным состоянием и вызывающий его. Устанавливается на пике переживания, должен быть уникальным, точным и легко повторяемым.
* **Цепочки и коллапс якорей (Chaining &amp; Collapsing Anchors)**: Цепочка якорей (chaining) переводит из тупикового состояния в целевое через промежуточные шаги. Коллапс якорей (collapsing) одновременно нейтрализует негативное состояние с помощью более сильного позитивного.
* **Изменение личной истории (Change Personal History)**: Техника переоценки прошлых неприятных воспоминаний путем погружения в них с ресурсами и знаниями, имеющимися в настоящем.

##### Глава 4. Петли и системы (Loops and Systems)

* **Системность коммуникации (Systemic Communication)**: Человеческие взаимоотношения представляют собой замкнутые петли обратной связи (feedback loops), где действие одного участника непрерывно меняет реакцию другого.
* **Модель TOTE (Test-Operate-Test-Exit)**: Универсальный алгоритм обучения и действия: Проверка (Test) -&gt; Операция/Ресурсы (Operate) -&gt; Повторная проверка (Test) -&gt; Выход при достижении критериев (Exit).
* **Неврологические уровни (Neurological Levels)**: Иерархическая структура Роберта Дилтса: Окружение (Environment) -&gt; Поведение (Behavior) -&gt; Способности (Capability) -&gt; Убеждения и Ценности (Beliefs &amp; Values) -&gt; Идентичность (Identity) -&gt; Духовный уровень (Spiritual). Изменения на высших уровнях неизбежно меняют нижние.
* **Тройное описание (Triple Description)**: Понимание реальности требует перемещения между тремя перцептивными позициями: 1-я позиция (собственный взгляд), 2-я позиция (эмпатия, взгляд глазами другого) и 3-я позиция (объективный наблюдатель).
* **Убеждения и рамка «как если бы» (Beliefs &amp; As-If Frame)**: Убеждения работают как самоисполняющиеся пророчества (Pygmalion / Placebo effect). Действие в рамке «как если бы» (As-If) позволяет обойти ограничивающие убеждения.

##### Глава 5. Слова и значения (Words and Meanings)

* **Глубинная и поверхностная структура (Deep &amp; Surface Structure)**: Мысли в глубинной структуре при трансформации в устную речь (поверхностная структура) подвергаются опущению (deletion), искажению (distortion) и обобщению (generalization).
* **Мета-модель: Упущения (Meta Model: Deletions)**: Восстановление информации через вопросы к неопределенным существительным (Unspecified Nouns -&gt; «Кто/что именно?»), неопределенным глаголам (Unspecified Verbs -&gt; «Как именно?»), опущениям сравнения (Comparisons -&gt; «По сравнению с чем?») и суждениям (Judgments -&gt; «Кто это утверждает?»).
* **Номинализации и модальные операторы (Nominalizations &amp; Modal Operators)**: Номинализация превращает процесс в статический предмет («уважение», «память») и распредмечивается возвратом к глаголу. Модальные операторы возможности («не могу») и необходимости («должен») исследуются вопросами «Что случится, если...?» и «Что мешает?».
* **Обобщения и искажения (Generalizations &amp; Distortions)**: Кванторы общности («все», «никогда») подвергаются сомнению контрпримерами или утрированием. Искажения включают комплексный эквивалент (Complex Equivalence), пресуппозиции (Presuppositions), причины-следствия (Cause &amp; Effect) и чтение мыслей (Mind Reading).
* **Экология применения Мета-модели**: Мета-модель служит для сбора информации и прояснения целей, но без раппорта превращается в агрессивное допрашивание («мета-мучение»).

##### Глава 6. Аптайм и даунтайм (Uptime and Downtime)

* **Состояния Аптайм и Даунтайм (Uptime &amp; Downtime)**: Аптайм — состояние полной внешней сенсорной сфокусированности; Даунтайм — погружение во внутренние образы, звуки и чувства (транс) для доступа к бессознательным ресурсам.
* **Модель Милтона (The Milton Model)**: Зеркальное отражение Мета-модели; использование искусно неопределенного языка (artfully vague language) для присоединения и ведения, отвлечения сознания и доступа к бессознательному.
* **Косвенные внушения и встроенные команды (Embedded Commands)**: Сознательный разум левого полушария загружается неопределенностями, пока правое полушарие воспринимает встроенные команды (embedded commands), выделенные тоном или жестом.
* **Метафоры (Metaphors)**: Истории и сказки переносят структуру отношений из проблемной ситуации в метафорическую (изоморфизм), позволяя бессознательному найти решение.
* **Рефрейминг и Линии времени (Reframing &amp; Timelines)**: Рефрейминг контекста и содержания меняет значение опыта. Субъективное время кодируется в пространстве: «сквозь время» (Through Time, линия времени слева направо перед человеком) и «во времени» (In Time, линия времени проходит через тело).

##### Глава 7. Конфликт и конгруэнтность (Conflict and Congruence)

* **Сигналы конгруэнтности (Congruence &amp; Incongruence Signals)**: Конгруэнтность — полная согласованность вербальных и невербальных сигналов; неконгруэнтность проявляется как внутренние сомнения, сигнализирующие о неэкологичности решения.
* **Критерии и иерархия (Criteria &amp; Hierarchy of Criteria)**: Критерии — это ценности, примененные к конкретному контексту; установление иерархии критериев дает мотивацию для действий.
* **Укрупнение и Метапрограммы (Chunking &amp; Metaprograms)**: Укрупнение вверх (stepping up) идет к обобщениям и ценностям, вниз (stepping down) — к сенсорным деталям, вбок — к альтернативам. Метапрограммы — привычные фильтры восприятия: Проактивный/Реактивный, К/От (Towards/Away), Внутренняя/Внешняя референция, Опции/Процедуры, Общий/Специфичный, Совпадение/Несовпадение (Match/Mismatch).
* **Формат встреч и переговоров (Meetings &amp; Negotiation)**: Эффективные встречи требуют согласования общего результата, калибровки, применения проверки релевантности (relevancy challenge) и рамки «как если бы». Переговоры строятся на совмещении результатов (dovetailing outcomes), отделении людей от проблемы и поиске наилучшей альтернативы (BATNA).

##### Глава 8. Психотерапия (Psychotherapy)

* **Изменения первого и второго порядка (First &amp; Second Order Change)**: Изменение первого порядка относится к отдельной ситуации (рефрейминг, якорение); изменение второго порядка затрагивает вторичные выгоды (secondary gain) и требует системной перебалансировки личности.
* **Быстрое лечение фобий (The Phobia Cure / V/K Dissociation)**: Техника визуально-кинестетической диссоциации устраняет фобии путем просмотра фильма о травмирующем событии из «кинобудки» в состоянии двойной диссоциации с последующей интеграцией ресурса.
* **Паттерн Взмах (The Swish Pattern)**: Устраняет нежелательные привычки (курение, накусывание ногтей); пусковой образ (cue picture) быстро уменьшается и темнеет, уступая место контрастному диссоциированному образу желаемого «Я».
* **Шестишаговый рефрейминг (Six Step Reframing)**: Отделяет позитивное намерение части личности от нежелательного поведения и обращается к творческой части для генерации трех альтернативных экологичных способов.
* **Разрешение внутренних конфликтов (Internal Conflict Resolution)**: Выявляет конфликтующие части личности, поднимает их на уровень общего высшего намерения, проводит переговоры и интегрирует их.

##### Глава 9. Обучение как моделирование (Learning as Modeling)

* **Сущность моделирования (Core of Modeling)**: Моделирование в НЛП — процесс выявления и воспроизведения паттернов человеческого мастерства путем исследования физиологии, стратегий мышления и убеждений.
* **Фазы моделирования (Phases of Modeling)**: 1) Вхождение во вторую позицию модели для воспроизведения результатов; 2) Контрастный анализ (изъятие элементов для выявления критических факторов); 3) Разработка формата обучения навыку других.
* **Стратегии мышления (Thinking Strategies)**: Стратегия — последовательность сенсорных репрезентаций (V,A,K), приводящая к цели.
* **Примеры стратегий (Strategy Examples)**: Стратегия запоминания музыки (Ae→Ki→Vci​→Ai); стратегия правописания опирается на визуальный образ слова с кинестетической проверкой (Vi→Ki); стратегия творчества Уолта Диснея сочетает роли Мечтателя (Dreamer), Реалиста (Realist) и Критика (Critic).
* **Ускоренное обучение (Accelerated Learning)**: Обучение идет от бессознательной компетентности и интуиции к последующему анализу структуры.

#### 4. Пошаговый чек-лист практических действий

1. **Формулирование цели по POSERS**: Сформулируйте результат позитивно, убедитесь, что он контролируется вами, опишите сенсорные доказательства достижения, проверьте размер, ресурсы и проведите экологическую проверку.
2. **Калибровка и установление раппорта**: Настройте наблюдение за физиологией собеседника (дыхание, поза, тонус); выполните мягкую подстройку (matching &amp; mirroring) к его телу, голосу и предикатам.
3. **Определение сенсорных каналов**: Отслеживайте глазные сигналы доступа (eye accessing cues) и используемые предикаты, чтобы определить ведущую и предпочитаемую системы собеседника.
4. **Управление субмодальностями**: Для уменьшения негативного влияния воспоминания переведите его в диссоциированное состояние, уменьшите размер, сделайте картинку темной и отдаленной.
5. **Установка ресурсного якоря**: Вызовите в памяти пиковое состояние уверенности или спокойствия, и в момент максимальной интенсивности наложите уникальный кинестетический или аудиальный якорь.
6. **Применение Мета-модели для прояснения**: При столкновении с неопределенными утверждениями, номинализациями или ограничивающими модальными операторами задавайте уточняющие вопросы («Кто именно?», «Как именно?», «Что мешает?»).
7. **Использование рефрейминга**: При возникновении препятствий выполните рефрейминг контекста («Где это поведение полезно?») или рефрейминг содержания («Что еще это может означать?»).
8. **Разделение ролей по Стратегии Диснея**: Для разработки проекта последовательно пройдите три пространственные позиции: Мечтатель (генерация идей), Реалист (составление плана) и Критик (поиск слабых мест и рисков).
9. **Проведение будущего темпинга (Future Pacing)**: Мысленно срепетируйте применение новых ресурсов или поведенческих паттернов в будущей проблемной ситуации.
10. **Проверка экологии**: Проверьте, нет ли внутренних сомнений или неконгруэнтных сигналов («Да, но...»), сигнализирующих о протесте других частей личности.

#### 5. Типичные ошибки и как их избежать

1. **Смешение карты и территории (Confusing the Map with the Territory)**
  * *Ошибка*: Верить, что собственная модель мира является единственной объективной истиной, и навязывать свои критерии другим.
  * *Как избежать*: Помнить, что у каждого человека своя уникальная карта реальности; развивать способность переходить во 2-ю позицию (эмпатию) и 3-ю позицию (объективный наблюдатель).
2. **Использование Мета-модели без раппорта («Мета-мучение» / Meta Mayhem)**
  * *Ошибка*: Агрессивный допрос собеседника с помощью вопросов Мета-модели, что разрушает раппорт и вызывает защиту.
  * *Как избежать*: Поддерживать раппорт, смягчать вопросы тональностью и вводными фразами («Мне любопытно узнать...»), задавать только релевантные вопросы.
3. **Игнорирование проверки экологии (Ignoring Ecology)**
  * *Ошибка*: Стремление к достижению цели без учета негативных последствий для своей жизни, здоровья или окружающих систем.
  * *Как избежать*: Всегда проводить экологическую проверку (Ecology Frame) вопросом: «Что произойдет и чего не произойдет, если я получу этот результат?».
4. **Ошибки в тайминге при якорении (Improper Anchor Timing)**
  * *Ошибка*: Наложение якоря после того, как эмоциональное состояние уже прошло свой пик, что приводит к якорению спада эмоции.
  * *Как избежать*: Внимательно калибровать нарастание состояния и подключать якорь строго перед пиком переживания.
5. **Прямая критика Мечтателя в стратегии Диснея (Critiquing the Dreamer directly)**
  * *Ошибка*: Позволять Критику уничтожать Мечтателя на этапе генерации идей, что блокирует творческий процесс.
  * *Как избежать*: Пространственно разделять роли, не допускать Критика на этап мечты и направлять критику строго на *план*, а не на *личностные качества* или *мечту*.

#### 6. 20 карточек «вопрос — ответ» для повторения

1. **В**: Что означает название «Нейролингвистическое программирование»? **О**: Neuro — восприятие мира через 5 органов чувств и неврологические процессы; Linguistic — использование языка для организации мыслей; Programming — выбор способов организации идей и действий для достижения результатов.
2. **В**: Кто является основателями НЛП и кого они смоделировали? **О**: Ричард Бэндлер и Джон Гриндер; они смоделировали Фрица Перлза (гештальт-терапия), Вирджинию Сатир (семейная терапия) и Милтона Эриксона (гипнотерапия).
3. **В**: В чем суть афоризма «Карта — это не территория»? **О**: Наше внутреннее представление о мире (карта) состоит из фильтров и упрощений и не является самой объективной реальностью (территорией).
4. **В**: Назовите 4 стадии обучения навыку в НЛП. **О**: 1) Бессознательная некомпетентность; 2) Сознательная некомпетентность; 3) Сознательная компетентность; 4) Бессознательная компетентность.
5. **В**: Каковы три элемента «трехминутного семинара» НЛП? **О**: 1) Знать свой результат (Outcome); 2) Сохранять сенсорную чувствительность (Acuity); 3) Обладать гибкостью поведения (Flexibility).
6. **В**: Какое соотношение факторов влияния в презентации установил Меграбян? **О**: 55% — язык тела, 38% — тон голоса, 7% — смысл произносимых слов.
7. **В**: Что такое раппорт и как он формируется? **О**: Раппорт — состояние доверия и взаимопонимания, создаваемое подстройкой и отзеркаливанием (matching &amp; mirroring) позы, жестов, дыхания, тональности и словаря.
8. **В**: Чем подстройка (pacing) отличается от ведения (leading)? **О**: Подстройка — присоединение к текущей реальности человека; ведение — изменение собственного поведения, за которым следует собеседник благодаря установленному раппорту.
9. **В**: Что такое репрезентативные системы (VAKOG)? **О**: Внутренние сенсорные каналы кодирования и обработки информации: визуальный (V), аудиальный (A), кинестетический (K), ольфакторный (O) и густаторный (G).
10. **В**: О чем свидетельствуют глазные сигналы доступа (Eye Accessing Cues)? **О**: Направление движения глаз указывает на то, к какому сенсорному каналу (визуальному, аудиальному, кинестетическому или внутреннему диалогу) в данный момент обращается мозг.
11. **В**: Что такое субмодальности? Назовите примеры для визуального канала. **О**: Субмодальности — качественные параметры элементов репрезентативной системы. Для V: яркость, размер, цветность, расстояние, ассоциация/диссоциация, фокус.
12. **В**: В чем различие между ассоциированным и диссоциированным состоянием? **О**: В ассоциированном состоянии человек смотрит на событие изнутри своими глазами; в диссоциированном — видит себя со стороны, что снижает эмоциональную интенсивность.
13. **В**: Что такое якорь и в какой момент он устанавливается? **О**: Якорь — стимул, связанный с эмоциональным состоянием; устанавливается строго на пике интенсивности переживания ресурса.
14. **В**: Из каких этапов состоит модель TOTE? **О**: Test (проверка совпадения с целью) -&gt; Operate (применение ресурсов/действий) -&gt; Test (повторная проверка) -&gt; Exit (выход при достижении критериев).
15. **В**: Назовите три перцептивные позиции. **О**: 1-я позиция — личная точка зрения; 2-я позиция — точка зрения другого человека (эмпатия); 3-я позиция — независимый наблюдатель.
16. **В**: Перечислите 6 неврологических уровней Роберта Дилтса. **О**: Окружение -&gt; Поведение -&gt; Способности -&gt; Убеждения и Ценности -&gt; Идентичность -&gt; Духовный уровень / Миссия.
17. **В**: Какова главная цель Мета-модели языка? **О**: Восстановление информации, утерянной из-за опущений, искажений и обобщений при переходе от глубинной структуры к поверхностной устной речи.
18. **В**: Чем модель Милтона отличается от Мета-модели? **О**: Модель Милтона использует искусно неопределенный язык для погружения в транс и доступа к бессознательным ресурсам, а Мета-модель выявляет точные детали.
19. **В**: В чем разница между рефреймингом контекста и содержания? **О**: Рефрейминг контекста ищет ситуацию, где поведение полезно («Где это ресурс?»); рефрейминг содержания меняет смысл поведения («Что еще это означает?»).
20. **В**: Назовите три роли в стратегии творчества Уолта Диснея. **О**: Мечтатель (генерация идей без ограничений), Реалист (составление пошагового плана) и Критик (поиск рисков и слабых мест).

#### 7. 5 практических заданий на применение

##### Задание 1. Разработка описаний товаров для интернет-магазина одежды с использованием предикатов всех репрезентативных систем (VAK)

* **Контекст**: Интернет-магазин одежды.
* **Инструкция на основе книги**: Составьте карточку товара (например, зимнего пальто), применив правило сбалансированного использования предикатов из Главы 2.
  1. Включите **визуальные предикаты** (V): *«посмотрите на чистые линии силуэта»*, *«яркий насыщенный оттенок»*, *«привлекательный внешний вид»*.
  2. Включите **аудиальные предикаты** (A): *«тихий благородный шорох качественной ткани»*, *«звучит гармонично в любом гардеробе»*.
  3. Включите **кинестетические предикаты** (K): *«мягкая приятная текстура»*, *«ощущение уюта и тепла»*, *«плотно и комфортно сидит на фигуре»*.
* **Цель**: Обеспечить раппорт с покупателями всех трех предпочитаемых репрезентативных систем.

##### Задание 2. Настройка скрипта B2B-лидогенерации с подстройкой под метапрограммы клиентов

* **Контекст**: B2B-лидогенерация и холодные продажи.
* **Инструкция на основе книги**: Разработайте варианты коммерческих предложений с учетом метапрограмм из Главы 7.
  1. **Метапрограмма «К» (Towards) vs «От» (Away)**: Для клиентов с ориентацией «От» сформулируйте выгоды через избегание проблем (*«предотвратите кассовые разрывы и потерю клиентов»*); для клиентов с ориентацией «К» — через достижение показателей (*«увеличьте объем продаж на 30%»*).
  2. **Метапрограмма «Процедуры» (Procedures) vs «Опции» (Options)**: Для клиентов типа «Процедуры» распишите четкий пошаговый алгоритм внедрения (1→2→3); для типа «Опции» предложите выбор из нескольких гибких тарифных планов и конфигураций.

##### Задание 3. Анализ обратной связи клиентов сборщиком данных (Claude/Python) через категории Мета-модели

* **Контекст**: Сборщик данных и скрипт на Claude/Python для обработки отзывов.
* **Инструкция на основе книги**: Запрограммируйте алгоритм (или промпт) для классификации входящего текста по паттернам Мета-модели из Главы 5:
  1. Выявляйте **номинализации** (*«плохой сервис»*, *«качество»*) и генерируйте уточняющий вопрос: *«Как именно предоставлялся сервис?»*.
  2. Фиксируйте **неопределенные глаголы** (*«меня подвели»*, *«заказ испортили»*) и запрашивайте способ действия: *«Как именно подвели?»*.
  3. Отслеживайте **кванторы общности** (*«всегда задерживают»*, *«никогда не отвечают»*) для поиска контрпримеров.

##### Задание 4. Конструирование рекламного текста по Модели Милтона с пресуппозициями и встроенными командами

* **Контекст**: E-commerce / B2B-рассылка.
* **Инструкция на основе книги**: Составьте рекламный текст, используя паттерны Модели Милтона из Главы 6.
  1. Используйте **связки плавных переходов**: *«Пока вы изучаете характеристики нашего продукта, вы можете начать замечать, насколько легко он интегрируется в ваши процессы...»*.
  2. Встройте **пресуппозиции выбора**: *«Вы предпочтете оформить тестовый доступ сегодня или после консультации с экспертом?»* (пресуппозиция: тест будет оформлен).
  3. Примените **выделение встроенных команд** (italics / тон): *«Многие руководители осознают, что могут ***принять выгодное решение*** уже сейчас»*.

##### Задание 5. Архитектура скрипта автоматизации генерации кода/контента по Модели TOTE и Стратегии Диснея

* **Контекст**: Разработка агента на Claude/Python.
* **Инструкция на основе книги**: Задайте алгоритм работы агента, основанный на Стратегии Диснея из Главы 9 и цикле TOTE из Главы 4.
  1. **Шаг 1 (Мечтатель / Dreamer)**: Агент генерирует максимальное количество идей без синтаксических и логических ограничений.
  2. **Шаг 2 (Реалист / Realist / Operate)**: Модуль переводит выбранную идею в структуру пошагового кода/текста и проверяет выполнение (Test в TOTE).
  3. **Шаг 3 (Критик / Critic / Exit)**: Модуль тестирует код на ошибки, проводит проверку критериев безопасности и возвращает задачу на доработку Мечтателю/Реалисту до полного соответствия (Exit).</script>
