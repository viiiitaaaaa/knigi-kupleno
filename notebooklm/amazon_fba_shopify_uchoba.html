### 1. О чём книга в 3 предложениях

1. **Книга Марка Миллера представляет собой практическое руководства по созданию и масштабированию бизнеса в сфере электронной коммерции с использованием инфраструктуры Amazon FBA и платформы Shopify****.**
2. **Автор детально разбирает алгоритмы поисковой выдачи (Amazon A9 и Google SEO), пошаговую логистику из Китая, критерии поиска выигрышных товаров (Winning Products), методы работы с оптовыми поставщиками и оптимизацию конверсии листингов****.**
3. **Главный акцент сделан на трансформацию разовых продаж в полноценный долгосрочный бренд (Private Label), построение эффективных воронок продаж (Sales Funnels) и обеспечение комплексной безопасности онлайн-бизнеса****.**

### 2. Главные идеи по главам (по каждой главе 3–5 пунктов)

#### Часть 1. Amazon FBA

##### 1. Introduction (Введение) &amp; Chapter 1: What is Amazon FBA?

* **Суть бизнес-модели FBA (Fulfilled by Amazon):** Продавец отправляет запасы на склады Amazon, а площадка берет на себя хранение, упаковку, доставку покупателям и обслуживание клиентов.
* **Продажа НА Amazon vs Продажа Amazon:** Продажа как прямой поставщик (Supplier TO Amazon) лишает контроля над ценой, а модель &quot;Selling ON Amazon&quot; (FBA) дает высокий контроль и более высокую маржу.
* **Преимущество Prime-клиентов:** Доступ к аудитории пользователей Amazon Prime, предпочитающих удобство и бесплатную 2-дневную доставку (Free 2-day shipping) даже при более высокой цене товара.
* **Типы аккаунтов продавца:** Индивидуальный аккаунт (Individual Plan, $0.99 за продажу) подходит для объема до 40 товаров в месяц; Профессиональный (Professional Plan, $39.99/мес) открывает доступ к рекламе и метрикам.
* **Рейтинг бестселлеров (Amazon Best Seller Rank - BSR):** Обновляемый каждый час показатель, отражающий недавнюю частоту продаж товара относительно категории.

##### 2. What are Algorithms and How to Use Them?

* **Принцип алгоритма A9:** В отличие от Google, где покупателем являются рекламодатели, алгоритм Amazon A9 нацелен на подбор товаров, максимально соответствующих вкусам пользователя и приносящих максимальные продажи.
* **Факторы производительности листинга:** Скорость обработки заказов, процент наличия на складе (In-Stock Rate), процент идеальных заказов (Perfect Order Percentage) и показатель дефектов заказов (Order Defect Rate).
* **Поведенческие и визуальные метрики:** Показатель ухода со страницы (Exit Rate должен быть ниже 75%), время на странице (Time on Page), показатель отказов (Bounce Rate) и высококачественные фото от 1000×1000 px для зума.
* **Текстовая релевантность:** Алгоритм сканирует ключевые слова в Заголовке (Title), Буллитах (Bullet Points/Features), Описании (Product Description) и Спецификациях.
* **Группировка товаров:** Использование родительско-дочерних листингов (Parent-Child products) для отображения вариантов цвета и размера на одной странице повышает конверсию.

##### 3. What is the Best Market Strategy Currently?

* **Необходимость собственного брендинга:** Amazon продвигает бренд Amazon; продавцы должны создавать собственный узнаваемый бренд, чтобы выделяться и приводить собственный трафик.
* **Элементы визуальной идентификации:** Определение целевой аудитории (Target Audience), выбор цветовой палитры отрасли, разработка логотипа и создание доски настроения (Mood Board).
* **Голос бренда (Brand Voice):** Формирование индивидуального словарного запаса и тональности коммуникации.
* **Простая воронка продаж (Sales Funnel):** Сокращение пути покупателя до оформления заказа (Checkout) до 3 кликов или меньше.

##### 4. Perseverance &amp; Time is Money

* **Ментальная готовность:** Принятие неизбежности сбоев и незапланированных препятствий; планирование резервных ресурсов и финансов.
* **Конструктивная работа с негативом:** Изучение отзывов для устранения недостатков товара или работы с логистикой без защиты и агрессии.
* **Формула успеха:** Продуктивность + Ежедневное совершенствование = Доходы (Productivity+DailyImprovement=Dollars).
* **Анализ личных сильных и слабых сторон:** Использование индивидуальных преимуществ (например, пунктуальности) для управления графиком отгрузок и поставок.

##### 5. Shipping and Customs Charges

* **3 маршрута доставки из Китая:** Напрямую от фабрики на склад FBA (самый быстрый и дешевый вариант), через дом продавца (для личной проверки) или через преп-центр (Third-Party Prep Center).
* **Морской фрахт (Sea Freight):** Самый экономичный способ для крупных партий (минимум 2-3 CBM), занимающий от 30 до 40+ дней.
* **Авиафрахт (Air Freight / Express Cargo):** Экспресс-доставка за 3–7 дней; расчет стоимости ведет по объемному весу (Dimensional Weight = CBM * 167).
* **Таможенная очистка (Customs Clearance):** Использование грузовых экспедиторов (Freight Forwarders), правильное назначение кода HS (Harmonized System) и расчет пошлин.

##### 6. Panning 1000 Feet &amp; Registration on Amazon FBA

* **8-этапная дорожная карта:** Регистрация → Выбор товара → Поиск → Оптимизация листинга → Пошаговая доставка → Привлечение трафика → Отзывы → Масштабирование (Rinse and Repeat).
* **Требования к регистрации:** Юридическое название компании, телефон, банковская карта и налоговая информация (Tax Information).
* **Настройка публичного профиля:** Описание истории компании (About Seller), загрузка логотипа (120×30 px) и правил возврата (уровень политики Amazon — минимум 30 дней).
* **Формы товаров и отгрузок:** Заполнение формы нового товара (New Product Form) и планирование плана отгрузки (Shipment Plan: Individual vs Case-packed).

##### 7. 4 Ways to Get Started

* **Способ 1 (Top 100 Best Sellers):** Изучение лидеров продаж в основных категориях и глубоких подкатегориях.
* **Способ 2 (Amazon Top 2,000):** Использование поиска со знаком «*» по категориям для выхода на товары с позициями 100–2000, где ниже конкуренция.
* **Способ 3 (Junk Products до $10):** Продажа дешёвых мелочей с фокусом на гигантский объём (Quantity over quality).
* **Способ 4 (Партнерство / Partner Up):** Объединение навыков интернет-маркетинга с офлайн-производителями и продавцами на выставках (Trade Shows).

##### 8. Looking for Products

* **Объём продаж и маржинальность:** Выбор товаров с высоким стабильным спросом без доминирования монопольных брендов.
* **Ценовой диапазон для импульсивных покупок (Impulsive Buying):** Идеальный диапазон цен от $20 до $100 (оптимально до $50).
* **Нишевость и внесезонность (Non-Seasonal):** Товар должен быть уникальным (не продаваться в каждом супермаркете) и иметь круглогодичный спрос.
* **Здоровая конкуренция и надежность поставщиков:** Наличие других продавцов подтверждает спрос, а наличие 2–3 альтернативных фабрик защищает от срывов.

##### 9. List of Products (Оптимизация листинга)

* **Исследование ключевых слов (Keyword Research):** Поисковые подсказки Amazon (Search Bar), Google Keyword Planner, листинги конкурентов и привлечение SEO-специалистов.
* **Формула идеального заголовка (Product Title до 200 символов):** Главный ключ - Вторичные ключи - Характеристики/Выгоды - Продающий призыв/Гарантия.
* **5 буллитов (Bullet Points):** Выделение главных препродаваемых выгод (Benefits), спецпредложений и ключевых слов заглавными буквами.
* **Продающее описание (Product Description до 2000 символов):** Написание текста в формате продающего письма с HTML-тегами (Bold, параграфы), гарантией и призывом к действию (Call-to-Action).
* **Требования к фотографиям:** Использование всех 9 доступных слотов, главный кадр строго на чистом белом фоне без промо-текста, разрешение от 1000px для активации функции зума.

##### 10. Shipping and Custom Fees FBA Step-by-Step

* **3 шага подготовки поставки:** Подготовка товара (Prep according to matrix), наклейка этикеток (Labeling) и правильная упаковка в коробки с нападающим наполнением (Dunnage).
* **Идентификатор FNSKU:** Наклейка штрихкодов FNSKU (Fulfillment Network Stock Keeping Unit) поверх заводских UPC-кодов силами продавца, фабрики или сервиса Amazon ($0.20/шт.).
* **Маркировка коробок:** Нанесение двух штрихкодов на каждую внешнюю коробку — транспортной этикетки перевозчика (UPS Ground) и этикетки поставки FBA Shipment.
* **Авиадоставка на старте:** Для первых небольших партий предпочтительна авиадоставка товаров весом до 1.5 фунтов и размерами до 12×12 дюймов.

##### 11. Get Traffic

* **Внутренний трафик экосистемы Amazon:** Внутреннее Amazon SEO, отдание приоритета FBA-листингам перед FBM со стороны алгоритма, генерация положительных отзывов.
* **Внешний трафик (Beyond Amazon):** Оптимизация под Google SEO через контент-маркетинг на внешних ресурсах.
* **Социальные сети и медиа:** Запуск обучающих видеороликов (How-to videos) на YouTube, посты в Facebook, Pinterest, Twitter и публикация пресс-релизов (PR).
* **Контекстная реклама и нишевые сайты:** Запуск таргетированной рекламы PPC (Pay-Per-Click) в Google/Facebook и создание собственных тематических блогов.

##### 12. Importance of Reviews and How to Get Them?

* **Сила социального доказательства:** 60% покупателей ориентируются на отзывы; высокая оценка и большое количество оценок критически повышают конверсию.
* **Легальные методы получения:** Безупречный сервис, автоматические рассылки писем с просьбой оставить отзыв после доставки заказа.
* **Связь с топом обозревателей:** Поиск участников Зала славы Amazon (Hall of Fame reviewers / Top reviewers) и предложение товаров для обзора.
* **Нейтрализация негативных отзывов:** Соблюдение спокойствия, быстрое исправление ошибки, предложение компенсации или замены товара, после чего клиент может удалить отзыв.

##### 13. 18 Best Practices &amp; Private Label

* **Правило 30 минут и качество:** Ежедневный 30-минутный обзор товаров на Amazon; табу на продажу дешёвых низкокачественных товаров («Karma is a bitch»).
* **Управление ценами и скидками:** Старт в «сладком spot» цен $20–$30, регулярный запрос скидок у фабрик и выстраивание личных отношений с поставщиками.
* **Суть бренда Private Label:** Создание долгосрочных автономных активов (Assets), генерирующих пассивный доход, в отличие от разовой перепродажи (Reselling/Flipping).
* **Принцип простоты (Keep it Simple):** Выбор просты в производстве вечнозеленых (Evergreen) товаров широкого потребления.
* **Тестирование рисков:** Проверка спроса перед крупным оптовым заказом с помощью рекламы Amazon Sponsored Ads.

#### Часть 2. E-Commerce with Shopify

##### 14. Chapter 16: What is Shopify?

* **Облачная платформенная модель (SaaS):** Shopify предоставляет полностью готовую экосистему для интернет-магазина с хостингом, защитой и круглосуточной поддержкой.
* **Преимущества:** Более 100 адаптивных тем дизайна, магазин из 1200+ приложений (App Store), интеграция кассовых терминалов (Shopify POS).
* **Недостатки и ограничения:** Комиссия за транзакции (от 0.5% до 2% без Shopify Payments), платные приложения и использование языка шаблонов Liquid вместо чистого HTML/CSS.
* **Тарифные сетки:** Starter ($14/мес), Basic ($29/мес), Professional ($79/мес) и Unlimited ($179/мес).

##### 15. Chapter 17: Making Money on Shopify &amp; Chapter 18: Maximizing Profit

* **Способы монетизации:** Собственный интернет-магазин (Drop Shipping или прямые продажи), партнерская программа (Affiliate Program до $358 за реферала), сайты обзоров, создание тем и приложений.
* **SMM-контент для продаж:** Использование цитат, постов «заполни пропуск» (Fill-in-the-blanks), интерактивных опросов и закулисных фото (Behind-the-scenes).
* **Маркетинговые механики:** Ассоциативный визуальный контент, проведение фото- и видеоконкурсов, конкурсов подписей (Subtitle contests), розыгрышей (Sweepstakes) и раздача бонусов за репосты.
* **Кросс-платформенная синхронизация:** Автоматическая трансляция публикаций во все привязанные соцсети и регулярное переиспользование (recycling) удачных постов.

##### 16. Chapter 19: Shipping and Tax Rates

* **Методы расчета доставки:** Фиксированные ставки вручную (Manual Shipping Rates) против автоматического расчета тарифов перевозчиков (USPS, UPS, FedEx) по весу и габаритам.
* **Управление логистикой:** Распечатка скидочных лейблов USPS из админки Shopify, упаковка в пузырчатые конверты и отказ от «упаковочного арахиса» из экологических соображений.
* **Дропшиппинг и фулфилмент:** Интеграция сторонних складов и дропшиппинг-компаний для автоматической отгрузки заказов без участия продавца.
* **Налоговые настройки (Tax Rates):** Настройка автоматического начисления налогов (Country Tax Rate) в зависимости от юрисдикции и выгрузка отчетов.

##### 17. Chapter 20: Getting the Right Keyword Shopify &amp; Chapter 21: Shopify Backlinks

* **Поисковая оптимизация (SEO):** Создание уникального высококачественного контента («Content is King») и его проверка через сервисы проверки уникальности (CopyScape).
* **Исследование ключевых слов:** Использование Google Keyword Planner для поиска запросов с высокой частотой и низкой конкуренцией.
* **Плотность ключей:** Ограничение использования ключевого слова до 1 раза на 100–200 слов во избежание поисковых фильтров за спам.
* **Стратегия ссылочной массы (Backlinks):** Написание гостевых статей (Guest posts), распространение промокодов на скидочных купонных сайтах, полный отказ от спам-ссылок.
* **Оптимизация элементов витрины:** Прописывание ALT-тегов для изображений, уникальные описания вместо текстов производителя и размещение ссылок на товары на главной странице.

##### 18. Chapter 22: Practical Steps of Naming Your Business

* **2 стратегии наименования:** Отраслевые названия (Industry-centric: напр. USGolfTV) против инновационных вымышленных (Innovative Outsider: напр. Apple).
* **Критерии хорошего имени:** Короткое (2–5 слогов), запоминающееся, легко произносимое и отражающее суть деятельности.
* **Метод Word Crunching:** Комбинирование ключевых слов ниши с популярными префиксами и суффиксами (Guide, Hub, Report).
* **Проверка уникальности:** Проведение опросов в Facebook / PickFu, проверка товарных знаков в базе USPTO и поиск совпадений в Google.

##### 19. Chapter 23: Ways of Sourcing for Suppliers

* **Отличие реальных оптовиков от фальшивых:** Настоящие оптовики не требуют ежемесячных абонентских плат за право работы, не продают розничным покупателям и требуют документы о регистрации бизнеса.
* **Структура сборов и условий:** Плата за обработку заказа (Per order fee $2–$5), минимальный объем заказа (MOQ) и кредитные периоды (Net terms: Net 30/40).
* **Методы поиска поставщиков:** Прямые звонки производителям, глубокий поиск в Google (использование модификаторов «distributor», «bulk»), тестовые заказы у конкурентов для узнавания адреса отправки и работа с каталогами (SaleHoo, Worldwide Brands).
* **Признаки отличного поставщика:** Наличие экспертных выделенных менеджеров (Sales rep), современные технологии (real-time интеграция запасов), прием заказов по email и центральное географическое положение.

* **Продуктовый портфель (Product Portfolio):** Наличие линейки из недорогих, средних и премиальных товаров для психологического якорного эффекта.

* **Шифрование и мониторинг:** Обязательное использование протокола HTTPS (TLS-сертификаты), регулярное резервное копирование (Backups), своевременная установка обновлений/патчей и проведение тестов на проникновение (Penetration tests).

### 5. Типичные ошибки и как их избежать

1. **Продажа товаров низкого качества ради быстрой наживы:**
  * *Ошибка:* Попытка заработать на дешёвом бракованном товаре («Crap products»).
  * *Решение:* Никогда не продавать то, чем не стал бы пользоваться сам. Плохой товар генерирует негативные отзывы и уничтожает аккаунт.
2. **Мышление разового перекупщика (Reseller) вместо строителя бренда (Private Label):**
  * *Ошибка:* Постоянная гонка за разовыми арбитражными сделками и спекуляциями.
  * *Решение:* Фокусироваться на создании долгосрочного автономного актива (Asset) с собственным брендом, упаковкой и лояльной аудиторией.
3. **Использование логистики FBM вместо FBA:**
  * *Ошибка:* Самостоятельная отправка заказов клиентам (Fulfilled by Merchant).
  * *Решение:* Использовать FBA, так как алгоритм A9 отдаёт высокий приоритет листингам с доставкой Prime, обеспечивая прирост продаж.
4. **Пренебрежение правильным расчётом объемного веса и сроков доставки:**
  * *Ошибка:* Отправка тяжелых грузов дорогой авиапочтой или отправка морских контейнеров к рождественским праздникам в конце ноября.
  * *Решение:* Рассчитывать volumetric weight (CBM×167) и отправлять праздничные морские партии из Китая не позднее последней недели октября.
5. **Копирование текстов и фотографий производителя:**
  * *Ошибка:* Копирование стандартного текста фабрики («SEO suicide»).
  * *Решение:* Писать 100% уникальные тексты, проверять их через CopyScape и делать собственные качественные фото от 1000px.
6. **Перенасыщение ключевыми словами (Keyword Stuffing / Stacking):**
  * *Ошибка:* Беспорядочное впихивание ключей в каждую строчку текста.
  * *Решение:* Вставлять ключевые слова органично — не чаще 1 раза на 100–200 слов текста, отдавая приоритет читаемости для покупателя.
7. **Покупка фальшивых отзывов и эмоциональные споры:**
  * *Ошибка:* Использование серых агентств накрутки или ругань с недовольными клиентами в публичном поле.
  * *Решение:* Собирать отзывы белыми методами (email-рассылки, безупречный сервис) и отвечать на претензии максимально вежливо и сдержанно.
8. **Постоянные необоснованные скидки:**
  * *Ошибка:* Частые распродажи, обесценивающие воспринимаемое качество товара.
  * *Решение:* Вместо снижения цены добавлять ограниченные по времени бонусы и ценные приложения.
9. **Пренебрежение базовой защитой интернет-магазина:**
  * *Ошибка:* Сохранение стандартного логина «admin», слабый пароль, отсутствие HTTPS и 2FA.
  * *Решение:* Использовать сложную парольную фразу, включить 2FA, ограничить количество попыток входа и установить CAPTCHA.
10. **Отсутствие проверки товарных знаков перед запуском:**
  * *Ошибка:* Запуск бренда без предварительной проверки базы патентов.
  * *Решение:* Проверять названия в базе USPTO и поиске Google, чтобы избежать судебных исков и ребрендинга.

### 6. 20 карточек «вопрос — ответ» для повторения

1. **В:** Чем модель Amazon FBA отличается от Amazon FBM? **О:** При FBA товары хранятся, упаковываются и доставляются службами Amazon с поддержкой Prime, а при FBM продавец отправляет заказы покупателям самостоятельно.
2. **В:** Какова главная цель алгоритма Amazon A9? **О:** Показ товаров, наиболее релевантных вкусам конкретного пользователя и имеющих максимальную вероятность завершения продажи.
3. **В:** В чем различие между Индивидуальным и Профессиональным аккаунтом продавца Amazon? **О:** Индивидуальный платит $0.99 за каждую продажу и подходит при объемах менее 40 штук в месяц; Профессиональный платит фиксированные $39.99/мес без комиссии за каждый товар и получает рекламные инструменты.
4. **В:** Какое минимальное разрешение должно быть у главного фото листинга на Amazon и почему? **О:** Минимум 1000×1000 пикселей, чтобы активировалась функция оптического приближения (hover zoom) при наведении курсора.
5. **В:** Что такое индекс BSR (Best Seller Rank)? **О:** Почасово обновляемый рейтинг Amazon, отражающий свежесть и частоту продаж товара внутри его категории.
6. **В:** Какова формула расчета объемного веса для авиафрахта? **О:** Объем в CBM умножается на 167 (VolumetricWeight=CBM×167). Доставка оплачивается по наибольшему из весов (фактическому или объемному).
7. **В:** Что такое код FNSKU и где он должен находиться? **О:** Это уникальный товарный штрихкод склада Amazon, который наклеивается на индивидуальную упаковку каждого товара поверх заводского UPC-кода.
8. **В:** Назовите идеальный ценовой диапазон для импульсивных покупок на Amazon. **О:** От $20 до $100, при этом диапазон до $50 считаются наилучшим «sweet spot».
9. **В:** Каково главное преимущество бренда Private Label перед обычным арбитражем (Reselling)? **О:** Private Label создаёт долгосрочный автономный актив (Asset) с пассивным доходом, а арбитраж дает лишь разовую прибыль.
10. **В:** В какой крайний срок осенние морские поставки должны выходить из Китая для успевания к Рождественским продажам? **О:** Не позднее последней недели октября, чтобы избежать заторов на таможне.
11. **В:** На каком языке программирования создаются темы кастомизации витрины Shopify? **О:** На языке Liquid, а не на стандартном HTML/CSS.
12. **В:** Какова рекомендуемая плотность ключевых слов для статьи или описания товара во избежание спам-фильтра Google? **О:** Не более 1 ключевого слова на 100–200 слов текста.
13. **В:** Что такое метод Word Crunching при выборе названия бренда? **О:** Генерация названия путем комбинации отраслевых ключевых слов с популярными префиксами и суффиксами (Guide, Hub, Report).
14. **В:** Как проверить уникальность текста описания перед публикацией на Shopify? **О:** С помощью специализированных сервисов проверки на плагиат, таких как CopyScape.
15. **В:** В чем отличие вечнозеленых (Evergreen) ниш от трендовых (Trending)? **О:** Вечнозеленые дают стабильный спрос на протяжении многих лет, а трендовые дают резкий всплеск продаж с последующим быстрым падением.
16. **В:** Каким критериям должна отвечать группа Facebook для подтверждения высокой популярности ниши? **О:** Выдача более 15 тематических групп с численностью от 30,000 участников в каждой.
17. **В:** В чем заключается ценовой «Метод матраса» (The Mattress Method)? **О:** В переводе денежной стоимости товара в понятные жизненные эквиваленты — экономию времени, сохранение здоровья, красоты и продуктивности.
18. **В:** Почему опасно часто предоставлять скидки покупателям? **О:** Скидки вызывают привыкание, заставляют клиентов ждать следующих распродаж и снижают воспринимаемое качество товара.
19. **В:** Почему реальные оптовые поставщики никогда не берут ежемесячные подписки за работу с ними? **О:** Настоящие оптовики зарабатывают на объеме продаж товара, а ежемесячные платы взимают сервисы-посредники или мошеннические розничные магазины.
20. **В:** Почему рекомендуется прятать e-mail адрес за контактной формой с CAPTCHA? **О:** Открытые e-mail адреса быстро собираются автоматическими скраперами (Email scrapers) и заспамливаются.
