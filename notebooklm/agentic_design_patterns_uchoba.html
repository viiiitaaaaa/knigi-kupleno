<script type="text/plain" id="src">Ниже представлен учебный конспект книги Антонио Гулли **«Шаблоны проектирования автономных ИИ-систем» (Agentic Design Patterns: A Hands-On Guide to Building Intelligent Systems)**.

#### 1. О чём книга в 3 предложениях

1. Книга Антонио Гулли представляет собой практическое руководство по архитектурным паттернам проектирования автономных ИИ-систем на базе больших языковых моделей (LLM).
2. В ней детально разбирается эволюция от изолированных промптов и простых цепочек к многоагентным системам (Multi-Agent Systems), способным планировать действия, вызывать внешние инструменты (Tool Use), управлять контекстом (Memory Management) и самообучаться.
3. Автор систематизирует 21 паттерн проектирования с примерами кода на LangChain, LangGraph, CrewAI и Google ADK, показывая, как строить надёжные, безопасные и экономически эффективные ИИ-решения.

#### 2. Главные идеи по главам

##### Глава 1: Prompt Chaining (Цепочки промптов)

* **Стратегия «разделяй и властвуй» (divide-and-conquer):** Сложная задача разбивается на последовательность мелких управляемых подзадач, где вывод одного промпта передаётся на вход следующему.
* **Детерминированная промежуточная логика:** Между вызовами LLM можно вставлять традиционный код для валидации данных, форматирования и условных проверок.
* **Повышение надежности:** Фокусировка модели на одной операции за раз существенно снижает количество ошибок по сравнению с одним монолитным промптом.
* **Применение:** Генерация и рецензирование кода, многошаговая суммаризация, обработка документов и поддержание контекста в диалогах.

##### Глава 2: Routing (Маршрутизация)

* **Динамический выбор пути:** Введение условной логики позволяет агенту выбирать следующий инструмент, под-агент или ветку исполнения в зависимости от входных данных.
* **Способы классификации:** Маршрутизация может реализовываться через промпты LLM (intent classification), жесткие правила или семантическое сходство векторных эмбеддингов.
* **Диспетчеризация высокоуровневых задач:** Служит входящим маршрутизатором в службах поддержки и сложных исследовательских системах.
* **Фреймворки:** В LangGraph реализуется через условные рёбра графа, а в Google ADK — через под-агенты и автоматическое делегирование (Auto-Flow).

##### Глава 3: Parallelization (Параллелизация)

* **Одновременное исполнение:** Запуск независимых вызовов LLM, API или под-агентов параллельно для кардинального снижения общего времени отклика (latency).
* **Сферы применения:** Параллельный сбор данных из нескольких источников, одновременно мультимодальный анализ, A/B-тестирование гипотез и проверка валидности.
* **Инструменты реализации:** Использование RunnableParallel в LCEL (LangChain) и ParallelAgent в Google ADK.
* **Компромисс:** Параллелизация снижает задержку, но увеличивает пиковый расход токенов, стоимость и сложность отладки системы.

##### Глава 4: Reflection (Рефлексия / Самоанализ)

* **Контур обратной связи (Feedback Loop):** Агент самостоятельно оценивает созданный результат или план и итеративно улучшает его.
* **Архитектура «Генератор — Критик» (Producer-Critic / Generator-Critic):** Разделение ролей на создателя контента и критикующего эксперта для устранения предвзятости самопроверки.
* **Применение:** Отладка и оптимизация кода, литературная редактура, проверка фактов и составление планов.
* **Затраты:** Повышает качество вывода за счёт роста задержки и расхода токенов на дополнительные итерации.

##### Глава 5: Tool Use (Function Calling) (Использование инструментов)

* **Выход во внешний мир:** Предоставление LLM доступа к внешним API, базам данных, калькуляторам и исполнению кода.
* **Механика вызова:** Модель генерирует структурированный запрос (JSON) с именем функции и аргументами, а оркестратор выполняет код и возвращает результат.
* **Преодоление статичности:** Позволяет агенту работать с актуальными данными реального времени и выполнять физические или цифровые действия.
* **Инструмент против функции:** Понятие Tool Calling шире Function Calling, так как инструментом может выступать даже другой специализированный ИИ-агент.

##### Глава 6: Planning (Планирование)

* **Автономное построение маршрута:** Агент берет верхнеуровневую цель и самостоятельно формирует последовательность подцелей и шагов для её достижения.
* **Динамическая адаптация:** Способность перестраивать план при изменении условий среды, недоступности ресурсов или ошибках.
* **Применение в Deep Research:** Автономный многошаговый сбор информации с итеративным уточнением поисковых запросов (например, Google DeepResearch).
* **Баланс автономии:** Выбор между динамическим планированием и жестким детерминированным пайплайном зависит от предсказуемости задачи.

##### Глава 7: Multi-Agent Collaboration (Многоагентное взаимодействие)

* **Разделение труда:** Сложная многодоменная задача разбивается между узкоспециализированными агентами с разным набором инструментов и промптов.
* **Топологии взаимодействия:** Последовательная передача (Sequential Handoffs), иерархия с супервайзером (Supervisor), дебаты (Debate/Consensus) и использование агента как инструмента (Agent as a Tool).
* **Преимущества:** Повышение модульности, отделимость ошибок и предотвращение перегрузки контекста одного агента.
* **Инструменты:** Реализация через CrewAI (роли, задачи, процессы) и Google ADK (SequentialAgent, ParallelAgent, LoopAgent).

##### Глава 8: Memory Management (Управление памятью)

* **Двухуровневая память:** Разделение на кратковременную память контекстного окна (Short-term) и долговременную хранилище знаний (Long-term / Vector DB).
* **Структура в Google ADK:** Три ключевых понятия — Session (поток диалога), State (рабочий словарь переменных сессии) и MemoryService (долгосрочная база знаний).
* **Префиксы видимости состояния:** Префиксы user: (данные пользователя между сессиями), app: (глобальные данные приложения) и temp: (один ход).
* **Сервисы долговременной памяти:** Использование Vertex AI Memory Bank для автоматического вычленения фактов и предпочтений пользователя.

##### Глава 9: Learning and Adaptation (Обучение и адаптация)

* **Эволюция поведения:** Изменение знаний, действия и логики агента на основе накопленного опыта без переобучения базовых весов модели.
* **Методы:** Обучение с подкреплением (RL), Few-Shot адаптация, непрерывное онлайн-обучение и эволюционные алгоритмы.
* **Кейс SICA и OpenEvolve:** Самоулучшающийся агент для написания кода (Self-Improving Coding Agent), который модифицирует свой собственный код и инструменты на базе прохождения бенчмарков.
* **Надзорный агент (Overseer LLM):** Фоновый ИИ-модуль, отслеживающий зацикливание и неэффективность обучающегося агента.

##### Глава 10: Model Context Protocol (MCP) (Протокол контекста модели)

* **Универсальный стандарт:** Клиент-серверный открытый протокол для подключения любых LLM к внешним источникам данных, промптам и инструментам.
* **Отличие от Function Calling:** MCP обеспечивает динамическое обнаружение (discovery) ресурсов и стандартизированный контракт, абстрагируя проприетарные API провайдеров.
* **Требования к API:** API под MCP должны быть адаптированы для агентов (поддерживать текстовый формат Markdown, фильтрацию и сортировку).
* **Разработка:** Использование библиотеки FastMCP на Python для быстрого создания MCP-серверов и подключения их через MCPToolset в ADK.

##### Глава 11: Goal Setting and Monitoring (Постановка целей и мониторинг)

* **Целеориентированность (SMART):** Задание агенту чётких измеримых критериев успеха и целевого состояния.
* **Контур мониторинга:** Постоянное отслеживание текущего состояния среды, выполнения подцелей и действий агента.
* **Оценка успеха:** Использование проверочных LLM-судей (LLM-as-a-Judge) для бинарной или бальной оценки достижения цели и остановки итераций.
* **Применение:** Автоматическая поддержка клиентов, торговые боты, робототехника и управление проектами.

##### Глава 12: Exception Handling and Recovery (Обработка исключений и восстановление)

* **Трёхэтапная стойкость:** Обнаружение ошибок (Error Detection), обработка (Error Handling) и восстановление (Recovery).
* **Тактики обработки:** Логирование, повторные попытки (retries), использование резервных путей (fallbacks), плавное снижение функциональности (graceful degradation).
* **Механизмы восстановления:** Откат состояния (state rollback), самокоррекция плана, перепланирование и эскалация.
* **Резервирование под-агентов:** Архитектура с первичным обработчиком (primary_handler) и аварийным под-агентом (fallback_handler).

##### Глава 13: Human-in-the-Loop (Участие человека в контуре / HITL)

* **Симбиоз ИИ и человека:** Интеграция человеческого контроля и экспертного суждения в ключевых точках принятия решений.
* **Формы участия:** Человеческий надзор (oversight), вмешательство и исправление ошибок, обратная связь для обучения (RLHF), валидация и политики эскалации.
* **Обязательные сферы:** Финансовое одобрение кредитов, юридические решения, медицина и критическая инфраструктура.
* **Компромисс:** HITL гарантирует безопасность и этичность, но создает узкое место в масштабируемости системы.

##### Глава 14: Knowledge Retrieval (RAG) (Извлечение знаний)

* **Дополнение контекста:** Извлечение релевантных фактов из внешних баз знаний и подмешивание их в промпт модели.
* **Компоненты Naive RAG:** Чанкинг (chunking) документов, создание векторных эмбеддингов и поиск по векторным базам.
* **Agentic RAG:** Агент выступает активным гейткипером — анализирует свежесть источников, разрешает противоречия и формирует повторные поисковые запросы.
* **GraphRAG:** Использование графов знаний для синтеза ответов на сложные взаимосвязанные запросы.

##### Глава 15: Inter-Agent Communication (A2A) (Межагентное взаимодействие)

* **Стандарт Agent2Agent (A2A):** Открытый HTTP-протокол для взаимодействия агентов, созданных на разных фреймворках (ADK, LangGraph, CrewAI и др.).
* **Паспорт агента (Agent Card):** JSON-файл спецификации, описывающий эндпоинты, навыки, аутентификацию и способы обнаружения агента.
* **Модели взаимодействия:** Синхронный запрос-ответ, асинхронный опрос (polling), Server-Sent Events (SSE) для стриминга и вебхуки.
* **A2A vs MCP:** MCP связывает агент с инструментами и данными, а A2A управляет делегированием задач и координацией между агентами.

##### Глава 16: Resource-Aware Optimization (Оптимизация с учётом ресурсов)

* **Управление бюджетом:** Динамическое распределение вычислительных, временных и финансовых ресурсов при выполнении задач.
* **Динамическое переключение моделей (Dynamic Model Switching):** Направление простых запросов на быстрые и дешевые модели (Gemini Flash), а сложных — на мощные (Gemini Pro).
* **Дополнительные техники:** Контекстная обрезка (Contextual Pruning), адаптивный выбор инструментов, прогноз ресурсов и параллелизация.
* **Роль агента-критика (Critique Agent):** Оценка адекватности выбора модели и дообучение логики маршрутизатора.

##### Глава 17: Reasoning Techniques (Техники рассуждения)

* **Методы мышления:** Chain-of-Thought (CoT), Tree-of-Thought (ToT), Program-Aided Language Models (PALM) и ReAct (Thought, Action, Observation).
* **Закон масштабирования вывода (Scaling Inference Law):** Выделение большего «бюджета на размышление» (thinking time) во время инференса существенно повышает точность работы даже небольших моделей.
* **Дебаты моделей:** Chain of Debates (CoD) и Graph of Debates (GoD) для снижения галлюцинаций через консилиум моделей.
* **MASS (Multi-Agent System Search):** Автоматический поиск оптимальной топологии и промптов многоагентных систем.

##### Глава 18: Guardrails/Safety Patterns (Ограждения / Паттерны безопасности)

* **Многоуровневая защита:** Обеспечение безопасного, этичного и предсказуемого поведения ИИ-агентов.
* **Фильтры и правила:** Валидация входных данных (Input Sanitization), фильтрация вывода (Output Filtering), ограничение вызова опасных инструментов.
* **Контрольные точки и откат (Checkpoint and Rollback):** Применение транзакционных принципов из инженерии БД для отката небезопасного состояния.
* **Инженерная дисциплина:** Принцип наименьших привилегий (Least Privilege), модульность и глубокое структурированное логирование.

##### Глава 19: Evaluation and Monitoring (Оценка и мониторинг)

* **Непрерывный аудит:** Мониторинг точности, задержки (latency), расхода токенов и дрейфа данных (drift) в продакшене.
* **Анализ траекторий (Agent Trajectories):** Оценка последовательности шагов и инструментов агента на соответствие эталонному пути (exact match, in-order match, precision/recall).
* **LLM-as-a-Judge:** Использование независимых моделей для качественного аудита вербальных ответов.
* **Модель контрактов (Contractor Model):** Переход от нечётких промптов к формальным соглашениям с этапом переговоров, подконтрактами и верифицируемыми критериями.

##### Глава 20: Prioritization (Приоритезация)

* **Ранжирование задач:** Упорядочивание действий и подцелей агента на основе срочности, важности, зависимостей и стоимости ресурсов.
* **Динамическая ре-приоритезация:** Способность агента пересчитывать приоритеты прямо во время работы при появлении новых экстренных событий.
* **Уровни приоритезации:** Выбор глобальной цели, порядка подзадач в плане и выбор немедленного действия из очередей.
* **Применение:** Службы поддержки, распределение облачных ресурсов, автопилоты, трейдинг и управление проектами.

##### Глава 21: Exploration and Discovery (Исследование и открытие)

* **Поиск «неизвестных неизвестных»:** Проактивный выход агента за пределы заданного пространства решений для генерации новых знаний.
* **Google AI Co-Scientist:** Многоагентная имитация научного метода (агенты генерации гипотез, рецензирования, турнирного ранжирования и эволюции).
* **Agent Laboratory:** Полный цикл автономии — от сбора литературы на arXiv до проведения экспериментов на Python и верстки отчётов в LaTeX.
* **Синергия с человеком:** Делегирование вычислительно затратного поиска ИИ-агентам при сохранении архитектурного контроля за человеком.

    Eval --&gt; Discovery[Chapter 21: Exploration &amp; Discovery]
    Eval --&gt; GoalCheck{Chapter 11: Goal Setting &amp; Monitoring}
    
    GoalCheck --&gt;|Цель достигнута| Out([Финальный результат])
    GoalCheck --&gt;|Коррекция| Plan
```

#### 4. Пошаговый чек-лист практических действий

1. **Определение цели и контракта (Goal Setting &amp; Contract Definition):** Чётко сформулируйте целевое состояние агента, критерии успеха (SMART) и границы его автономии.
2. **Проектирование контекста (Context Engineering):** Скомпонуйте динамическое окружение — системные промпты, явные и неявные данные, примеры вывода (few-shot).
3. **Выбор паттернов исполнения (Execution Patterns):** Определите, нужен ли детерминированный пайплайн (Prompt Chaining), динамический выбор пути (Routing), параллельные ветки (Parallelization) или многошаговый план (Planning).
4. **Интеграция инструментов и MCP (Tool Use &amp; MCP):** Опишите функции с помощью четких схем аргументов и используйте Model Context Protocol для подключения внешних API.
5. **Организация памяти (Memory Management):** Настройте короткоживущий контекст диалога (Session.state) и подключите векторное хранилище (RAG) для долгосрочных знаний.
6. **Настройка многоагентного взаимодействия (Multi-Agent &amp; A2A):** Распределите роли между узкоспециализированными агентами и настройте межагентный протокол A2A.
7. **Внедрение рефлексии (Reflection):** Создайте контур самопроверки «Генератор — Критик» для итеративного повышения качества кода или текста.
8. **Установка барьеров безопасности и HITL (Guardrails &amp; Human-in-the-Loop):** Добавьте валидацию входов/выходов, ограничьте права вызова функций и настройте правила эскалации на человека.
9. **Оптимизация ресурсов (Resource-Aware Optimization):** Настройте динамическое переключение моделей (маршрутизацию простых запросов на Gemini Flash, сложных — на Gemini Pro) и обрезку контекста.
10. **Организация мониторинга и оценки (Evaluation &amp; Trajectories):** Настройте логирование траекторий вызова инструментов, отслеживание задержки (latency) и проверку ответов через LLM-as-a-Judge.

#### 5. Типичные ошибки и как их избежать

1. **Попытка решить сложную задачу одним промптом:**
  * *Ошибка:* Ожидание, что модель выдаст идеальный результат на сложный монолитный запрос.
  * *Как избежать:* Применять Prompt Chaining или Planning для декомпозиции задачи на простые подшаги.
2. **Бесконечные и затратные циклы рефлексии:**
  * *Ошибка:* Зацикливание агента при бесконечной критике своего результата, ведущее к исчерпанию бюджета токенов.
  * *Как избежать:* Устанавливать жёсткие лимиты итераций (max_iterations) и чёткие критерии выхода (например, фраза CODE_IS_PERFECT).
3. **«Грязный» или избыточный контекст:**
  * *Ошибка:* Передача в модель разрозненных и неактуальных данных, приводящая к галлюцинациям и деградации внимания.
  * *Как избежать:* Применять Context Engineering, обрезку контекста (Contextual Pruning) и ранжирование источников.
4. **Отсутствие обработки сбоев внешних API:**
  * *Ошибка:* Падение всей системы при ошибке 404/500 или таймауте внешнего инструмента.
  * *Как избежать:* Реализовать паттерн Exception Handling: повторные попытки (retries), использование резервных агентов (fallback_handler) и плавную деградацию.
5. **Прямое обёртывание устаревших API в MCP без адаптации данных:**
  * *Ошибка:* Передача агенту сырых бинарных PDF или несортированных больших списков.
  * *Как избежать:* Подготавливать API с детерминированной фильтрацией и конвертировать данные в понятный агенту формат Markdown.
6. **Слепая автономия в критических процессах:**
  * *Ошибка:* Разрешение агенту выполнять необратимые финансовые или юридические действия без контроля.
  * *Как избежать:* Внедрять паттерны Guardrails и Human-in-the-Loop с политикой обязательного подтверждения человеком.
7. **Использование мощных моделей для простых рутинных задач:**
  * *Ошибка:* Направление простых классификационных запросов на дорогостоящие флагманские модели.
  * *Как избежать:* Внедрять Dynamic Model Switching и Router Agent для перенаправления простых запросов на легкие модели.

#### 6. 20 карточек «вопрос — ответ» для повторения

1. **Вопрос:** Что такое ИИ-агент (AI Agent)? **Ответ:** Это автономная система на базе LLM, способная воспринимать окружение, планировать действия, использовать внешние инструменты и итеративно достигать поставленных целей.
2. **Вопрос:** Из каких 5 шагов состоит базовый цикл работы агента? **Ответ:** 1. Get the Mission (Получение цели); 2. Scan the Scene (Анализ контекста); 3. Think It Through (Планирование); 4. Take Action (Выполнение действий); 5. Learn &amp; Get Better (Обучение).
3. **Вопрос:** В чём ключевая идея паттерна Prompt Chaining? **Ответ:** В последовательном разбиении задачи на мелкие промпты, где вывод предыдущей LLM становится входом для следующей, с возможностью вставки кода между ними.
4. **Вопрос:** Чем Routing отличается от Prompt Chaining? **Ответ:** Prompt Chaining исполняет детерминированную линейную цепочку, а Routing динамически выбирает ветку или инструмент на основе условного анализа контекста.
5. **Вопрос:** В чём разница между Function Calling и Tool Calling? **Ответ:** Function Calling — это вызов конкретных функций кода, а Tool Calling — более широкое понятие, включающее вызов сторонних API, баз данных и даже других ИИ-агентов.
6. **Вопрос:** Какую роль выполняет модель «Генератор — Критик» (Producer-Critic) в рефлексии? **Ответ:** Разделяет обязанности: один агент генерирует решение, а второй (с ролью эксперта) объективно оценивает его и дает рекомендации по исправлению.
7. **Вопрос:** В чём главное отличие Model Context Protocol (MCP) от обычного Function Calling? **Ответ:** MCP — это открытый клиент-серверный стандарт с динамическим обнаружением (discovery) ресурсов и универсальной совместимостью, а Function Calling — проприетарный вызов функций конкретного провайдера.
8. **Вопрос:** Что гласит Закон масштабирования вывода (Scaling Inference Law)? **Ответ:** Точность работы модели предсказуемо растёт, если выделить ей больше вычислительного бюджета («времени на размышление») во время инференса.
9. **Вопрос:** Как расшифровывается и работает цикл ReAct? **Ответ:** Reason &amp; Act (Рассуждение и Действие): агент работает в итеративном цикле Thought (мысль) -&gt; Action (вызов инструмента) -&gt; Observation (анализ ответа).
10. **Вопрос:** Каковы три уровня видимости переменных состояния (State) в Google ADK? **Ответ:** user: (сохраняется между сессиями пользователя), app: (глобальные данные приложения) и temp: (данные текущего хода).
11. **Вопрос:** Что представляет собой проект SICA в контексте самообучения агентов? **Ответ:** Self-Improving Coding Agent — агент, который самостоятельно изменяет свой исходный код и инструменты на базе прохождения архивных бенчмарков под надзором фонового Overseer LLM.
12. **Вопрос:** Чем Agentic RAG отличается от Naive RAG? **Ответ:** Naive RAG пассивно подставляет найденные фрагменты в промпт, а Agentic RAG активно критикует источники, разрешает противоречия и формирует утоняющие поисковые запросы.
13. **Вопрос:** Чем протокол A2A отличается от протокола MCP? **Ответ:** MCP стандартизирует подключение агента к инструментам и данным, а A2A (Agent2Agent) отвечает за взаимодействие и делегирование задач между агентами из разных систем.
14. **Вопрос:** В чём суть техники Dynamic Model Switching? **Ответ:** В динамической маршрутизации простых задач на дешевые/быстрые модели (Gemini Flash), а сложных — на мощные модели (Gemini Pro) для оптимизации бюджета.
15. **Вопрос:** Как паттерн Checkpoint and Rollback применяется в безопасности агентов? **Ответ:** Он сохраняет валидированные состояния агента (commit) и позволяет откатываться к ним при возникновении ошибок или небезопасного поведения.
16. **Вопрос:** Какие 3 этапа включает паттерн Exception Handling and Recovery? **Ответ:** 1. Error Detection (обнаружение); 2. Error Handling (логирование, ретраи, фолбеки); 3. Recovery (откат состояния, самокоррекция, эскалация).
17. **Вопрос:** Какова главная цель паттерна Human-in-the-Loop (HITL)? **Ответ:** Гарантировать безопасность, этичность и соответствие требованиям в критических точках принятия решений за счет человеческого надзора.
18. **Вопрос:** Что такое траектория агента (Agent Trajectory) при оценке качества? **Ответ:** Это полная последовательность мыслей, вызовов инструментов и промежуточных шагов, с помощью которой агент пришёл к финальному ответу.
19. **Вопрос:** Что такое «Модель контрактов» (Contractor Model) в оценке ИИ? **Ответ:** Подход, при котором агент работает на основе формализованного соглашения, включая стадию переговоров, подконтракты и верифицируемые тесты перед сдачей работы.
20. **Вопрос:** В чём отличие паттерна Exploration and Discovery от обычной оптимизации? **Ответ:** Оптимизация ищет решение в известном пространстве, а Exploration &amp; Discovery проактивно ищет новые гипотезы и исследует область «неизвестных неизвестных».

#### 7. 5 практических заданий на применение

##### Задание 1: ИИ-консультант стилист для интернет-магазина одежды

* **Сценарий:** Клиент загружает фото своего гардероба или описывает пожелания и просит подобрать образ для мероприятия.
* **Архитектура паттернов:**
  1. *Routing:* Классификация запроса (подбор образа, проверка наличия, статус заказа).
  2. *Parallelization:* Параллельный запуск поиска одежды в базе данных каталога и анализа модного тренда.
  3. *Tool Use (MCP):* Вызов MCP-сервиса базы данных интернет-магазина для получения точных остатков и размеров.
* **Реализация (Python/Claude):** Напишите Python-скрипт с использованием библиотеки fastmcp или LangChain, где первый шаг маршрутизирует запрос, второй через RunnableParallel делает поиск по фильтрам категории и стилю, а третий форматирует ответ с ссылками на товары.

##### Задание 2: Автоматизированный пайплайн B2B-лидогенерации

* **Сценарий:** Автоматический поиск потенциальных B2B-клиентов, их обогащение данными и составление персонализированных писем.
* **Архитектура паттернов:**
  1. *Multi-Agent Collaboration:* Команда из 3 агентов в CrewAI — Researcher_Agent (поиск компании), Scorer_Agent (скоринг лида) и Copywriter_Agent (написание письма).
  2. *Prioritization:* Ранжирование списка найденных лидов по вероятности сделки и срочности.
  3. *Human-in-the-Loop:* Перед отправкой письма менеджер по продажам получает уведомление и утверждающий чекбокс.
* **Реализация (Python/Claude):** Создайте скрипт с CrewAI/ADK, где Researcher использует инструмент веб-поиска, Scorer ставит балл от 1 до 100. Если балл &gt; 80, вызывается Copywriter, а финальный вариант отправляется на утверждение человеку через эскалационный инструмент.

##### Задание 3: Автономный исследовательский сборщик данных (Data Scraper)

* **Сценарий:** Сбор и анализ нормативных документов или каталогов конкурентов с помощью Claude и Python.
* **Архитектура паттернов:**
  1. *Planning &amp; Deep Research:* Построение многошагового плана обхода сайтов и сбора данных.
  2. *Agentic RAG:* Проверка свежести и достоверности извлечённых веб-данных, фильтрация дубликатов.
  3. *Reflection:* Самопроверка собранной структурированной таблицы на пропуски и невалидные данные.
* **Реализация (Python/Claude):** Реализуйте цикл на Python с библиотекой beautifulsoup4 / httpx и Claude API. Скрипт запрашивает у Claude список URL, скачивает их, извлекает поля в JSON, а затем передает результат агенту-критику для проверки полноты данных.

##### Задание 4: Система обработки претензий и возвратов интернет-магазина

* **Сценарий:** Автоматическая обработка заявок на возврат одежды с проверкой правил магазина.
* **Архитектура паттернов:**
  1. *Guardrails:* Валидация входного текста на отсутствие инъекций и оскорблений.
  2. *Exception Handling and Recovery:* Обработка ошибок при недоступности базы заказов с фолбеком на ручную форму.
  3. *Human-in-the-Loop:* Автоматический возврат для чеков до $50; при превышении лимита — автоматический перевод на оператора.
* **Реализация (Python/Claude):** Напишите Python-функцию, проверяющую сумму возврата. Если сумма &gt; $50, срабатывает политика эскалации (Escalation Policy), отправляющая тикет в сервис поддержки клиентов.

##### Задание 5: Экономичный мониторинг B2B-новостей и сигналов продаж

* **Сценарий:** Ежедневный мониторинг 1000 компаний на предмет смены руководства или привлечения инвестиций.
* **Архитектура паттернов:**
  1. *Resource-Aware Optimization &amp; Dynamic Model Switching:* Легкая модель (Gemini Flash / Claude Haiku) сканирует новости на наличие ключевых слов; только при обнаружении сигнала включается мощная модель (Claude Sonnet/Opus или Gemini Pro).
  2. *Contextual Pruning:* Удаление из новостных статей HTML-мусора и оставление только фактов.
  3. *A2A Communication:* Передача сформированного сигнала ИИ-агенту отдельной CRM-системы.
* **Реализация (Python/Claude):** Создайте двухэтапный пайплайн на Python. Функция filter_news() пропускает заголовки через дешевую модель, а analyze_signal() передает релевантные тексты на глубинную обработку с сохранением отчёта в БД.
