<script type="text/plain" id="src">Ниже представлен подробный учебный конспект книги **Евгения Колотилова «23 Продажи B2B: 101+ кейс»**, составленный строго на основе материалов источника.

#### Section 0. Полный список глав книги

1. **Глава 1. Активные продажи** *(Active Sales)*
2. **Глава 2. Общение с лицом, принимающим решение (ЛПР)** *(Communication with Decision Maker / ЛПР)*
3. **Глава 3. Обсуждение ценового вопроса. Работа с ценой** *(Pricing &amp; Handling Price Objections)*
4. **Глава 4. Дожим клиента: заключение контракта** *(Closing the Deal &amp; Contract Signing)*
5. **Глава 5. Продажи услуг** *(Sales of Services)*
6. **Глава 6. Отношения с клиентами** *(Customer Relations / CRM)*
7. **Глава 7. Управление отделом продаж** *(Sales Department Management)*
8. **Глава 8. Карьера менеджера** *(Sales Manager Career)*
9. **Глава 9. Обучение продажам** *(Sales Training)*
10. **Глава 10. Личные вопросы Евгению Колотилову** *(Personal Questions to Evgeny Kolotilov)*

#### Section 1. О чём книга в 3 предложениях

1. Книга представляет собой **практическое руководство по экспертным B2B-продажам** *(business-to-business sales)*, построенное в формате «вопрос — ответ» на базе 101+ реального кейса из российского бизнеса.
2. Автор детально разбирает **все этапы коммерческого цикла** — от преодоления барьеров секретарского фильтра и выхода на первых лиц до методик отстройки от демпинга *(anti-dumping strategies)* и «дожима» сложных сделок.
3. Пособие предлагает **готовые речевые скрипты** *(sales scripts)*, алгоритмы построения отделов продаж и стратегии позиционирования продавца как эксперта и советника для клиента.

#### Section 2. Главные идеи по главам

##### Глава 1. Активные продажи *(Active Sales)*

* **Преодоление выгорания при длинном цикле сделки** *(long sales cycle)*: Использование графиков прогресса по клиентам (в процентах), системы микровознаграждений за промежуточные шаги и назначения «запасной совести» *(accountability partner)* из коллег для поддержания дисциплины звонков.
* **Истинная цель холодного звонка** *(cold call goal)*: Холодный звонок совершается не для моментальной продажи продукта «в лоб», а для выявления принципиального интереса, квалификации ЛПР *(decision maker qualification)* и назначения 15-минутной личной или онлайн-встречи.
* **Структура продающего коммерческого предложения ABCD**: Использование формулы **A**ttention *(привлечение внимания контекстом клиента)*, **B**enefits *(конкретная выгода)*, **C**redentials *(доказательства надежности и авторитета)*, **D**irection *(четкий следующий шаг)*.
* **Методики обхода «привратников»** *(gatekeeper bypass)*: Совершение звонков в ранние или поздние часы, проведение микроаудита из 5–6 вопросов, использование 3D-писем *(3D direct mail)* с выпуклыми предметами в конверте и ссылка на специалистов компании *(«соучастников продажи»)*.
* **Отстройка без демпинга при стандартном товаре**: Привлечение клиентов за счет скорости доставки, особых условий оплаты, расширения сервиса или ввода нового продукта с улучшенными характеристиками вместо снижения цены.

##### Глава 2. Общение с лицом, принимающим решение (ЛПР / Decision Maker)

* **Стратегия работы при делегировании переговоров**: Обуждение с ЛПР 5–7 стратегических вопросов до спуска на тактический уровень к подчиненным и сохранение права ссылаться на позицию руководителя.
* **Разграничение понятия «ценность»** *(value vs. features)*: Техническая характеристика *(feature)* и преимущество *(advantage)* превращаются в ценность только тогда, когда они решают конкретную, осознанную проблему покупателя.
* **Категорический отказ от откатных схем** *(anti-kickback policy)*: Выход на первых лиц компании *(CEO/owners)* вместо закупщиков; использование репутации принципиальной компании для снятия подозрений с самого закупщика.
* **Борьба с дебиторской задолженностью** *(accounts receivable management)*: Приоритет предоплаты *(prepayment)*; при задержках — запрос конкретного платежного поручения и частичной суммы (даже минимальной) для перевода клиента в статус «возвращающего долг».
* **Сводная сравнительная таблица параметров**: Нейтрализация стереотипов (например, «импорт лучше отечественного») путем оценки продукта и конкурентов по 20–30 параметрам по 10-балльной шкале.

##### Глава 3. Обсуждение ценового вопроса. Работа с ценой *(Pricing &amp; Value Negotiation)*

* **Аргументация высокой стоимости**: Гордость за дорогой продукт и показ клиенту-дилеру дополнительных выгод: повышенной маржинальности, использования товара в качестве «пугала» *(anchor product)* для увеличения продаж среднего сегмента и высокой надежности.
* **Две переговорные стратегии по цене**: Стратегия **отсечения** *(naming full price)* для мгновенной квалификации и отсева непрофильных клиентов, и стратегия **вовлечения** *(naming &#x27;starting from&#x27; price)* с демонстрацией ценовой вилки на примерах.
* **Противодействие демпингу конкурентов**: Использование эмоционального фактора общения и рациональной экспертности (разбор полной стоимости владения *(TCO — total cost of ownership)*, сервисного обслуживания и рисков).
* **Создание добавочной стратегической ценности**: Перевод переговоров с транзакционного уровня закупщиков *(где важны только цена и наличие)* на уровень топ-менеджмента *(где важны окупаемость, рост бизнеса и оптимизация)*.
* **Ввод новых критериев оценки**: При одинаковом продукте у всех поставщиков (окна, стройматериалы, кабель) смещение фокуса на условия хранения, точность замеров, сервис и гарантию идентичности партий.

##### Глава 4. Дожим клиента: заключение контракта *(Closing the Deal / Contract Signing)*

* **Квалификация по «источнику срочности»** *(source of urgency)*: Если клиент затягивает сделку, значит, предлагаемый продукт не решает его текущую приоритетную проблему.
* **Выявление закупщиков-манипуляторов**: Использование уточняющих вопросов при просьбах отдать товар на реализацию *(consignment)* для отделения реального тестирования спроса от переговорного отжима по цене.
* **Контроль тестирования образцов**: Передача пробников только для проведения теста в личном присутствии продавца, что исключает фальсификацию результатов или игнорирование обратной связи.
* **Язык упущенной прибыли** *(lost profit analysis)*: Подталкивание сомневающихся клиентов к подписанию договора через наглядный расчет финансовых потерь от промедления внедрения решения.
* **Переговоры о переходе на предоплату**: Перепоручение проблемы клиенту *(«С этого месяца у нас только предоплата. Что будем делать?»)* или использование роли «адвоката клиента» перед непреклонным руководством.

##### Глава 5. Продажи услуг *(Sales of Services)*

* **Трансформация в системного интегратора**: Переход от продажи банального интернет-канала к комплексу IT-услуг *(видеонаблюдение, хранение данных, локальные сети)*.
* **Образовательный маркетинг** *(educational marketing)*: Обучение заказчика тонкостям и регламентам услуги для превращения его в соавтора проекта, что нейтрализует сторонних критиков *(«дядей Васей»)*.
* **Платформа личного бренда консультанта и юриста**: Формирование «племени приверженцев» *(advocates / loyal fans)* через публикацию книг, ведение YouTube-канала, выступления на конференциях и написание экспертных статей.
* **Двухшаговые дистанционные продажи**: Фиксация задач при первом телефонном разговоре и проведение полноценной презентации с демонстрацией экрана через видеосвязь *(Skype/ВКС)*.
* **Пакетные коммерческие предложения** *(3-tier pricing)*: Деление предложения на 3 пакета *(«дешевый», «средний», «дорогой»)* для переключения внимания клиента с вопроса «покупать ли» на вопрос «какой вариант выбрать».

##### Глава 6. Отношения с клиентами *(Customer Relations / CRM)*

* **Реанимация «уснувшей» клиентской базы**: Прямое возобновление диалога с напоминанием о прошлом позитивном опыте сотрудничества и вопросом о текущих задачах.
* **Позиция «адвоката клиента»**: Внутренний настрой продавца на искреннюю помощь и защиту интересов заказчика вместо агрессивного «впаривания».
* **Возврат ушедших к конкурентам клиентов**: Выявление истинной причины недовольства в неформальной обстановке, исправление ошибки и поддержка периодического контакта без давления.
* **Прозрачная система скидок («немецкий прайс-лист» / transparent pricing)**: Четко зафиксированная в документе зависимость размера скидки от объема закупок для исключения конфликтов между клиентами-конкурентами.

##### Глава 7. Управление отделом продаж *(Sales Department Management)*

* **Специализация менеджеров**: Четкое разделение функций на «охотников» *(hunters — привлечение новых клиентов)* и «фермеров» *(farmers — развитие и удержание текущей базы)*.
* **Система материальной мотивации**: Установление оклада на уровне 30–70% *(в зависимости от длины цикла сделки)* и использование прогрессивной шкалы комиссионных *(акселератора)* за перевыполнение плана.
* **Телефонное микрособеседование при найме**: Проверка кандидатов по телефону вопросами о понимании функционала продавца и причинах выбора компании для отсева неадекватных соискателей до личной встречи.
* **Регулярный контроль и атмосфера**: Внедрение ежедневных отчетов из трех колонок *(«что делал», «что сделал», «вопросы руководителю»)*, защита от выгорания и категорический запрет на частые изменения плана продаж.

##### Глава 8. Карьера менеджера *(Sales Manager Career)*

* **Учет «срока годности продавца»** *(sales rep shelf-life)*: Преодоление эмоционального выгорания, возникающего через 5 лет у мужчин и 10 лет у женщин, путем продвижения по службе или пересмотра внутренних убеждений *(«потолка дохода»)*.
* **Специализация на конкретной отрасли**: Быстрый рост в B2B достигается за счет глубокого погружения в специфику, проблематику и тренды конкретной ниши клиента.
* **Ориентация на оцифрованный результат**: Составление резюме на языке конкретных достижений в цифрах и готовность выбирать минимальный оклад в пользу высокого процента от продаж.
* **Пять ролей высокооплачиваемого эксперта**: Решатель проблем, Прогнозист, Ментор, Сторонник клиента, Советник.

##### Глава 9. Обучение продажам *(Sales Training)*

* **Обучение как окупаемая инвестиция**: Необученные продавцы обходятся компании значительно дороже из-за упущенной прибыли и испорченной репутации, чем риск их увольнения после обучения.
* **Неэффективность фасилитации в B2B-тренингах**: Приглашенный эксперт должен давать готовые авторские технологии и конкретные скрипты, а не просить участников клеить ватманы.
* **Приоритет корпоративного формата**: Корпоративные тренинги с полным погружением в специфику конкретной компании многократно эффективнее сборных открытых мероприятий.

##### Глава 10. Личные вопросы Евгению Колотилову *(Personal Questions to Evgeny Kolotilov)*

* **Качество аудитории превыше количества**: В B2B-сегменте ключевую роль играет присутствие среди подписчиков и зрителей лиц, принимающих решения *(ЛПР)* и собственников бизнеса, а не массовый охват.
* **Источники экспертных фишек**: Регулярный сбор практических кейсов с тренингов, прослушивание записей реальных звонков, закрытый тренерский чат и чтение 1 книги в неделю с помощью скорочтения.
* **Восстановление после негативного контакта**: Понимание, что негатив клиента вызван ситуацией, а не личностью продавца; проведение анализа «дубля два» *(что бы я изменил)* и краткая смена деятельности.

#### Section 4. Пошаговый чек-лист практических действий

1. **Шаг 1. Нишевание и изучение отрасли клиентов** *(Industry Qualification)*
  * Выберите 1–2 узкие сферы бизнеса для приоритетной работы вместо попыток продавать всем подряд.
  * Изучите специфику, проблематику и профессиональный жаргон выбранной отрасли.
2. **Шаг 2. Разработка продающих инструментов** *(Sales Collateral Preparation)*
  * Составьте сводную сравнительную таблицу вашего продукта и конкурентов по 20–30 параметрам по 10-балльной шкале.
  * Подготовьте шаблон коммерческого предложения по структуре ABCD *(Attention, Benefits, Credentials, Direction)*.
  * Сформируйте 3 пакета предложения: «дешевый», «средний» и «дорогой».
3. **Шаг 3. Организация холодных звонков и обход барьеров** *(Outreach &amp; Gatekeeping)*
  * Звоните с целью назначить 15-минутную встречу или провести микроаудит из 5–6 вопросов, а не продать продукт по телефону.
  * Применяйте техники обхода секретаря *(звонки в нерабочие часы, узкие термины, ссылки на сотрудников-«соучастников»)*.
4. **Шаг 4. Проведение экспертной презентации** *(Value Pitching)*
  * На встрече задавайте вопросы для вскрытия индивидуальных ценностей и проблем заказчика.
  * Презентуйте решение на языке экономической выгоды *(рост маржи, сокращение издержек, снижение рисков)*.
5. **Шаг 5. Отработка ценовых возражений** *(Price Objection Handling)*
  * Используйте универсальный скрипт «Именно поэтому...» при попытках сбить цену.
  * Смещайте фокус с цены на условия хранения, гарантию, сервис и точность поставок.
6. **Шаг 6. «Дожим» и переход на предоплату** *(Closing &amp; Prepayment)*
  * Оценивайте наличие «источника срочности» и демонстрируйте размер упущенной прибыли от затягивания сделки.
  * Переводите клиента на предоплату, перепоручая решение ему *(«С этого месяца у нас только предоплата. Как будем поступать?»)*.
7. **Шаг 7. Развитие клиента и запрос рекомендаций** *(Referral Generation &amp; Partner Support)*
  * Передавайте дистрибьюторам готовые инструкции и маркетинговые материалы для продажи вашего товара.
  * По завершении успешной сделки запрашивайте рекомендации к непрямым конкурентам заказчика.

#### Section 5. Типичные ошибки и как их избежать

1. **Ошибка 1: Попытка продать продукт во время первого холодного звонка**
  * *Суть ошибки*: Менеджер зачитывает весь прайс-лист секретарю или первому попавшемуся сотруднику.
  * *Как избежать*: Четко фиксировать цель звонка — выявить ЛПР, квалифицировать интерес и договориться о личной или онлайн-встрече.
2. **Ошибка 2: Демпинг и участие в ценовом «отжиме» закупщиков**
  * *Суть ошибки*: Снижение цены до минимальной наценки, что лишает компанию прибыли и не гарантирует сделку.
  * *Как избежать*: Выходить на уровень первых лиц *(собственников/директоров)*, продавать добавленную стратегическую ценность и аргументировать надежностью и сервисом.
3. **Ошибка 3: Отправка типового КП по электронной почте «вслепую»**
  * *Суть ошибки*: Рассылка безликих прайс-листов без предварительной встречи и выявления потребностей.
  * *Как избежать*: Составлять адресные КП только после диалога, описывать выгоды клиента и предлагать привезти предложение лично или обсудить его на онлайн-встрече.
4. **Ошибка 4: Управление без CRM и досрочное изменение планов продаж**
  * *Суть ошибки*: Ведение базы «в уме» или повышение плана при его перевыполнении, что вызывает подсознательный страх у продавцов.
  * *Как избежать*: Внедрить любую CRM-систему; утверждать план продаж строго на календарный год и не менять его досрочно.
5. **Ошибка 5: Отказ от обучения менеджеров из страха их увольнения**
  * *Суть ошибки*: Отправка необученных сотрудников «в поля», что приводит к массовым отказам, выгоранию и текучке кадров.
  * *Как избежать*: Относиться к обучению как к окупаемой инвестиции, обучающей техникам продаж, выходу на ЛПР и работе с ценой.

#### Section 6. 20 карточек «вопрос — ответ» для повторения

1. **Вопрос**: Какова главная цель первого холодного звонка в B2B?
  * **Ответ**: Выявление принципиального интереса, определение ЛПР и назначение личной или онлайн-встречи.
2. **Вопрос**: Как расшифровывается аббревиатура ABCD в структуре коммерческого предложения?
  * **Ответ**: A — Attention *(внимание)*, B — Benefits *(выгода)*, C — Credentials *(доказательства)*, D — Direction *(следующий шаг)*.
3. **Вопрос**: В чём суть приема «запасная совесть» для борьбы с прокрастинацией звонков?
  * **Ответ**: Назначение настойчивого коллегии или секретаря, который в фиксированные часы принуждает и заставляет менеджера совершать звонки.
4. **Вопрос**: Чем «ценность» *(value)* отличается от характеристики *(feature)* и преимущества *(advantage)*?
  * **Ответ**: Характеристика — свойство товара; преимущество — его возможность; ценность — выгода, решающая конкретную проблему данного клиента.
5. **Вопрос**: Как работает универсальный скрипт «Именно поэтому...»?
  * **Ответ**: Возражение клиента мгновенно трансформируется в причину совершения действия *(например: «Дорого!» — «Именно поэтому стоит учиться у нас, чтобы это перестало быть дорого»)*.
6. **Вопрос**: Что представляет собой «немецкий прайс-лист»?
  * **Ответ**: Прозрачная, четко зафиксированная в документе система скидок в зависимости от объема закупки, исключающая споры между клиентами.
7. **Вопрос**: Как разделяются роли «охотников» и «фермеров» в отделе продаж?
  * **Ответ**: «Охотники» *(hunters)* привлекают новых клиентов, а «фермеры» *(farmers)* развивают и удерживают текущую клиентскую базу.
8. **Вопрос**: Как отвечать на просьбу закупщика «Отправьте предложение на e-mail»?
  * **Ответ**: Предложить встречу на 15 минут для уточнения специфики, чтобы выслать точно рассчитанное предложение.
9. **Вопрос**: Какова оптимальная пропорция оклада и процента у B2B-продавца?
  * **Ответ**: Фиксированный оклад составляет 30–70% *(в зависимости от длины цикла сделки)*, остальное — процент за выполнение плана.
10. **Вопрос**: Что делать, если ЛПР перенаправляет продавца к своему подчиненному?
  * **Ответ**: Получить от ЛПР подтверждение принципиального интереса, обсудить критерии и взять право ссылаться на его мнение перед подчиненным.
11. **Вопрос**: Зачем делать 3 пакета коммерческого предложения *(3-tier pricing)*?
  * **Ответ**: Чтобы сместить фокус внимания клиента с вопроса «покупать ли» на вопрос «какой из 3 вариантов выбрать».
12. **Вопрос**: Как поступить при задержке оплаты и фразе клиента «Нет денег»?
  * **Ответ**: Попросить перечислить любой минимальный платеж *(даже 1000 руб.)*, переведя клиента в статус «возвращающего долг».
13. **Вопрос**: Что такое «источник срочности» *(source of urgency)*?
  * **Ответ**: Наличие у клиента острой проблемы, требующей немедленного решения; без этого сделка откладывается неопределенно долго.
14. **Вопрос**: Каковы 5 ролей высокооплачиваемого B2B-эксперта по Колотилову?
  * **Ответ**: Решатель проблем, Прогнозист, Ментор, Сторонник клиента, Советник.
15. **Вопрос**: Почему демпинг является тупиковой стратегией отстройки?
  * **Ответ**: Он уничтожает маржу, не создает добавочной ценности и втягивает компанию в бесконечную ценовую войну.
16. **Вопрос**: Как обойти секретаря с помощью профессиональной терминологии?
  * **Ответ**: Сообщить, что звонок по узкоспециализированному вопросу *(например, по техническому регламенту/дифференциалу)*, признать некомпетентность в котором секретарю неловко.
17. **Вопрос**: В чём суть «образовательного маркетинга» при продаже услуг?
  * **Ответ**: Обучение клиента деталям и тонкостям процесса превращает его в соавтора проекта, нейтрализующего сторонних критиков.
18. **Вопрос**: Как проводить отбор кандидатов на этапе микрособеседования по телефону?
  * **Ответ**: Спросить о понимании функционала продавца и причинах выбора компании, отсеивая неадекватных соискателей до встречи.
19. **Вопрос**: Почему нельзя повышать план продаж отделу в течение календарного года?
  * **Ответ**: Это вызывает у продавцов подсознательный страх перевыполнения и приводит к искусственному торможению продаж.
20. **Вопрос**: Когда корпоративный тренинг по продажам считается окупаемой инвестицией?
  * **Ответ**: Когда полученные навыки позволяют закрыть дополнительно хотя бы 1–3 сделки.

#### Section 7. 5 практических заданий на применение

##### Задание 1 (для B2B-лидогенерации): Разработка скрипта холодного звонка с микроаудитом *(Micro-audit Cold Call Script)*

* **Контекст**: Агентство B2B-лидогенерации совершает обзвон коммерческих директоров.
* **Задача**: Составить скрипт первого контакта по методике Е. Колотилова. Вместо попытки «впарить» лиды, применить схему микроаудита из 4 вопросов *(о текущих каналах, стоимости лида, загрузке отдела продаж и удовлетворенности)* и предложить 15-минутную онлайн-встречу для презентации вариантов решения.

##### Задание 2 (для интернет-магазина одежды / B2B-опта): Составление коммерческого предложения по системе ABCD *(ABCD Commercial Offer)*

* **Контекст**: Оптовый поставщик одежды привлекает региональные бутики.
* **Задача**: Написать текст коммерческого предложения по формуле ABCD. Включить адресное обращение и факт о бутике (A), расчет роста маржинальности и оборачиваемости полок (B), ссылки на отзывы и опыт работы (C) и конкретный следующий шаг с указанием времени звонка во второй половине дня (D).

##### Задание 3 (для сборщиков данных на Claude/Python): Создание сводной таблицы 30 параметров для отстройки от демпинга *(30-Parameter Comparative Matrix)*

* **Контекст**: Разработчик Python/Claude парсеров и сборщиков данных сталкивается с клиентами, уходящими к дешевым фрилансерам.
* **Задача**: Написать Python-скрипт, генерирующий сравнительную таблицу (10-балльная шкала) вашего сервиса против фрилансеров по 20–30 параметрам: обход блокировок IP, обработка неструктурированного текста через Claude API, автоматический парсинг капчи, наличие SLA, гарантия формата и поддержка 24/7.

##### Задание 4 (для B2B-лидогенерации и IT-сервисов на Claude/Python): Разработка 3 пакетов коммерческих предложений *(3-Tier Pricing Packages)*

* **Контекст**: IT-сервис авто-обогащения B2B-данных на Python/Claude продает подписки отделам продаж.
* **Задача**: Сформировать 3 тарифных пакета: **«Базовый»** *(по цене дешевых конкурентов — только сырые данные)*, **«Оптимальный»** *(целевая цена — данные + очистка)* и **«Премиум»** *(максимальная цена — с готовой интеграцией в CRM, кастомными скриптами на Python и обучением менеджеров)*.

##### Задание 5 (для интернет-магазина одежды / B2B-поставок): Отработка возражения «Возьмем на реализацию» *(Consignment vs. Prepayment)*

* **Контекст**: Крупный магазин одежды просит отдать партию товара на реализацию на 3 месяца.
* **Задача**: Составить диалог отработки возражения с помощью уточняющих вопросов для выявления манипуляции, применения скрипта «Именно поэтому...» и перевода условий на 30-дневную рассрочку или частичную предоплату взамен на фиксированный объем закупки.
