#### 1. О чём книга в 3 предложениях

1. **Книга Итана Моллика рассматривает генеративный искусственный интеллект (Generative AI) не просто как очередную программу, а как «чужеродный совместный разум» (alien co-intelligence), способный дополнять, усиливать и трансформировать человеческое мышление****.**
2. **Автор формулирует четыре базовых принципа работы с ИИ и детально исследует его ключевые роли — личности, творца, коллеги, репетитора и коуча, демонстрируя скачки производительности до 20–80% и одновременно предупреждая о риске «засыпания за рулём» (falling asleep at the wheel)****.**
3. **Главный призыв книги состоит в том, чтобы люди сохраняли субъектность, оставаясь «человеком в контуре» (human in the loop), осваивали гибридные модели работы («кaнтавры» и «киборги») и осознанно направляли технологию к позитивному будущему****.**

#### 2. Главные идеи по главам

##### Введение: Три бессонные ночи (Introduction: Three Sleepless Nights)

* **Понятие «трёх бессонных ночей» (three sleepless nights):** Момент осознания, что большие языковые модели (LLM) ведут себя не как обычный компьютер, а как разумный субъект, способный выполнять сложные задачи от написания симуляций до создания кода.
* **Технология общего назначения (General Purpose Technology, GPT):** Генеративный ИИ относится к редкой категории фундаментальных технологий (как паровой двигатель или интернет), преобразующих все сферы жизни.
* **Беспрецедентная скорость распространения:** ИИ внедряется быстрее предыдущих технологий (ChatGPT набрал 100 млн пользователей за рекордные сроки) и даёт прирост производительности труда на 20–80%.
* **Сущность совместного разума (co-intelligence):** ИИ выступает не просто автоматизатором рутины, а интеллектуальным компаньоном, имитирующим человеческое мышление.

##### Глава 1: Создание чужеродных разумов (1. Creating Alien Minds)

* **Эволюция от предсказания данных к языку:** История ИИ прошла путь от механических иллюзий (Mechanical Turk) и простых алгоритмов до архитектуры «Трансформер» (Transformer, 2017) с механизмом внимания (attention mechanism).
* **Принцип работы LLM:** Модели не «знают» факты в традиционном смысле, а статистически предсказывают следующий токен (next-token prediction) на основе миллиардов параметров (weights).
* **Двухэтапное обучение:** Процесс включает предобучение (pretraining) на колоссальных объемах текста и последующую донастройку (fine-tuning) с помощью обучения с подкреплением на основе отзывов людей (Reinforcement Learning from Human Feedback, RLHF).
* **Эмерджентные способности (emergence):** С ростом масштаба у передовых моделей (Frontier Models, например GPT-4) спонтанно появляются сложные навыки (решение юридических и медицинских тестов, написание кода).
* **Парадокс возможностей:** ИИ с лёгкостью сдаёт адвокатский экзамен или экзамен по neurosurgery, но может ошибаться в простых логических задачах (например, ходах в крестики-нолики).

##### Глава 2: Выравнивание чужеродного разума (2. Aligning the Alien)

* **Проблема выравнивания (alignment problem):** Сложность настройки ИИ так, чтобы его цели и действия строго соответствовали человеческим ценностям и безопасности.
* **Экзистенциальные vs близкие риски:** Дискуссия варьируется от гипотетической угрозы суперинтеллекта (ASI) и гибели человечества («оптимизатор скрепки» Ника Бострома) до насущных проблем — предвзятости (bias), нарушения авторских прав и галлюцинаций.
* **Взлом и инъекции (jailbreaking &amp; prompt injection):** Защитные барьеры ИИ легко обходятся ролевыми играми (например, запросом рецепта напалма от лица пирата) или скрытым текстом на веб-страницах.
* **Роль общества:** Регулирование и корпоративные правила запаздывают; необходимо широкое общественное просвещение и этические стандарты.

##### Глава 3: Четыре правила совместного разума (3. Four Rules for Co-Intelligence)

* **Правило 1: Всегда приглашайте ИИ к столу (Always invite AI to the table):** Использовать ИИ во всех задачах, чтобы на практике изучить «Рваную границу» (Jagged Frontier) — невидимую черту между тем, в чём ИИ силён и где он пасует.
* **Правило 2: Будьте человеком в контуре (Be the human in the loop):** Человек обязан контролировать результат, проверяя ИИ на галлюцинации и конфабуляции, так как ИИ стремится угодить пользователю, а не быть точным.
* **Правило 3: Относитесь к ИИ как к человеку (но говорите ему, какой он человек) (Treat AI like a person, but tell it what kind of person it is):** Задавать ИИ конкретную персону (persona prompting), контекст и ограничения, чтобы избежать шаблонных и посредственных ответов.
* **Правило 4: Исходите из того, что это худший ИИ, которым вы пользуетесь (Assume this is the worst AI you will ever use):** Учитывать экспоненциальный прогресс технологии и готовиться к постоянным изменениям в будущем.

##### Глава 4: ИИ как личность (4. AI as a Person)

* **Поведенческая модель ИИ:** ИИ не работает как традиционный предсказуемый софт; целесообразно воспринимать его как невероятно быстрого, но склонного к выдумкам интерна.
* **Психологическое и экономическое моделирование:** ИИ демонстрирует человекоподобное поведение в поведенческих тестах (Dictator Game, conjoint-анализ покупательских предпочтений).
* **Тест Тьюринга и иллюзия сознания:** Современные LLM легко проходят тест Тьюринга и вызывают у людей сильную эмоциональную привязанность (кейсы Replika и бота Sydney/Bing), хотя не обладают настоящим сознанием.
* **«Искры AGI» (Sparks of AGI):** Эксперименты (например, рисование единорога на языке TikZ) показывают способность ИИ к обобщению и творческому синтезу.

##### Глава 5: ИИ как творец (5. AI as a Creative)

* **Парадокс креативности ИИ:** Галлюцинации и случайность выборки токенов, делающие ИИ ненадёжным в фактах, становятся главным мотором его креативности.
* **Превосходство в тестах на дивергентное мышление:** ИИ обходит подавляющее большинство людей в тестах на альтернативное использование предметов (AUT) и ассоциации (RAT).
* **Генерация идей на практике:** В эксперименте Уортона GPT-4 обошёл 200 студентов MBA по качеству и коммерческой привлекательности стартап-идей (35 из 40 лучших идей созданы ИИ).
* **«Кнопка» (The Button) и кризис смысла:** Легкость создания черновиков одной кнопкой может лишить людей навыков глубокого критического мышления и обесценить ритуалы творческой работы (например, рекомендательные письма).

##### Глава 6: ИИ как коллега (6. AI as a Coworker)

* **Перекрытие профессий:** ИИ в первую очередь влияет на высокооплачиваемый, высокообразованный творческий и аналитический умственный труд.
* **Эксперимент с BCG:** Консультанты с GPT-4 выполняли задачи внутри «Рваной границы» быстрее и качественнее на 40%, но при выходе за её пределы допускали на 19% больше ошибок из-за «засыпания за рулём».
* **Фреймворк задач:** Разделение работы на «Только я» (Just Me Tasks), «Делегируемые» (Delegated Tasks) и «Автоматизированные» (Automated Tasks).
* **Модели взаимодействия:** «Кентавры» (Centaurs) — чёткое разделение труда между человеком и ИИ; «Киборги» (Cyborgs) — непрерывная переплетённая работа на каждом шаге.
* **Секретная автоматизация (Secret Task Automation):** Сотрудники массово скрывают использование ИИ от руководства из-за страха наказания или сокращений.

##### Глава 7: ИИ как репетитор (7. AI as a Tutor)

* **Проблема 2 Сигм Блума (Bloom&#x27;s 2 Sigma Problem):** Индивидуальный репетитор повышает успеваемость ученика на 2 стандартных отклонения; ИИ впервые делает такое обучение массовым.
* **«Апокалипсис домашней работы» (Homework Apocalypse):** ИИ делает традиционные эссе и домашние задания бессмысленными для проверки знаний, а детекторы ИИ-текста неработающими.
* **Прецедент калькуляторов:** Образование пройдёт путь от паники и запретов к интеграции ИИ и фокусировке на глубоких навыках.
* **Перевёрнутые классы (Flipped Classrooms) и активное обучение:** ИИ становится персональным тьютором (как Khanmigo) и генератором интерактивных симуляций.
* **Фокус на человеческом контроле:** Важно учить студентов не временному навыку промпт-инжиниринга, а экспертной проверке результатов ИИ.

##### Глава 8: ИИ как коуч (8. AI as a Coach)

* **Угроза традиционному ученичеству:** Опасность разрушения системы передачи опыта «от мастера к подмастерью» (на примере хирургов, теряющих практику из-за роботов).
* **Парадокс фундаментальных знаний:** В эпоху ИИ глубокое понимание базовых фактов становится ещё более необходимым для экспертной оценки выдачи ИИ.
* **Осознанная практика (Deliberate Practice) с ИИ:** ИИ способен выступать неустанным коучем, обеспечивающим немедленную обратную связь и постепенное усложнение задач.
* **ИИ как «Великий уравнитель» (Great Leveler):** ИИ даёт наибольший прирост производительности наименее опытным и слабым сотрудникам, подтягивая их к уровню экспертов.

##### Глава 9: ИИ как наше будущее (9. AI as Our Future)

* **Четыре сценария будущего:**
  1. *Предел роста (As Good as It Gets):* Прогресс останавливается; главная проблема — загрязнение инфополя фейками и разделение на эхо-камеры.
  2. *Медленный линейный рост (Slow Growth):* Прирост 10–20% в год; постепенная трансформация отраслей и ускорение научных открытий.
  3. *Экспоненциальный рост (Exponential Growth):* ИИ создает следующий ИИ; радикальное сокращение рабочей недели, необходимость безусловного основного дохода (UBI).
  4. *Машинный бог / AGI (The Machine God):* Появление суперинтеллекта (ASI); конец доминирования человека и необходимость идеального выравнивания.
* **Концепция локальной эвкатастрофы (eucatastrophe):** Использование ИИ для создания неожиданных позитивных переломов в обучении, науке и работе.

##### Эпилог: ИИ как мы (Epilogue: AI as Us)

* **ИИ как зеркало человечества:** Технология отражает наши лучшие устремления, знания, а также предрассудки и ошибки.
* **Сохранение человеческой субъектности:** ИИ — это инструмент и совместный разум, но конечную цель и направление задает человек.

#### 4. Пошаговый чек-лист практических действий

1. **[ ] Исследуйте «Рваную границу» (Jagged Frontier):** Приглашайте ИИ к выполнению каждой рабочей задачи. Фиксируйте, где ИИ справляется блестяще, а где пасует.
2. **[ ] Задавайте персону, контекст и ограничения (Persona Prompting):** Начинайте промпт с фразы: *«Действуй как [роль/эксперт]. Твоя цель — [конкретная задача]. Ограничения: [формат, тон, запреты]»*.
3. **[ ] Применяйте пошаговое рассуждение (Chain-of-Thought):** Просите ИИ: *«Рассуждай шаг за шагом»* или дайте алгоритм из 3–4 этапов (сначала варианты, затем критика, затем итоговый выбор).
4. **[ ] Выберите режим работы — «Кентавр» или «Киборг»:**
  * *Кентавр:* Чётко разделите задачу (например, вы делаете структуру и выводы, ИИ построит графики и форматирует).
  * *Киборг:* Переплетайте работу шаг за шагом (начните предложение, попросите ИИ продолжить 5 вариантами, отредактируйте).
5. **[ ] Обязательно проверяйте факты (Human in the Loop):** Никогда не копируйте выдачу ИИ «вслепую». Особо тщательно проверяйте ссылки, цитаты, имена и статистику.
6. **[ ] Проведите категоризацию рабочих задач:**
  * *Только я (Just Me Tasks):* Задачи, требующие личного стиля, этики и глубоких смыслов.
  * *Делегируемые (Delegated Tasks):* Рутина, составление черновиков, суммаризация документов.
  * *Автоматизированные (Automated Tasks):* Задачи со строгой внешне валидируемой проверкой (например, генерация Python-кода).
7. **[ ] Внедрите осознанную практику (Deliberate Practice):** Используйте ИИ как коуча для мгновенного получения критического разбора ваших черновиков, питчей или идей.

#### 5. Типичные ошибки и как их избежать

1. **«Засыпание за рулём» (Falling asleep at the wheel):**
  * *Ошибка:* Слепое доверие качественным ответам ИИ и полный отказ от критического анализа.
  * *Как избежать:* Всегда сохраняйте роль «человека в контуре»; помните, что даже самая умная модель регулярно сгенерирует убедительную ложь.
2. **Работа за пределами «Рваной границы» (Jagged Frontier):**
  * *Ошибка:* Попытка поручить ИИ задачи на точный подсчёт, сложные логические пространственные операции или глубокий контекстный учет без внешних инструментов.
  * *Как избежать:* Тестируйте задачи на малых объемах; подключайте к ИИ внешние инструменты (интерпретатор кода, поиск в веб).
3. **Использование простых и абстрактных промптов:**
  * *Ошибка:* Ввод запросов вида *«Напиши статью про маркетинговые стратегии»*.
  * *Как избежать:* Указывайте аудиторию, роль ИИ, примеры, желаемый тон и жесткие ограничения по структуре.
4. **Синдром «Нажатия на Кнопку» (The Button) и утрата смысла:**
  * *Ошибка:* Отправка сырых ИИ-черновиков коллегам или клиентам без личной переработки и редактуры.
  * *Как избежать:* Используйте ИИ для преодоления страха чистого листа, но вносите личный опыт, стиль и экспертную оценку.
5. **«Секретная автоматизация» (Secret Task Automation) в компаниях:**
  * *Ошибка:* Сокрытие применения ИИ сотрудниками из-за страха штрафов или увольнений.
  * *Как избежать:* Создавайте корпоративную культуру доверия, поощряйте демонстрацию эффективных промптов и гибридных методик.
6. **Отказ от изучения базовых фактов в учебе и работе:**
  * *Ошибка:* Мысль о том, что «теперь не нужно ничего запоминать, так как ИИ всё знает».
  * *Как избежать:* Помнить, что критическое мышление и способность оценить ответ ИИ опираются на факты, сохранённые в долговременной памяти человека.

#### 6. 20 карточек «вопрос — ответ» для повторения

1. **В:** Что Итан Моллик понимает под «тремя бессонными ночами» (three sleepless nights)? **О:** Момент осознания человеком при работе с LLM, что ИИ работает не как традиционная программа, а как чужеродный разум, меняющий будущее работы и учебы.
2. **В:** Почему генеративный ИИ называют технологией общего назначения (General Purpose Technology, GPT)? **О:** Потому что это сквозная технология (как пар или электричество), преобразующая абсолютно все отрасли экономики и сферы жизни.
3. **В:** Что такое «Рваная граница» (Jagged Frontier) ИИ? **О:** Невидимая стена возможностей ИИ, где близкие по сложности задачи могут оказываться по разные стороны (одни выполняются идеально, другие проваливаются).
4. **В:** В чём суть принципа «Будь человеком в контуре» (Be the human in the loop)? **О:** В необходимости постоянного человеческого контроля и проверки результатов ИИ, так как модели склонны к галлюцинациям и стремятся угодничать.
5. **В:** Каковы 4 главных правила работы с ИИ по Моллику? **О:** 1. Всегда приглашайте ИИ к столу; 2. Будьте человеком в контуре; 3. Относитесь к ИИ как к человеку (но говорите, какой он); 4. Считайте этот ИИ худшим из тех, чем будете пользоваться.
6. **В:** Чем «Кентавры» (Centaurs) отличаются от «Киборгов» (Cyborgs)? **О:** «Кентавры» чётко разделяют задачи между человеком и ИИ; «Киборги» глубоко переплетают работу с ИИ на каждом подшаге.
7. **В:** Что такое «засыпание за рулём» (falling asleep at the wheel)? **О:** Потеря человеческой бдительности и критического мышления из-за высокого базового качества ответов ИИ, приводящая к грубым ошибкам.
8. **В:** В чём заключается Проблема 2 Сигм Блума (Bloom&#x27;s 2 Sigma Problem)? **О:** Индивидуальный репетитор повышает успеваемость на 2 стандартных отклонения по сравнению с обычным классом; ИИ впервые позволяет масштабировать такой подход.
9. **В:** Почему попытки обнаружения ИИ-текста детекторами неэффективны? **О:** Детекторы имеют высокий уровень ложных срабатываний (особенно для non-native speakers) и легко обходятся минимальным перефразированием.
10. **В:** Как ИИ влияет на разрыв между сильными и слабыми сотрудниками? **О:** ИИ выступает «Великим уравнителем» (Great Leveler), давая наибольший прирост производительности и качества наименее опытным работникам.
11. **В:** Что такое феномен «Кнопки» (The Button)? **О:** Соблазн генерации черновика любой работы нажатием одной кнопки, что грозит застреванием на первой идее и снижением глубины мышления.
12. **В:** Каковы три категории задач во фреймворке Моллика? **О:** «Только я» (Just Me Tasks), «Делегируемые» (Delegated Tasks) и «Автоматизированные» (Automated Tasks).
13. **В:** Что такое «секретная автоматизация» (Secret Task Automation)? **О:** Практика сотрудников, скрывающих использование ИИ от руководства из-за страха увеличения нормы выработки или увольнения.
14. **В:** Почему галлюцинации (hallucinations) ИИ напрямую связаны с его креативностью? **О:** ИИ — это машина связей (connection machine); механизм случайной выборки токенов, вызывающий ошибки в фактах, одновременно порождает оригинальные комбинации идей.
15. **В:** Каковы результаты эксперимента с консультантами BCG при работе с GPT-4? **О:** Внутри границы ИИ увеличил качество и скорость работы на ~40%, но за пределами границы точность упала с 84% до 60–70%.
16. **В:** Что такое Persona Prompting? **О:** Задание ИИ конкретной роли или характера, что смещает выборку токенов от шаблонных ответов к специфическим и глубоким.
17. **В:** Почему фундаментальные знания (rote facts) становятся БОЛЕЕ важны в эпоху ИИ? **О:** Чтобы оценить правильность работы ИИ, человек обязан обладать экспертными знаниями, хранящимися в долговременной памяти.
18. **В:** Какова угроза ИИ для системы ученичества (apprenticeship)? **О:** Руководители начинают выполнять базовую работу с помощью ИИ, лишая новичков практики и разрушая цепочку формирования экспертов.
19. **В:** Каковы 4 сценария будущего по Моллику? **О:** 1. Предел роста (As Good as It Gets); 2. Медленный линейный рост (Slow Growth); 3. Экспоненциальный рост (Exponential Growth); 4. Машинный бог (The Machine God / AGI).
20. **В:** Что такое эвкатастрофа (eucatastrophe) в контексте ИИ? **О:** Понятие из Толкина: неожиданный счастливый поворот событий, создаваемый осознанным и правильным применением ИИ для блага людей.

#### 7. 5 практических заданий на применение

##### Задание 1. Интернет-магазин одежды: Разработка креативных карточек и сценариев

* **Контекст:** Требуется запустить новую линейку экологичной верхней одежды.
* **Инструкция по книге:** Используйте методPersona Prompting и технику высокой вариативности (variance) для генерации идей.
* **Практический шаг:**
  1. Задайте ИИ персону: *«Действуй как опытный креативный директор в сфере устойчивой моды (sustainable fashion). Сгенерируй 15 нетривиальных концепций описания эко-куртки, избегая банальных штампов (&#x27;экологично&#x27;, &#x27;стильно&#x27;)»*.
  2. Перейдите в режим «Киборга» (Cyborg): возьмите 2 наиболее интересные идеи, допишите начало первого абзаца вручную и попросите ИИ продолжить в 3 разных стилях.
  3. Проведите проверку «Человек в контуре» (Human in the Loop): проверьте, чтобы ИИ не выдумал несуществующие сертификаты или свойства тканей (галлюцинации).

##### Задание 2. B2B-лидогенерация: Пошаговая цепочка персонализации (Chain-of-Thought)

* **Контекст:** Подготовка персонализированных писем для лиц, принимающих решения (LPR) в сфере корпоративного софта.
* **Инструкция по книге:** Примените метод пошагового программирования в прозе (Chain-of-Thought) и проверку на «засыпание за рулём».
* **Практический шаг:**
  1. Составьте промпт: *«Шаг 1: Проанализируй следующий профиль компании [текст]. Шаг 2: Выдели 3 ключевые боли B2B-директора. Шаг 3: Напиши краткое лаконичное письмо (до 100 слов), предлагающее решение третьей боли. Выведи результат в виде таблицы с шагами»*.
  2. Работа в режиме «Кентавра» (Centaur): пусть ИИ сгенерирует структуру и боли, а финальное предложение (Call to Action) и тональность скорректируйте вручную.
  3. Проверьте гиперперсонализацию: убедитесь, что ИИ не придумал несуществующие факты о компании-клиенте.

##### Задание 3. Сборщики данных на Claude/Python: Разработка скрипта с самокоррекцией

* **Контекст:** Написание Python-скрипта для парсинга каталога товаров и структуры цен.
* **Инструкция по книге:** Задействуйте категорию «Автоматизированных задач» (Automated Tasks) с внешней валидацией через компилятор/интерпретатор.
* **Практический шаг:**
  1. Попросите Claude написание кода: *«Напиши скрипт на Python с использованием BeautifulSoup/Requests для сбора названий и цен с [URL]. Скрипт должен обрабатывать ошибки 404/429 и сохранять данные в CSV»*.
  2. Запустите код в локальной среде. В случае ошибки скопируйте лог ошибки обратно в Claude с промптом: *«Код выдал ошибку [Traceback]. Исправь скрипт с учётом этого»*.
  3. Человек в контуре: визуально проверьте итоговый CSV-файл на полноту и отсутствие пустых полей.

##### Задание 4. Обучение команды: Моделирование викторины и обратной связи (AI as Coach)

* **Контекст:** Обучение новых менеджеров по продажам работе с возражениями.
* **Инструкция по книге:** Создайте симулятор на базе ИИ для реализации «Осознанной практики» (Deliberate Practice).
* **Практический шаг:**
  1. Задайте ИИ инструкцию симулятора: *«Ты — требовательный B2B-клиент интернет-магазина одежды, который считает наши цены завышенными на 30%. Я — менеджер по продажам. Задавай по одному возражению за раз. После моего ответа оценивай мой ответ по шкале от 1 до 5, давай краткую критику и задавай следующее возражение»*.
  2. Проведите 5 раундов диалога.
  3. В конце попросите ИИ выдать итоговый отчёт: *«Сделай сводку моих сильных и слабых сторон на основе проведённого диалога»*.

##### Задание 5. Категоризация процессов отдела: Матрица задач «Just Me / Delegated / Automated»

* **Контекст:** Оптимизация загрузки аналитического отдела с помощью ИИ.
* **Инструкция по книге:** Примените классификацию задач и аудит «Рваной границы».
* **Практический шаг:**
  1. Составьте полный список ежедневных задач аналитика (10–15 пунктов).
  2. Распределите задачи по 3 корзинам:
    * *Just Me:* Итоговая презентация стратегии перед советом директоров.
    * *Delegated:* Суммаризация 50-страничных отчётов и написание первичного кода обработчиков данных.
    * *Automated:* Регулярная очистка и форматирование логов данных через скрипты.
  3. Сформулируйте правила безопасности, чтобы исключить «секретную автоматизацию» и поощрить прозрачный обмен эффективными промптами внутри команды.
